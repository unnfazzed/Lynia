appId: zw.co.lynia
env:
  CUSTOMER_PHONE: ${CUSTOMER_PHONE}
  RIDER_PHONE: ${RIDER_PHONE}
  API_URL: ${API_URL}
---
# See the seeded available delivery requests. The "customer" side (broadcasting an order for the
# rider's board to show) is played over the API by customer-create-order.js — see
# customer/04-review-bids.yaml's comment for why one emulator can't drive both apps live.
#
# rider-ensure-verified.js makes this account a verified rider over the API before the UI login, so
# this flow passes standalone (not only after 02-kyc has run) — see that script's header.
- runScript:
    file: ../scripts/rider-ensure-verified.js
- runFlow: subflows/login-rider.yaml

- runFlow:
    when:
      visible: "Go online"
    commands:
      - tapOn:
          id: "online-toggle"
- assertVisible:
    text: "Go offline"
    timeout: 15000

- runScript:
    file: ../scripts/customer-create-order.js

- assertVisible: "Open orders"
- extendedWaitUntil:
    visible: "Make an offer"
    timeout: 20000
