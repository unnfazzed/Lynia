appId: zw.co.lynia
---
# Reusable rider sign-in, called via `runFlow` from every rider/*.yaml. Mirrors
# customer/subflows/login-customer.yaml — same QA console-OTP bypass, same idempotent
# when-visible branching — but picks the rider role on first run and lands on /rider, not /home.
- launchApp:
    clearState: false
    stopApp: true

- runFlow:
    when:
      visible: "Phone number"
    commands:
      - tapOn:
          id: "phone-input"
      - inputText: "${RIDER_PHONE}"
      - tapOn:
          id: "phone-submit"
      - assertVisible:
          id: "otp-verify"
          timeout: 15000
      - tapOn:
          id: "otp-verify"

- runFlow:
    when:
      visible: "Tell us who you are"
    commands:
      - tapOn:
          id: "profile-first-name"
      - inputText: "QA"
      - tapOn:
          id: "profile-last-name"
      - inputText: "Rider"
      - tapOn:
          id: "profile-id-number"
      - inputText: "63-000000-R-00"
      - tapOn:
          id: "profile-submit"

- runFlow:
    when:
      visible: "How do you want to start?"
    commands:
      - tapOn:
          id: "role-rider"
      - tapOn:
          id: "role-continue"

- runFlow:
    when:
      visible: "Turn on location"
    commands:
      - tapOn: "Not now"
- runFlow:
    when:
      visible: "Stay in the loop"
    commands:
      - tapOn: "Not now"

- assertVisible:
    text: "Become a rider|Go online|Go offline"
    timeout: 15000
