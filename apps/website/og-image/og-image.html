<!DOCTYPE html>
<!-- Source for site/assets/og-image.png (1200×630), built to the handoff README's TODO #2 spec:
     green #00B14F background, the LyniaGo mark and wordmark, and "Stay home. We'll bring it."
     The mark is the on-green treatment from assets/brand/lyniago-icon.svg (the app splash); the
     headline repeats the hero's type. Render with: node apps/website/og-image/render.mjs
     site/assets/* is served immutable, so a changed image needs a new file name (and og:image). -->
<html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:"Inter";font-weight:700;src:url("../site/assets/fonts/inter-700.woff2") format("woff2")}
@font-face{font-family:"Fredoka";font-weight:600;src:url("../site/assets/fonts/fredoka-600.woff2") format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px}
body{background:#00B14F;color:#fff;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;justify-content:space-between;padding:80px 88px 88px}
.logo{display:flex;align-items:center;gap:23px;font:600 60px/1 Fredoka,Inter;letter-spacing:-.01em}
.logo svg{width:84px;height:84px}
h1{font:700 118px/1 Inter;letter-spacing:-.035em}
h1 span{color:#FFD23F}
</style></head><body>
<div class="logo"><svg viewBox="0 0 96 96" aria-hidden="true"><polygon points="28,6 58,32 38,42" fill="#fff"/><polygon points="90,26 14,52 48,60" fill="#fff"/><polygon points="90,26 48,60 42,84" fill="#fff" opacity=".62"/><path d="M90 26 L48 60" stroke="#00B14F" stroke-width="2.4" fill="none"/><path d="M70.5 30.2 L81.5 43.8" stroke="#00B14F" stroke-width="2.4" fill="none"/></svg>LyniaGo</div>
<h1>Stay home.<br><span>We'll bring it.</span></h1>
</body></html>
