<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:20px}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Field } = window.LyniaDesignSystem_94c56a;
function Demo() {
  const [item, setItem] = React.useState("Documents envelope");
  const [fare, setFare] = React.useState("2.50");
  const [lm, setLm] = React.useState("Eastgate Mall, CBD");
  const [note, setNote] = React.useState("Ask for Rita at the pharmacy counter; parcel is fragile.");
  return (
    <div className="wrap">
      <div>
        <Field label="What are you sending?" value={item} onChange={setItem} />
        <Field label="Your price (USD)" value={fare} onChange={setFare} inputMode="decimal" hint="Riders on this route usually accept around $2.40." />
      </div>
      <div>
        <Field label="Pickup landmark" value={lm} onChange={setLm} fromMap />
        <Field label="National ID number" value="12-34" onChange={()=>{}} inputMode="numeric" error="Enter the 8–12 digits on your ID card." />
        <Field label="Note for the rider (optional)" value={note} onChange={setNote} multiline rows={3} maxLength={280} placeholder="Ask for Rita at the pharmacy counter; parcel is fragile." hint="The rider confirms this before collecting." />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
