<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:20px}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.grp{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.pills{display:flex;flex-wrap:wrap;gap:8px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/lynia-icons.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Card, StatusPill, Icon } = window.LyniaDesignSystem_94c56a;
function Demo() {
  return (
    <div className="wrap">
      <div>
        <div className="grp">Buttons</div>
        <Button label="Broadcast request" />
        <Button label="Add details" variant="ghost" />
        <Button label="Sending…" loading />
        <Button label="Choose this rider" disabled />
      </div>
      <div>
        <div className="grp">Card</div>
        <Card>
          <div style={{fontWeight:700,fontSize:16}}>Tendai M.</div>
          <div style={{fontSize:13,color:'var(--muted)'}}>★ 4.8 · 132 trips · ETA 7 min</div>
          <div style={{fontSize:20,fontWeight:700,margin:'4px 0'}} className="lynia-tabular">$2.50</div>
        </Card>
        <Card accent><div style={{fontWeight:700}}>Accent card — active job</div></Card>
        <div className="grp" style={{marginTop:12}}>Status pills</div>
        <div className="pills">
          <StatusPill status="en_route_pickup" />
          <StatusPill status="Online" tone="online" dot />
          <StatusPill status="Offline" tone="offline" dot />
          <StatusPill status="reconnecting" tone="reconnecting" dot />
        </div>
        <div className="grp" style={{marginTop:12}}>Icons (Lucide)</div>
        <div className="pills" style={{color:'var(--accent-text)',alignItems:'center'}}>
          <Icon name="bike" /><Icon name="package" /><Icon name="map-pin" /><Icon name="phone" /><Icon name="banknote" /><Icon name="id-card" /><Icon name="inbox" /><Icon name="wifi-off" /><Icon name="star" color="var(--highlight)" fill="var(--highlight)" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
