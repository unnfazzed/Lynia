<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LyniaGo — single screen viewer</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:#eceff1;font-family:var(--font-sans);color:var(--ink);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px;box-sizing:border-box}
  .phone{width:360px;min-height:740px;background:var(--surface);border-radius:34px;border:10px solid #14181b;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(20,24,27,.28)}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:22px;background:#14181b;border-radius:0 0 14px 14px;z-index:20}
  .scroll{height:740px;overflow-y:auto}
  a{color:var(--accent-text)}a:hover{color:var(--accent-700)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/lynia-icons.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div class="phone"><div class="notch"></div><div class="scroll"><div id="root"></div></div></div>
<script type="text/babel" src="../../ui_kits/mobile/kit-parts.js"></script>
<script type="text/babel" src="../../ui_kits/support/parts.js"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens-safety.jsx"></script>
<script type="text/babel" src="rider-screens.jsx"></script>
<script type="text/babel" src="rider-screens-wallet.jsx"></script>
<script type="text/babel" src="rider-screens-safety.jsx"></script>
<script type="text/babel">
  const params = new URLSearchParams(location.search);
  const id = params.get("id") || "earnings";
  const src = (params.get("role") === "customer" ? window.LJ : window.RJ) || {};
  const render = src[id] || (window.RJ && window.RJ[id]) || (window.LJ && window.LJ[id]);
  let body;
  try { body = render ? render() : <div style={{ padding: 20, fontSize: 13, color: "var(--muted)" }}>Screen "{id}" not found.</div>; }
  catch (e) { body = <div style={{ padding: 20, fontSize: 13, color: "var(--danger)" }}>Failed to render "{id}": {String(e)}</div>; }
  ReactDOM.createRoot(document.getElementById("root")).render(body);
</script>
</body>
</html>
