<!-- @dsCard group="Type" viewport="700x150" name="Tabular numerals" subtitle="Lining tabular figures for fares, ETAs, ratings, timers" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 18px 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cell { border: 1px solid var(--line); border-radius: var(--radius-card); padding: 12px; }
  .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cap { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="val">$2.50</div><div class="cap">Agreed fare</div></div>
    <div class="cell"><div class="val" style="color:var(--accent-text)">7 min</div><div class="cap">ETA to pickup</div></div>
    <div class="cell"><div class="val">4.8<span style="color:var(--highlight)">★</span></div><div class="cap">Rating · 132</div></div>
    <div class="cell"><div class="val" style="color:var(--danger)">0:18</div><div class="cap">Window left</div></div>
  </div>
</body>
</html>
