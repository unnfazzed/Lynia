<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & targets" subtitle="Input 12 · card 16 · button pill · targets 44/52" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 20px; }
  .row { display: flex; gap: 16px; align-items: center; }
  .item { text-align: center; }
  .box { width: 88px; height: 56px; background: var(--surface); border: 1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); font-weight:700; }
  .lab { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .tok { font-size: 12px; color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:12px">input</div><div class="tok">12px</div><div class="lab">--radius-input</div></div>
    <div class="item"><div class="box" style="border-radius:16px">card</div><div class="tok">16px</div><div class="lab">--radius-card</div></div>
    <div class="item"><div class="box" style="border-radius:999px">pill</div><div class="tok">999px</div><div class="lab">--radius-pill</div></div>
    <div class="item"><div class="box" style="border-radius:999px;height:52px;background:var(--accent);color:var(--on-accent);border:none">CTA 52</div><div class="tok">44 / 52</div><div class="lab">touch targets</div></div>
  </div>
</body>
</html>
