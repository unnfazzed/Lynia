<!-- @dsCard group="Brand" viewport="700x460" name="Splash & loader animation" subtitle="Dove folds together, lifts off; compact looping loader" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LyniaGo — splash & loader</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin:0; height:100%; }
  body { font-family:var(--font-sans); background:var(--surface); display:flex; gap:20px; align-items:center; justify-content:center; padding:22px; box-sizing:border-box; }
  .panel { position:relative; border-radius:24px; overflow:hidden; box-shadow:0 10px 30px rgba(20,24,27,.16); }

  /* ---- Splash (full brand screen) ---- */
  .splash { width:300px; height:420px; background:var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
  .dove { filter: drop-shadow(0 6px 14px rgba(0,0,0,.18)); }
  /* each paper facet folds in, then the whole bird lifts */
  .facet { opacity:0; transform-box:fill-box; transform-origin:center; }
  .wing { animation: fold .5s ease-out .15s forwards; }
  .bodyf { animation: fold .5s ease-out .38s forwards; }
  .keel { animation: fold .5s ease-out .60s forwards; }
  .crease { opacity:0; animation: ink .4s ease-out .95s forwards; }
  .doveWrap { animation: liftLoop 2.4s ease-in-out 1.15s infinite; }
  .wm { opacity:0; font-family:var(--font-wordmark); font-weight:600; font-size:34px; color:#fff; animation: rise .55s cubic-bezier(.2,.7,.3,1) 1.15s forwards; }
  @keyframes fold { from { opacity:0; transform:scale(.4) rotate(-12deg); } to { opacity:1; transform:none; } }
  @keyframes ink { to { opacity:1; } }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes liftLoop { 0%,100% { transform:translateY(0) rotate(0); } 50% { transform:translateY(-9px) rotate(-2.5deg); } }

  /* ---- Compact loader (in-app) ---- */
  .loader { width:300px; height:420px; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .loadDove { animation: flit 1.15s ease-in-out infinite; }
  @keyframes flit { 0%,100% { transform:translate(0,0) rotate(0); } 50% { transform:translate(4px,-7px) rotate(-4deg); } }
  .loadText { font-size:13px; color:var(--muted); font-weight:600; }
  .trail { display:flex; gap:6px; margin-top:2px; }
  .trail i { width:7px; height:7px; border-radius:50%; background:var(--accent); opacity:.3; animation: blip 1.15s ease-in-out infinite; }
  .trail i:nth-child(2){ animation-delay:.15s; } .trail i:nth-child(3){ animation-delay:.3s; }
  @keyframes blip { 0%,100% { opacity:.25; transform:translateY(0);} 50% { opacity:1; transform:translateY(-3px);} }

  .tag { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:11px; color:rgba(255,255,255,.85); font-weight:600; }
  .loader .tag { color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { .facet,.crease,.wm { animation:none !important; opacity:1 !important; transform:none !important; } .doveWrap,.loadDove,.trail i { animation:none !important; } }
  .replay { position:absolute; top:12px; right:12px; z-index:5; border:none; background:rgba(255,255,255,.9); color:var(--ink); font-family:var(--font-sans); font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; cursor:pointer; }
</style>
</head>
<body>
  <div class="panel splash" id="splash">
    <button class="replay" onclick="replay()">↻ Replay</button>
    <div class="doveWrap">
      <svg class="dove" width="120" height="120" viewBox="0 0 96 96" aria-label="LyniaGo">
        <polygon class="facet wing"  points="28,6 58,32 38,42" fill="#fff"/>
        <polygon class="facet bodyf" points="90,26 14,52 48,60" fill="#fff"/>
        <polygon class="facet keel"  points="90,26 48,60 42,84" fill="#fff" opacity=".62"/>
        <path class="crease" d="M90 26 L48 60 M70.5 30.2 L81.5 43.8" stroke="var(--accent)" stroke-width="2.4" fill="none"/>
      </svg>
    </div>
    <div class="wm">Lynia<span style="color:#d6f5e2">Go</span></div>
    <div class="tag">Splash — launch</div>
  </div>

  <div class="panel loader">
    <svg class="loadDove" width="72" height="72" viewBox="0 0 96 96" aria-hidden="true">
      <polygon points="28,6 58,32 38,42" fill="var(--accent)"/>
      <polygon points="90,26 14,52 48,60" fill="var(--accent)"/>
      <polygon points="90,26 48,60 42,84" fill="var(--accent-700)"/>
      <path d="M90 26 L48 60 M70.5 30.2 L81.5 43.8" stroke="#fff" stroke-width="2.4" fill="none"/>
    </svg>
    <div class="loadText">Finding your rider…</div>
    <div class="trail"><i></i><i></i><i></i></div>
    <div class="tag">Loading state — in-app</div>
  </div>

  <script>
    function replay(){
      const s = document.getElementById('splash');
      s.querySelectorAll('.facet,.crease,.wm,.doveWrap').forEach(el=>{
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      });
    }
  </script>
</body>
</html>
