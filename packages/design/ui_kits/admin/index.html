<!-- @dsCard group="Admin console" viewport="1280x800" name="Overview dashboard" subtitle="Key pilot metrics, needs-attention queue, recent orders — live/empty/loading/offline states" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lynia ops — overview</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="shell">
  <aside class="sidenav" id="sidenav"></aside>
  <main class="content" data-screen-label="Overview dashboard">
    <nav class="topnav" id="topnav"></nav>
    <header class="page">
      <h1>Overview</h1>
      <span class="sub" id="scope-sub">Harare pilot · Eastlea–CBD corridor</span>
      <span class="conn" id="conn">● live</span>
    </header>
    <div class="offline-banner" id="offline-banner"></div>

    <section class="panels stale-dim" id="kpis"></section>

    <section class="card substrip stale-dim" id="substrip"></section>

    <section class="block stale-dim">
      <div class="card">
        <div class="block-title">Needs attention <span class="count" id="attn-count"></span></div>
        <div id="attn"></div>
      </div>
    </section>

    <section class="block stale-dim">
      <div class="card">
        <div class="block-title">Recent orders <span class="right"><a href="orders.html" style="color:var(--accent-text);text-decoration:none;font-weight:600">All orders →</a></span></div>
        <table class="data">
          <thead><tr><th>Order</th><th>Route</th><th>Status</th><th>Rider</th><th>Fare</th><th>Created</th></tr></thead>
          <tbody id="recent"></tbody>
        </table>
        <div id="recent-empty"></div>
      </div>
    </section>
  </main>
</div>

<script src="../../assets/lynia-icons.js"></script>
<script>
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "density": "comfortable",
    "nav": "sidebar",
    "volume": "pilot",
    "state": "live"
  }/*EDITMODE-END*/;
</script>
<script src="shell.js"></script>
<script>
  const RECENT = [
    { id: "8f3a91c2", route: "Eastgate → Avenues", status: "open_for_offers", rider: "—", fare: "2.50", when: "2 min ago" },
    { id: "3b71de04", route: "Avondale → CBD", status: "en_route_dropoff", rider: "Tendai M.", fare: "2.20", when: "14 min ago" },
    { id: "b5209e77", route: "CBD → Mbare", status: "picked_up", rider: "Kudzai N.", fare: "1.80", when: "19 min ago" },
    { id: "c092a5f1", route: "Borrowdale → Msasa", status: "delivered", rider: "Kudzai N.", fare: "4.00", when: "31 min ago" },
    { id: "77c120ab", route: "CBD → Belvedere", status: "expired", rider: "—", fare: "1.50", when: "2 hr ago" },
  ];
  const RECENT_GROWTH = [
    { id: "e410cc28", route: "Highlands → CBD", status: "en_route_pickup", rider: "Nyasha G.", fare: "3.20", when: "4 min ago" },
    { id: "90daf113", route: "Mabelreign → Avondale", status: "completed", rider: "Farai R.", fare: "2.70", when: "48 min ago" },
    { id: "45b8e2d0", route: "Msasa → Greendale", status: "cancelled", rider: "—", fare: "2.00", when: "1 hr ago" },
  ];

  const ATTN = [
    { icon: "triangle-alert", bad: true, text: "<b>Order 3b71de04 may be stuck</b> — no GPS update from Tendai M. for 22 min en route to drop-off.", href: "orders.html", act: "Review order" },
    { icon: "circle-alert", bad: true, text: "<b>Open dispute</b> — recipient says parcel c092a5f1 never arrived; delivery code was not entered.", href: "issues.html", act: "Investigate" },
    { icon: "id-card", bad: false, text: "<b>3 riders waiting on KYC</b> — oldest application has been in the queue 26 hours.", href: "kyc.html", act: "Review queue" },
    { icon: "banknote", bad: false, text: "<b>1 settlement overdue</b> — Farai R. owes $12.40 commission, due 3 days ago.", href: "cash.html", act: "View" },
  ];

  function kpiCard(label, value, hint) {
    return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`;
  }

  function render(env) {
    const g = env.volume === "growth";
    const loading = env.state === "loading";
    const empty = env.state === "empty";
    const sk = `<span class="skel">————</span>`;

    document.getElementById("scope-sub").textContent = g ? "Harare · 3 corridors" : "Harare pilot · Eastlea–CBD corridor";

    /* KPIs */
    document.getElementById("kpis").innerHTML = loading
      ? [1, 2, 3, 4].map(() => kpiCard(sk, sk, sk)).join("")
      : empty
        ? kpiCard("Live orders", "0", "none open right now") + kpiCard("Riders online", `0/${g ? 61 : 23}`, "online / verified") + kpiCard("Completed today", "0", "no trips yet today") + kpiCard("Fares today", "$0.00", "agreed fares, all cash")
        : kpiCard("Live orders", g ? "37" : "12", "open for offers + in delivery")
          + kpiCard("Riders online", g ? "42/61" : "9/23", "online / verified")
          + kpiCard("Completed today", g ? "118 <span class=\"hint\" style=\"font-size:13px;font-weight:600\">· 93%</span>" : "31 <span class=\"hint\" style=\"font-size:13px;font-weight:600\">· 91%</span>", "completion rate")
          + kpiCard("Fares today", g ? "$318.70" : "$86.40", "agreed fares, all cash");

    /* Secondary strip */
    const m = (v, l) => `<span class="m"><b>${loading ? sk : v}</b>${l}</span>`;
    document.getElementById("substrip").innerHTML = empty
      ? `<span class="m">Funnel metrics appear after the first broadcast of the day.</span>`
      : m(g ? "38s" : "42s", "avg time to first offer") + m(g ? "9%" : "11%", "expiry rate") + m(g ? "5%" : "6%", "cancelled")
        + m("3", "KYC pending") + m(g ? "19 / 6" : "5 / 2", "new customers / riders") + m(g ? "2.4" : "2.8", "offers per broadcast");

    /* Needs attention */
    const attn = document.getElementById("attn");
    if (loading) {
      attn.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">${'<span class="skel" style="display:block;height:18px">—</span>'.repeat(3)}</div>`;
      document.getElementById("attn-count").textContent = "";
    } else if (empty) {
      attn.innerHTML = AdminShell.emptyState("check", "Nothing needs you right now", "Stuck orders, disputes and overdue settlements will surface here.");
      document.getElementById("attn-count").textContent = "";
    } else {
      document.getElementById("attn-count").textContent = ATTN.length;
      attn.innerHTML = ATTN.map((a) =>
        `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px">
          <i data-lucide="${a.icon}" style="width:16px;height:16px;flex:none;color:${a.bad ? "var(--danger)" : "var(--muted)"}"></i>
          <span style="flex:1">${a.text}</span>
          <a class="btn ghost" href="${a.href}">${a.act}</a>
        </div>`).join("");
      attn.firstElementChild && (attn.firstElementChild.style.borderTop = "none");
    }

    /* Recent orders */
    const rows = AdminShell.vol(env, RECENT, RECENT_GROWTH);
    const tb = document.getElementById("recent");
    const em = document.getElementById("recent-empty");
    em.innerHTML = "";
    if (loading) tb.innerHTML = AdminShell.skelRows(6, 5);
    else if (empty) { tb.innerHTML = ""; em.innerHTML = AdminShell.emptyState("inbox", "No orders yet today", "The corridor usually wakes up around 8 am."); }
    else tb.innerHTML = rows.map((o) =>
      `<tr class="rowlink" onclick="location.href='orders.html'">
        <td class="mono">${o.id}</td><td>${o.route}</td><td>${AdminShell.statusPill(o.status)}</td>
        <td>${o.rider}</td><td class="num">$${o.fare}</td><td class="mut">${o.when}</td>
      </tr>`).join("");
  }

  AdminShell.init({ page: "overview", onRender: render });
</script>
</body>
</html>
