<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LyniaGo — Customer Home 8c (handoff)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181b;--muted:#5b6670;--bg:#ffffff;--surface:#f6f7f8;--line:#e2e6ea;--accent:#00b14f;--accent-700:#009d3b;--accent-text:#006630;--accent-wash:#e9f8ef;--cta-fill:#00812f;--highlight:#f2b705;--font-sans:'Inter',system-ui,sans-serif}
body{margin:0;background:#e9ebee;font-family:var(--font-sans);color:var(--ink);display:grid;place-items:start center;padding:24px 0}
a{color:var(--accent-text)}a:hover{color:var(--accent-700)}
.screen{width:360px;height:720px;background:var(--bg);overflow:hidden;position:relative;border-radius:24px;outline:1px solid var(--line)}
.ic{display:inline-grid;place-items:center;flex-shrink:0}.ic svg{width:100%;height:100%;display:block}
.sb{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:2px;align-items:flex-end}.bars i{width:3px;background:currentColor;border-radius:1px;display:block}
.batt{width:18px;height:9px;border-radius:2.5px;background:currentColor;margin-left:6px}.sbr{display:flex;align-items:center}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:7px 0 10px;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--accent-text);font-weight:700}
.prog{display:flex;gap:4px}.prog i{flex:1;height:3px;border-radius:2px;background:var(--line)}.prog i.on{background:var(--accent)}
.sech{display:flex;align-items:baseline;padding:14px 16px 8px}.sech b{flex:1;font-size:16px;font-weight:700}.sech span{font-size:12.5px;font-weight:700;color:var(--accent-text)}
.rc{border-radius:16px;background:var(--bg);overflow:hidden}.rc .ph{position:relative}.rc img{width:100%;object-fit:cover;display:block}
.etap{position:absolute;right:8px;bottom:8px;background:var(--bg);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.rcb{padding:7px 10px 9px}.rcb .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcb .m{display:flex;gap:6px;margin-top:2px;font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rcb .m .st{color:var(--highlight)}.rcb .m .fee{margin-left:auto;font-weight:700;color:var(--accent-text)}
.pill{border:none;border-radius:999px;font-family:var(--font-sans);font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="screen">
  <div style="background:var(--accent-wash);padding-bottom:24px">
    <div class="sb"><span>9:41</span><span class="sbr"><span class="bars"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i></span><span class="batt"></span></span></div>
    <div style="padding:16px 18px 0;display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="font-size:25px;font-weight:700;letter-spacing:-.01em">Good morning, Rudo</div>
        <div style="display:flex;align-items:center;gap:4px;margin-top:11px;font-size:12.5px;font-weight:600;color:var(--accent-text)"><span class="ic" style="width:13px;height:13px"><i data-lucide="map-pin"></i></span>12 Samora Machel Ave<span class="ic" style="width:13px;height:13px"><i data-lucide="chevron-down"></i></span></div>
      </div>
      <svg width="46" viewBox="0 0 64 64" style="margin-right:2px"><circle cx="32" cy="32" r="13" fill="#f2b705"/><circle cx="27" cy="27" r="4.5" fill="#ffd76b"/><g stroke="#f2b705" stroke-width="4.5" stroke-linecap="round"><path d="M32 9v6M32 49v6M9 32h6M49 32h6M16 16l4.5 4.5M43.5 43.5 48 48M48 16l-4.5 4.5M20.5 43.5 16 48"/></g></svg>
      <span style="width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;position:relative"><span class="ic" style="width:18px;height:18px;color:var(--accent-text)"><i data-lucide="bell"></i></span><span style="position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--highlight);border:1.5px solid var(--bg)"></span></span>
    </div>
    <div style="margin:16px 18px 0;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px 15px">
      <span class="ic" style="width:16px;height:16px;color:var(--muted)"><i data-lucide="search"></i></span>
      <span style="font-size:12.5px;color:var(--muted)">Search food, or send a parcel</span>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 0">
    <button class="pill" style="position:relative;background:var(--accent-wash);border-radius:16px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="height:44px;display:grid;place-items:center;position:relative"><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:42px;height:42px;border-radius:50%;background:#cdeeda"></span><img src="./assets/send.svg" alt="" style="width:50px;position:relative"></span><span style="font-size:12px;font-weight:400;letter-spacing:.01em;color:var(--ink)">Send</span></button>
    <button class="pill" style="position:relative;background:#fdeadd;border-radius:16px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="height:44px;display:grid;place-items:center;position:relative"><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:42px;height:42px;border-radius:50%;background:#fbd9bd"></span><img src="./assets/food.svg" alt="" style="width:56px;margin-top:4px;position:relative"></span><span style="font-size:12px;font-weight:400;letter-spacing:.01em;color:var(--ink)">Restaurants</span></button>
    <button class="pill" style="position:relative;background:#dff4ee;border-radius:16px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="position:absolute;top:6px;right:6px;background:var(--highlight);color:#3d3100;font-size:8.5px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:2px 5px">SOON</span><span style="height:44px;display:grid;place-items:center;position:relative"><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:42px;height:42px;border-radius:50%;background:#c5e9df"></span><img src="./assets/pharmacy.svg" alt="" style="width:53px;margin-top:3px;position:relative"></span><span style="font-size:12px;font-weight:400;letter-spacing:.01em;color:var(--ink)">Pharmacy</span></button>
  </div>
  <div style="margin:14px 16px 0;background:var(--accent-wash);border-radius:999px;padding:9px 14px 9px 10px;display:flex;align-items:center;gap:10px">
    <span style="width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex-shrink:0"><span class="ic" style="width:17px;height:17px;color:#fff"><i data-lucide="bike"></i></span></span>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:700">Tendai M. · on the way</div>
      <div class="prog" style="margin-top:5px"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i style="background:#cdeeda"></i><i style="background:#cdeeda"></i></div>
    </div>
    <span style="background:var(--highlight);color:#3d3100;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 9px;font-variant-numeric:tabular-nums;flex-shrink:0">12 min</span>
  </div>
  <div class="sech"><b>Popular near you</b><span>See all →</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px">
    <div class="rc" style="width:auto;box-shadow:none;border:1px solid var(--line)"><div class="ph"><img src="./assets/food/biryani-1.jpg" alt="" style="height:76px"><span class="etap" style="box-shadow:none;border:1px solid var(--line)">25 min</span></div><div class="rcb"><div class="n">Golden Bao</div><div class="m"><span><span class="st">★</span> <b>4.9</b></span><span class="fee">$1.00</span></div></div></div>
    <div class="rc" style="width:auto;box-shadow:none;border:1px solid var(--line)"><div class="ph"><img src="./assets/food/rice-1.jpg" alt="" style="height:76px"><span class="etap" style="box-shadow:none;border:1px solid var(--line)">25 min</span></div><div class="rcb"><div class="n">Mbuya's Kitchen</div><div class="m"><span><span class="st">★</span> <b>4.8</b></span><span class="fee">$1.00</span></div></div></div>
    <div class="rc" style="width:auto;box-shadow:none;border:1px solid var(--line)"><div class="ph"><img src="./assets/food/dosa-1.jpg" alt="" style="height:76px"><span class="etap" style="box-shadow:none;border:1px solid var(--line)">30 min</span></div><div class="rcb"><div class="n">Fresh Press</div><div class="m"><span><span class="st">★</span> <b>4.5</b></span><span class="fee">$1.50</span></div></div></div>
    <div class="rc" style="width:auto;box-shadow:none;border:1px solid var(--line)"><div class="ph"><img src="./assets/food/burger-1.jpg" alt="" style="height:76px"><span class="etap" style="box-shadow:none;border:1px solid var(--line)">30 min</span></div><div class="rcb"><div class="n">Harare Grill Co.</div><div class="m"><span><span class="st">★</span> <b>4.6</b></span><span class="fee">$1.50</span></div></div></div>
  </div>
  <div class="tabbar">
    <span class="tab on"><span class="ic" style="width:21px;height:21px"><i data-lucide="store"></i></span>Home</span>
    <span class="tab"><span class="ic" style="width:21px;height:21px"><i data-lucide="receipt"></i></span>Orders</span>
    <span class="tab"><span class="ic" style="width:21px;height:21px"><i data-lucide="user"></i></span>Account</span>
  </div>
</div>
<script src="./lynia-icons.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
