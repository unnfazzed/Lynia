<style>
html,body{margin:0}html{scroll-behavior:smooth}
body{background:#eceff1;font-family:var(--font-sans);color:var(--ink)}
a{color:var(--accent-text)}a:hover{color:var(--ink)}
.nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;align-items:center;padding:6px 16px;overflow-x:auto;scrollbar-width:none}
.nav b{font-size:14px;margin-right:10px;white-space:nowrap}
.nav a{height:36px;display:flex;align-items:center;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;color:var(--muted);white-space:nowrap}
.nav a:hover{background:var(--surface);color:var(--ink)}.nav a.on{background:var(--accent-wash);color:var(--accent-text)}
main{padding:28px 24px 80px}section{scroll-margin-top:64px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:48px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:760px;line-height:1.5}
.grid{display:flex;flex-wrap:wrap;gap:36px 28px;align-items:flex-start;margin-top:16px}
.cell{display:flex;flex-direction:column;gap:8px;scroll-margin-top:64px}
.lab{font:600 13px/1.35 var(--font-sans);max-width:360px}.lab span{color:var(--muted);font-weight:400}
.lab em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;text-wrap:pretty}
.badge{display:inline-flex;min-width:26px;height:20px;padding:0 6px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;align-items:center;justify-content:center;margin-right:6px;box-sizing:border-box}
.flag{display:inline-flex;height:18px;padding:0 6px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em;align-items:center;margin-right:6px;vertical-align:1px;background:var(--accent-wash);color:var(--accent-text)}
.proto{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;margin-top:16px}
.rail{width:280px;background:var(--bg);border-radius:12px;padding:8px;max-height:760px;overflow:auto;box-sizing:border-box}
.rail h4{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 8px 4px}
.rail button{all:unset;box-sizing:border-box;display:flex;gap:8px;align-items:center;width:100%;min-height:36px;padding:4px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.rail button:hover{background:var(--surface)}.rail button.on{background:var(--accent-wash);color:var(--accent-text);font-weight:700}
.rail button .badge{background:var(--surface);color:var(--muted);flex:none}.rail button.on .badge{background:var(--accent-text);color:#fff}
.pctl{display:flex;flex-direction:column;gap:10px;align-items:center}
.pbtns{display:flex;gap:8px;align-items:center}
.pbtns button{all:unset;cursor:pointer;height:40px;padding:0 16px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:700;color:var(--accent-text);box-shadow:0 0 0 1px var(--line)}
.pbtns button:hover{background:var(--accent-wash)}.pbtns span{font-size:13px;color:var(--muted);min-width:120px;text-align:center}
.card{max-width:860px;font-size:14px;line-height:1.55;background:var(--bg);border-radius:12px;padding:20px 24px;margin-top:16px}
.card h3{font-size:14px;margin:16px 0 6px}.card h3:first-child{margin-top:0}.card ul{margin:0;padding-left:18px}
.card table{border-collapse:collapse;width:100%;font-size:13px}.card td,.card th{border-top:1px solid var(--line);padding:7px 8px 7px 0;vertical-align:top;text-align:left}.card td:first-child{font-weight:600}
.copy{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;max-width:1400px;margin-top:16px}
.copy div{background:var(--bg);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5}.copy b{display:block;margin-bottom:6px}.copy ul{margin:0;padding-left:16px}
.sc2-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sc2r .8s linear infinite;box-sizing:border-box}
.as-spin{display:inline-block;flex:none;border-radius:50%;border:2.5px solid;animation:sc2r .8s linear infinite;box-sizing:border-box}
.sc2-caret{display:inline-block;width:2px;height:18px;background:var(--accent-text);vertical-align:-3px;margin-left:1px}
@keyframes sc2r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.as-spin,.sc2-spin{animation-duration:2.4s}}
.lynia-tabular{font-variant-numeric:tabular-nums}
</style>

function Cell({ s, W, H, suffix = "" }) {

    <Lazy W={W} H={H}>{s[5](W, H)}</Lazy>

}
function Proto() {

  React.useEffect(() => { localStorage.setItem("rv2-proto-idx", i); }, [i]);
  React.useEffect(() => { const k = (e) => { if (e.key === "ArrowRight") go(i + 1); if (e.key === "ArrowLeft") go(i - 1); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, [i]);
  const s = ST[i];
  return <div className="proto">
    <div className="rail">{G.map(([g, gl]) => <div key={g}><h4>{gl}</h4>{ST.map((x, j) => x[1] === g ? <button key={x[0]} className={j === i ? "on" : ""} onClick={() => setI(j)}><span className="badge">{x[0]}</span>{x[2]}</button> : null)}</div>)}</div>
    <div className="pctl">
      <div onClick={() => go(i + 1)} style={{ cursor: "pointer" }} key={s[0] + sm}>{sm ? s[5](320, 640) : s[5](360, 720)}</div>

      <div className="lab" style={{ textAlign: "center" }}><span className="badge">{s[0]}</span>{s[2]}<em>{s[3]}</em></div>

function Nav() {

}
function CopyList() {
  const [copy, setCopy] = React.useState(null), [go, setGo] = React.useState(false);

}
const INV = [
  ["Keep (restyle header/CTA only)", "RJ splash, onboard, login, otp, role_select, perm_loc, perm_notif · RJ kyc_intro, kyc_form, photo_capture, photo_preview, photo_uploading, photo_failed · notifications inbox (shared) · RJ report, report_done, sos_contacts"],
  ["Redesign", "RJM board, board_empty, board_food_off, board_empty_food_off (J1–J5) · RJM offer_parcel (O1) · RJM offer_food (F1) · RJM active_parcel, active_food (A1, B1) · RJM money (M1) · RJM account (C1) · RJ settings (S1) · RJ bike_docs (S5) · RJ history (C12) · RJ help (S6) · every gate (G1–G15)"],
  ["Merge", "RJ job_assigned + job_pickup → A1 · RJ job_collect + RJM pickup_photo_failed → A6 · RJM handoff + RJ job_handoff → A8 · RJ wallet_low → M5 · RJM gate_topup → G14 · RJ kyc_pending/unfinished/verified also appear as Account cards C8–C11 · five ghost exits → X1"],
  ["New", "J8 notifications off · J9–J10 withdraw · O2 over-fare · F2–F3 · A10–A12 · B2, B5, B6 · X3, X7, X11, X12 · M2, M7–M12 · T1, T3 · C3–C11, C13 · S2–S4"],

function Page() {

    <main>
      <h1>LyniaGo Rider v2</h1>
      <p className="sub">The rider side, redrawn in the Send v2 / After Send kit: map-first board with demand, a one-action active job that mirrors the customer's After Send, earnings-first Money, and sibling Customer/Rider Account tabs with a visible role switch. {ST.length} states at 360 × 720; key states again at 320 × 640.</p>

  </>;
