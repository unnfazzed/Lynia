  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Own bikers v1 · all screens<\u002Ftitle>\n<style>/* Lynia typeface — Inter (the same typeface Grab's app uses in-product; free, SIL Open Font License).\n\n   SELF-HOSTED, DATA-LIGHT (Zimbabwe: expensive data, slow networks, cheap Android phones):\n   - Only THREE weights ship as Latin .woff2 in assets/fonts/ — 400 (body), 600 (labels/buttons),\n     700 (titles). Total ~135KB, cached after first load, no third-party (Google Fonts) round-trip.\n   - `font-display: swap` + the system fallback stack in --font-sans mean text paints INSTANTLY in\n     Roboto (present on every Android) and upgrades to Inter when the webfont arrives. The design\n     must read correctly in the fallback — never depend on Inter-only metrics.\n   - Paths are relative to THIS file (tokens/) → ../assets/fonts/. If you relocate the tokens,\n     fix the url()s. Consumers that link styles.css from a different depth get the fonts via this\n     same relative closure. */\n@font-face {\n  font-family: \"Inter\";\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d9ab640f-cac5-441b-9a29-bfabd7608e15\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Inter\";\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7c7961a7-ce7c-4ab7-99b9-253a28710fa2\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Inter\";\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f931c1df-479d-4159-ab06-22564d32530a\") format(\"woff2\");\n}\n\n/* Fredoka 600 — the LyniaGo / brand WORDMARK face only (never body/UI text). Self-hosted, one\n   Latin weight (~16KB), so the logo lockup never needs a Google Fonts round-trip and can't fail\n   on a weak network. Interim until the wordmark is shipped as vector outlines. Use via\n   --font-wordmark with a rounded-sans fallback so the lockup still reads if the font is slow. */\n@font-face {\n  font-family: \"Fredoka\";\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f42c8310-0c1a-494a-aa94-1b987abb8cfc\") format(\"woff2\");\n}\n<\u002Fstyle><style>/* Lynia colour system — light theme, Grab-style green.\n   Fills/CTAs use bright Grab green #00B14F; text and small icons use the darker text-green\n   (#006630, ≈7:1 on white) so sunlight legibility holds on cheap Android screens.\n   Neutrals stay the clean utility greys. Dark mode deferred. */\n:root {\n  /* ── Base palette ─────────────────────────────────────────── */\n  --ink: #14181b;         /* body text (≥4.5:1) */\n  --muted: #5b6670;       /* secondary text, captions */\n  --bg: #ffffff;          /* page background */\n  --surface: #f6f7f8;     /* sheets, chips, sunken areas */\n  --line: #e2e6ea;        /* borders, dividers */\n\n  --accent: #00b14f;      /* Grab green — fills, CTAs, big graphics ONLY (≈2.9:1 on white) */\n  --accent-700: #009d3b;  /* pressed / hover-deep fill */\n  --accent-text: #006630; /* text & small icons in green (≈7:1 on white) */\n  --accent-wash: #e9f8ef; /* light mint wash — selected states, chips */\n  --accent-wash-pressed: #d4f2e0; /* pressed mint wash — the empty state's soft pill (handoff/empty-states-v2-2026-10) */\n  /* Illustration mid-tone — the ONLY second tone allowed in two-tone service illustrations.\n     Sits between --accent-text and --accent (NOT between --accent and --accent-wash, since #00b14f is\n     only 2.59:1 on the wash, so anything lighter than the brand green fails the 3:1 floor for\n     meaningful graphics). #009947 = 3.39:1 on --accent-wash, 1.92:1 against --accent-text. */\n  --accent-illus: #009947;\n\n  /* Primary-CTA FILL — sunlight contrast decision APPLIED (2026-07-03).\n     Set to #00812f so white CTA labels clear ≈4.7:1 (WCAG AA large) — legible on cheap phones in\n     bright sun, per the spec. Kept separate from --accent so the brand green stays vibrant on\n     non-text fills (map graphics, chips, icon tiles). To re-tune, change ONLY these two lines:\n       #00b14f = brand-true (≈2.9:1, too low for sunlight)\n       #009d3b = 1 shade down (≈3.4:1)\n       #00812f = white-on-green ≈4.7:1 (AA large) — CURRENT\n       #006b27 = ≈6.3:1 if a darker press is wanted */\n  --cta-fill: #00812f;\n  --cta-fill-pressed: #006b27;\n  --highlight: #ffd23f;   /* gold, sparing: ETA chip, unread dot, header circle, star fill (Calm Mint v2 / D-55: was #f2b705) */\n  --danger: #c0392b;      /* errors, destructive */\n  --danger-wash: #faedeb; /* soft red wash — negative-balance hero, below-floor chip (never red text on white) */\n  --danger-ink: #8f2418;  /* darker danger text on --danger-wash (≈6:1) — owed labels, gate reason */\n  --danger-sun: #f4d9d5;  /* the decor sun on a danger hero panel (First Run v2, ledger D-82) — decor only, never text */\n  --success: #00b14f;     /* confirmation fills (== accent); use --accent-text for success TEXT */\n  --on-accent: #ffffff;   /* text/icons on an accent (or danger) fill — the one inverse */\n\n  /* Tints used in-product: earnings disclaimer card (gold wash), highlight border alpha. */\n  --highlight-wash: #fffcf2;\n  --highlight-ink: #6b5600;\n  --highlight-border: #ffd23f66;\n  /* Ink ON a solid --highlight gold chip (customer home 8c: the SOON chip and the ETA chip).\n     Distinct from --highlight-ink, which is gold TEXT on the pale --highlight-wash. */\n  --highlight-chip-ink: #3d3100;\n\n  /* ── Service-tile tints (customer home 8c, handoff/home-8c) ─── */\n  /* Each tile is a flat wash with a blob one shade deeper behind its sticker icon. Send reuses\n     --accent-wash / the mint blob; the other two verticals carry their own hue so three tiles read\n     apart at a glance without a border or a shadow between them. */\n  --tile-food-wash: #fdeadd;      /* Restaurants tile background */\n  --tile-pharmacy-wash: #dff4ee;  /* Pharmacy tile background */\n  --tile-send-blob: #cdeeda;      /* blob behind the Send sticker — also the tracker pill's unlit progress segment */\n  --tile-food-blob: #fbd9bd;\n  --tile-pharmacy-blob: #c5e9df;\n\n  /* Faux-3D illustration palette (handoff/tab-bar-v1) — same three-face recipe as assets/service-icons/v2\n     (top = light, left = mid, right = dark) + gold/coral/mint details. Illustrations ONLY, never text or\n     UI chrome. The idle set is the same recipe in neutrals (dark face ≥3:1 on white for meaningful graphics). */\n  --illus-light: #3ccb74;\n  --illus-mid: #00b14f;\n  --illus-dark: #00913c;\n  --illus-gold: #ffd23f;\n  --illus-coral: #ff6b4a;\n  --illus-mint: #b9e8cc;\n  --illus-sky: #3ec1f3;\n  --illus-idle-light: #dde1e5;\n  --illus-idle-mid: #aeb6bd;\n  --illus-idle-dark: #7d8790;\n  /* Splash v1 (handoff/splash-v1, ledger D-64): the website's pink blob — decorative only, never text. */\n  --illus-pink: #ff8ac5;\n\n  /* Home (Calm Mint v2) surfaces, shared with the tab bar so both read as one family (handoff/tab-bar-v1).\n     Tile tints = the service-tile backgrounds; each pairs with an ink that clears 3:1 on it (ring) and\n     --ink for text. --live-bar = the dark floating live-order bar. --rider-* = rider identity. */\n  --tile-mint: #cdeeda;      /* Send tile */\n  --tile-peach: #ffd9cc;     /* Restaurants tile */\n  --tile-lilac: #ddd5ff;     /* Shops tile */\n  --tile-sun: #fff6d6;\n  --coral-ink: #c2412a;      /* ≈3.6:1 on --tile-peach */\n  --sun-ink: #8a6a00;        /* ≈4.6:1 on --tile-sun */\n  --live-bar: #063b22;\n  --live-bar-ink: #bfe6cd;\n  --rider-accent: #4b2fbf;   /* ≈5.6:1 on --tile-lilac */\n  /* ── Calm Mint v2 (handoff/calm-mint-v2-2026-10, ledger D-55) ── */\n  --forest: #063b22;              /* the floating live-order bar */\n  --on-forest-muted: #bfe6cd;     /* secondary text on --forest */\n  --star-stroke: #c99500;         /* star outline (fill is --highlight) */\n  --free: #4b2fbf;                /* \"Free delivery\" tag fill, white text (7.9:1) — the website violet */\n  --coral: #ff6b4a;               /* decorative circle only, never text */\n  --sky: #3ec1f3;                 /* decorative circle only, never text */\n  --tile-send: #cdeeda;           /* service tile fills: Send · Restaurants · Shops · Pharmacy */\n  --tile-food: #ffd9cc;\n  --tile-shops: #ddd5ff;\n  --tile-pharmacy: #c5e9df;\n  --rider-wash: #ece8ff;          /* rider intro hero panel */\n\n  /* ── Splash v1 (handoff/splash-v1, ledger D-64) ── */\n  --on-accent-soft: #d6f5e2;      /* the wordmark's \"Go\" on the brand green (logotype only, ≈2.3:1) */\n  --on-ink-muted: #c9d0d6;        /* body text on an --ink panel (the splash offline panel) */\n  --highlight-chip-wash: #fff6d6; /* the pale gold \"Checking\" pill */\n  --kind-butchery: #ffe7e0;       /* shop-kind card tints (no photo): pharmacy reuses --tile-pharmacy-wash, */\n  --kind-fashion: #ffe4f2;        /* grocery --accent-wash, hardware/electronics/other --surface */\n  --kind-auto: #e3f6fe;\n  --kind-fashion-ink: #8a1f5c;    /* initial + kind chip ink on those tints (butchery uses --danger-ink, */\n  --kind-auto-ink: #0b5a7a;       /* pharmacy/grocery --accent-text) */\n\n  /* ── Semantic aliases ─────────────────────────────────────── */\n  --text-body: var(--ink);\n  --text-secondary: var(--muted);\n  --text-on-accent: var(--on-accent);\n  --text-accent: var(--accent-text);\n\n  --surface-page: var(--bg);\n  --surface-card: var(--bg);\n  --surface-sunken: var(--surface);\n  --surface-selected: var(--accent-wash);\n\n  --border-default: var(--line);\n  --border-strong: var(--muted);\n\n  --action-primary: var(--cta-fill);\n  --action-primary-pressed: var(--accent-700);\n  --marker-recommended: var(--highlight);\n  --state-error: var(--danger);\n  --state-success: var(--success);\n}\n<\u002Fstyle><style>/* Lynia type system — Inter everywhere (Grab's in-app typeface). Tabular numerals for fares,\n   ETAs and ratings. Grab-dense scale: 14px body, 12px captions, bold 18–24px titles.\n   Line-heights land on a 4px grid. */\n:root {\n  --font-sans: \"Inter\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-family: var(--font-sans);\n  /* Brand WORDMARK face (LyniaGo lockup only, never body/UI). Rounded-sans fallback so the\n     lockup still reads if Fredoka is slow to load. */\n  --font-wordmark: \"Fredoka\", \"Baloo 2\", \"Trebuchet MS\", var(--font-sans);\n\n  /* Weights — only 400/600/700 webfont files ship (data budget). 500 falls back to 400’s\n     file via synthesis-free mapping below; 800 is intentionally aliased to 700. */\n  --weight-regular: 400;\n  --weight-medium: 400;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 700; /* wordmark / monogram — aliased, no extra font file */\n\n  /* Type scale (px) — Grab-dense. */\n  --text-display: 28px;   /* delivery code, earnings total, admin metric */\n  --text-h1: 24px;        /* screen title (bold) */\n  --text-h2: 20px;        /* section title, offer price emphasis */\n  --text-title: 18px;     /* empty-state title, card title */\n  --text-price: 20px;     /* offer card fare (tabular) */\n  --text-body-lg: 16px;   /* inputs, primary button labels */\n  --text-body: 14px;      /* body, card meta */\n  --text-caption: 12px;   /* hints, disclaimers */\n  --text-label: 12px;     /* field labels, pills, meta */\n  --text-micro: 10px;     /* RECOMMENDED marker overline */\n\n  /* Line heights (≈4px grid at the scale sizes) */\n  --leading-tight: 1.15;\n  --leading-snug: 1.35;\n  --leading-body: 1.45;\n\n  /* Tabular numerals — apply to any numeric run (fares/ETAs/ratings/counts). */\n  --numeric-tabular: tabular-nums; /* @kind other */\n}\n\n/* Utility: opt any element into lining tabular figures (money, timers, ratings). */\n.lynia-tabular {\n  font-variant-numeric: tabular-nums;\n}\n<\u002Fstyle><style>/* Lynia spacing + radius + elevation. 8pt base scale. Grab shape language: primary CTAs are\n   full pills, cards are soft 16px, inputs 12px. Touch targets ≥ 44px (52px for primary). */\n:root {\n  /* ── Spacing (8pt) ────────────────────────────────────────── */\n  --space-xs: 4px;\n  --space-sm: 8px;\n  --space-md: 12px;\n  --space-lg: 16px;\n  --space-xl: 24px;\n  --space-2xl: 32px;\n  --space-3xl: 48px;\n  /* Screen edge padding — 16px, NOT 24px: designs must work at 320px-wide cheap Androids,\n     leaving 288px of usable content width. */\n  --space-screen: 16px;\n\n  /* ── Radius (Grab shape language) ─────────────────────────── */\n  --radius-input: 12px;\n  --radius-card: 16px;\n  --radius-button: 999px; /* primary + secondary buttons are pills */\n  --radius-pill: 999px;\n\n  /* ── Touch targets ────────────────────────────────────────── */\n  --target-min: 44px;     /* every interactive element */\n  --target-primary: 52px; /* the one primary CTA per screen */\n\n  /* ── Elevation ────────────────────────────────────────────────\n     Grab-style: cards float on a soft ambient shadow instead of a visible border;\n     hairlines remain for dividers and inputs. */\n  --shadow-none: none;\n  --shadow-card: 0 1px 4px rgba(20, 24, 27, 0.08), 0 2px 12px rgba(20, 24, 27, 0.06);\n  --shadow-sheet: 0 -2px 16px rgba(20, 24, 27, 0.08); /* bottom-sheet lift */\n  --shadow-menu: 0 4px 16px rgba(20, 24, 27, 0.1);    /* popover / dropdown */\n  /* Tab bar v1 (handoff/tab-bar-v1): a floating bar needs more lift than a card to read as\n     \"above\" scrolling content; the active pill gets a green under-glow so it reads as raised. */\n  --shadow-float: 0 8px 24px rgba(20, 24, 27, 0.12), 0 2px 6px rgba(20, 24, 27, 0.08);\n  --shadow-active: 0 4px 12px rgba(0, 129, 47, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.16);\n  --shadow-badge: 0 1px 3px rgba(20, 24, 27, 0.16);\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:var(--surface);font-family:var(--font-sans);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}\na{color:var(--accent-text)}a:hover{color:var(--cta-fill-pressed)}\n.doc{padding:40px 40px 80px;display:flex;flex-direction:column;gap:48px}\n.row{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}\n.cell{display:flex;flex-direction:column;gap:10px}\n.cap{font-size:13px;font-weight:700;color:var(--muted)}\n.note{font-size:13px;line-height:1.5;color:var(--muted);text-wrap:pretty}\n.ph{position:relative;overflow:hidden;background:var(--bg);border-radius:24px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);display:flex;flex-direction:column}\n.spin{display:inline-block;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:obspin .8s linear infinite;flex:none;box-sizing:border-box}\n@keyframes obspin{to{transform:rotate(360deg)}}\n.skel{animation:obpulse 1.1s ease-in-out infinite alternate}@keyframes obpulse{from{opacity:.5}to{opacity:1}}\n@media (prefers-reduced-motion:reduce){.spin,.skel{animation:none}}\n.caret{display:inline-block;width:2px;height:20px;background:var(--accent);margin-left:1px;flex:none}\n.toc{display:flex;flex-wrap:wrap;gap:8px}.toc a{font-size:13px;font-weight:700;text-decoration:none;min-height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}\n<\u002Fstyle><\u002Fhead>\n<body><div class=\"doc\" id=\"doc\"><\u002Fdiv>\n<script src=\"70fefeb8-6cfe-43e1-add4-9f91ab9d655f\"><\u002Fscript>\n<script src=\"0e5cfa19-ae7a-4095-9417-a36e7522418e\"><\u002Fscript>\n<script src=\"dec0d876-9fbd-49b1-8a25-28abbcc57b6e\"><\u002Fscript>\n<script src=\"e4cf6c58-bf10-4e4a-900e-12546047eb76\"><\u002Fscript>\n<script src=\"225230b3-fa7c-41fb-9d22-39f462eb2cd9\"><\u002Fscript>\n<script>\n(function(){\nconst conflicts=[\n['merchant-v2 T3','The Account row reads “Preferred riders · 4”.','Replaced by “Own bikers” for fleets, removed for non-fleets (BRIEF wins).'],\n['merchant-v2 S4 / K5','Strings say “rider” (“Book a rider”, “Find a rider”, “Delivery $3.20 · rider’s”).','New strings say biker. For Own-biker app orders the delivery fee comes back to the shop, so K5 shows the sum.'],\n['BRIEF OB-M2 / OB-M6','SMS invites, “SMS not sent · Resend”, 24 h resend.','Owner decision: no SMS. A phone-bound invite link the owner shares (WhatsApp / copy).'],\n['merchant-v2 K1b / T2','Chips use --highlight-sun / --highlight-sun-ink, which aren’t tokens.','Drawn with --highlight and --highlight-chip-ink (same values). No new tokens.'],\n['merchant-v2 S4','The Book card exists only on the shop board.','Fleet kitchens get it in the same slot (inside the mint top card). Proposed; open item 2.'],\n['rider-v2 board','The count reads “4 parcels near you”, cards carry a fare and Make an offer, and there’s a demand line.','Fleet board: “Chicken Inn jobs”, no fare, no offer button, no demand line (rule 7).'],\n['rider-v2 TabBar','Flat 60 px bar.','tab-bar-v1 is newer: floating pill, 72 px reserve. Drawn with Lucide glyphs; the build uses the illustrated art.'],\n['rider-v2 Money','Collected cash shows +$X in green (it was the biker’s).','For fleet bikers none of it is theirs, so amounts are ink.'],\n['ui_kits/admin','.kpill.bad and .btn.danger put --danger text on white or wash.','--danger-ink on --danger-wash (rule 6).'],\n['Prompt rule 3 vs admin kit','44 px targets everywhere vs the kit’s 28–32 px desktop buttons.','Brief wins: admin controls drawn at 44 px.'],\n['empty-states-v2 vs BRIEF §5','EmptyState pill is 44 px; §5 wants “Invite a biker” at 52.','OB-M4 keeps the soft pill, 52 px tall.'],\n['tab-bar-v1 v1.4','Glass bar with no shadow.','Drawn as glass; solid fallback per v1.4.'],\n['BRIEF sample data','“4 bikers” vs “6 bikers”, “4 online” vs a roster with 2 online, a bill overdue mid-week, a credit that breaks the branch total, #B204 on two bikers.','One data set: 4 bikers, 2 online; this week’s bill Unpaid, last week’s 2 days overdue (merchant + admin); #B190 charged then credited; biker app is Tendai (R4–R12) and Kuda (R1–R3).']];\nlet h=`<div style=\"max-width:920px;display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent-text)\">LYNIAGO · OWN BIKERS V1 · 2026-10-19<\u002Fdiv><div style=\"font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15\">Own bikers: merchant, biker and admin<\u002Fdiv><div style=\"font-size:16px;line-height:1.5;color:var(--muted);text-wrap:pretty\">Merchants invite their own bikers. Own bikers only get jobs from their own shop: no fare, no commission, no top-up, no strikes. They still collect cash and bring it back. Built on merchant-v2 + shop-front-v1, rider-v2, empty-states-v2 and the admin kit. <b style=\"color:var(--ink)\">New parts: the countdown bar and the roster state chip. No new tokens.<\u002Fb><\u002Fdiv><\u002Fdiv>`;\nh+=`<div style=\"max-width:920px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:20px;font-weight:700\">Where the brief and the handoffs disagree<\u002Fdiv><div style=\"background:var(--bg);border-radius:16px;padding:4px 20px\">${conflicts.map((c,i)=>`<div style=\"display:grid;grid-template-columns:180px 1fr 1fr;gap:16px;padding:12px 0;font-size:13px;line-height:1.45;${i?'border-top:1px solid var(--line)':''}\"><b>${c[0]}<\u002Fb><span style=\"color:var(--muted)\">${c[1]}<\u002Fspan><span>${c[2]}<\u002Fspan><\u002Fdiv>`).join('')}<\u002Fdiv><\u002Fdiv>`;\nconst head=h;\nfunction render(sel){let h=head+`<div class=\"toc\">${OBS.map((s,i)=>`<a href=\"?s=${i}\" data-s=\"${i}\" style=\"${String(i)===sel?'background:var(--accent-wash);border-color:var(--accent-text)':''}\">${s.t}<\u002Fa>`).join('')}<a href=\"?s=all\" data-s=\"all\" style=\"${sel==='all'?'background:var(--accent-wash);border-color:var(--accent-text)':''}\">All<\u002Fa><\u002Fdiv>`;\nfor(const s of (sel==='all'?OBS:[OBS[+sel]||OBS[0]])){h+=`<div style=\"display:flex;flex-direction:column;gap:16px\"><div><div style=\"font-size:20px;font-weight:700\">${s.t}<\u002Fdiv>${s.s?`<div class=\"note\" style=\"max-width:760px;margin-top:4px;font-size:14px\">${s.s}<\u002Fdiv>`:''}<\u002Fdiv><div class=\"row\">${s.c.map(c=>{const w=s.wide?1440:c[1].includes('width:320px')?320:360;return `<div class=\"cell\" style=\"width:${w}px\"><div class=\"cap\">${c[0]}<\u002Fdiv>${c[1]}${c[2]?`<div class=\"note\">${c[2]}<\u002Fdiv>`:''}<\u002Fdiv>`;}).join('')}<\u002Fdiv><\u002Fdiv>`;}\ndocument.getElementById('doc').innerHTML=h;}\nconst FR=OBS.flatMap(s=>s.c.map(c=>({l:c[0],h:c[1]})));\nwindow.__frames=FR.map(f=>f.l);\nwindow.__show=i=>{const f=FR[i],d=document.getElementById('doc');d.style.padding='0';d.style.gap='0';document.body.style.background='var(--bg)';document.body.style.overflow='hidden';const w=f.h.includes('width:1440px')?1440:f.h.includes('width:320px')?320:360,h=w===1440?900:w===320?640:720,s=Math.min(innerWidth/w,innerHeight/h);d.innerHTML=`<div style=\"width:${w}px;height:${h}px;transform:scale(${s});transform-origin:0 0\">${f.h}<\u002Fdiv>`;window.scrollTo(0,0);return [w,h];};\nconst q=new URLSearchParams(location.search).get('s');render(q==null||q===''?'0':q);\ndocument.addEventListener('click',e=>{const a=e.target.closest('a[data-s]');if(!a)return;e.preventDefault();history.replaceState(null,'','?s='+a.dataset.s);render(a.dataset.s);});\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
