<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Play feature graphic — source (1024×500)</title>
<link rel="stylesheet" href="../../../styles.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; }
  /* Design notes: canvas green is --accent-700 (#009D3B) so white type clears AA-large.
     Icon-duplication rule: the Play icon is already the dove on green, so the dove appears
     here only small, inside the lockup. Key content sits in the central safe zone —
     nothing within 60px of any edge; and nothing critical in the exact centre where the
     preview-video play button would sit. */
  .stage { width: 1024px; height: 500px; background: #009D3B; position: relative; overflow: hidden; font-family: var(--font-sans); }
  .route { position: absolute; inset: 0; }
  .lockup { position: absolute; top: 64px; left: 90px; display: flex; align-items: center; gap: 10px; }
  .wordmark { font-family: var(--font-wordmark); font-weight: 600; font-size: 30px; color: #fff; }
  .copy { position: absolute; left: 90px; top: 176px; width: 560px; }
  .headline { font-size: 64px; font-weight: 700; color: #fff; letter-spacing: -1.5px; line-height: 1.06; }
  .subline { margin-top: 18px; font-size: 26px; font-weight: 600; color: rgba(255,255,255,.88); }
  a { color: #fff; } a:hover { color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<div class="stage">
  <!-- Route motif: the product's A→B curve, oversized and quiet, right-weighted -->
  <svg class="route" viewBox="0 0 1024 500" aria-hidden="true">
    <path d="M 620 430 C 780 430, 700 120, 900 96" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="5" stroke-dasharray="2 22" stroke-linecap="round"></path>
    <circle cx="620" cy="430" r="17" fill="rgba(255,255,255,.92)"></circle>
    <circle cx="620" cy="430" r="7" fill="#009D3B"></circle>
    <circle cx="900" cy="96" r="17" fill="rgba(255,255,255,.92)"></circle>
    <circle cx="900" cy="96" r="7" fill="#009D3B"></circle>
  </svg>
  <div class="lockup">
    <svg width="34" height="34" viewBox="0 0 96 96" aria-hidden="true">
      <polygon points="28,6 58,32 38,42" fill="#fff"></polygon>
      <polygon points="90,26 14,52 48,60" fill="#fff"></polygon>
      <polygon points="90,26 48,60 42,84" fill="#fff" opacity=".62"></polygon>
      <path d="M90 26 L48 60 M70.5 30.2 L81.5 43.8" stroke="#009D3B" stroke-width="2.4" fill="none"></path>
    </svg>
    <span class="wordmark">LyniaGo</span>
  </div>
  <div class="copy">
    <div class="headline">A bike is<br />minutes away</div>
    <div class="subline">Parcels across Harare — at your price</div>
  </div>
</div>
<script>
  /* Export tiling: viewport is narrower than 1024, so the banner is captured as two
     512-wide tiles and stitched. */
  window.tileFeature = (col) => {
    const el = document.querySelector(".stage");
    el.style.position = "fixed";
    el.style.top = "0";
    el.style.left = "0";
    el.style.transform = "translateX(" + (-col * 512) + "px)";
  };
</script>
</body>
</html>
