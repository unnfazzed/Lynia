<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-sans)}
  .main{flex:1;background:#00b14f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px}
  .main svg{width:300px;height:300px}
  .wordmark{font-family:var(--font-wordmark);font-weight:600;font-size:120px;color:#fff;letter-spacing:-.01em;line-height:1}
  .strip{width:150px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main">
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <polygon points="28,6 58,32 38,42" fill="#fff"></polygon>
      <polygon points="90,26 14,52 48,60" fill="#fff"></polygon>
      <polygon points="90,26 48,60 42,84" fill="#d9f5e4"></polygon>
    </svg>
    <div class="wordmark">LyniaGo</div>
  </div>
  <div class="strip">
    <div style="background:#f2b705"></div>
    <div style="background:#c0392b"></div>
    <div style="background:#009d3b"></div>
    <div style="background:#006630"></div>
  </div>
</div>
</body>
</html>
