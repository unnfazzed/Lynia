# ── @azure/msal-node (2026-10-24) ──────────────────────────────────────────────────────────────
# GHSA-xcx6-jx8p-x3h5 (CVSS 7.5, confidentiality): in MSAL Node's AUTHORIZATION-CODE flow,
# `acquireTokenByCode` can send request parameters to an attacker-controlled endpoint. Fixed in 7.1.0.
# Owner asked for the dependency upgrade on PR #1296 (2026-10-24); this one entry is the part a bump
# can't do yet, flagged on that PR for the owner's review.
#
# Accepted, time-boxed, because THERE IS NO COMPATIBLE FIX: the only importer is @azure/identity, and
# its latest (4.14.0) still declares `@azure/msal-node: ^6.0.0`. Forcing 7.x with an override would put
# a major the SDK wasn't built against under the API's only Azure auth path (blob storage SAS signing).
#
# REACHABILITY: apps/api uses MSAL only through `new DefaultAzureCredential(...)` with a user-assigned
# managed identity (apps/api/src/adapters/storage/azure-blob.storage.ts). That is the managed-identity /
# client-credential path; nothing in the repo calls `acquireTokenByCode` or any auth-code flow, so the
# vulnerable code path is never run.
#
# Re-check on or before ignoreUntil: drop this entry the day @azure/identity accepts msal-node >= 7.1.0
# (then a plain `pnpm install` or an override clears it).
[[IgnoredVulns]]
id = "GHSA-xcx6-jx8p-x3h5"
ignoreUntil = 2026-11-07
reason = "MSAL Node auth-code flow parameter disclosure. Fixed only in msal-node 7.1.0, but its sole importer @azure/identity (latest 4.14.0) still requires ^6.0.0. apps/api uses MSAL only via DefaultAzureCredential with a managed identity; no code calls acquireTokenByCode or any auth-code flow, so the vulnerable path is unreachable."

# ── braces (2026-10-03) ──────────────────────────────────────────────────────────────────────────
# GHSA-vfj7-8cjw-p6xm (CVE-2026-93687, CVSS 8.7, availability only): the recursive AST walkers in
# braces <= 3.0.3 have no depth guard, so a deeply nested brace pattern exhausts the stack and throws
# an uncaught RangeError. GitHub reviewed it at 2026-10-02T22:36Z, turning the gate red on every PR.
# Owner approved this time-boxed acceptance on 2026-10-03 (PR #1050).
#
# Accepted, time-boxed, because THERE IS NO FIXED VERSION: OSV records `last_affected: 3.0.3`, and
# 3.0.3 is npm's `latest`. A bump cannot clear it.
#
# REACHABILITY — why this is acceptable rather than merely unavoidable:
#   • Build/test tooling only. The importers are `micromatch` (jest, metro, @expo/cli) and `chokidar`
#     (ts-node-dev). `pnpm why braces --prod` in apps/api is empty, and nothing in the device bundle
#     expands globs.
#   • No untrusted patterns. Every glob these tools expand comes from the repo's own config (jest
#     testMatch, metro watchFolders, tsconfig), never from a request or a user.
#
# Re-check on or before ignoreUntil: drop this entry the day a fixed braces ships (add a
# `pnpm.overrides` bump if micromatch has not moved to it yet).
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-03
reason = "braces stack-exhaustion DoS via deeply nested patterns. No fixed version exists (OSV last_affected 3.0.3 = npm latest). Build/test tooling only: importers are micromatch (jest, metro, @expo/cli) and chokidar (ts-node-dev); not in apps/api's production tree or the mobile bundle, and every pattern comes from repo config, never attacker input."

# ── decode-uri-component (2026-11-04) ────────────────────────────────────────────────────────────────
# GHSA-qr28-fpjm-wq7f (CVSS 8.2, availability only): decodeUriComponent() takes quadratic time on
# malformed input with many distinct percent-encoded runs (~224 KB blocks the event loop ~20 s).
# Owner approved this time-boxed acceptance on 2026-11-04 (PR #1313).
#
# Accepted, time-boxed, because THE FIX CAN'T BE FORCED SAFELY: it ships only in 0.5.1, which is
# ESM-only ("type": "module"), while its sole importer query-string@7.1.3 is CommonJS and requires it.
# A pnpm override would break that require in the mobile bundle and in Jest.
#
# REACHABILITY — why this is acceptable rather than merely unavoidable:
#   • Not in apps/api. The only chain is query-string ← @react-navigation/core ← expo-router (mobile).
#   • On the device only, parsing the app's own navigation / deep-link URLs. The worst case is a crafted
#     ~224 KB link the biker or customer opens themselves freezing their own app; no server, no other user.
#
# Re-check on or before ignoreUntil: drop this entry the day @react-navigation/core moves to a
# query-string that accepts a fixed decode-uri-component (or a CommonJS backport ships).
[[IgnoredVulns]]
id = "GHSA-qr28-fpjm-wq7f"
ignoreUntil = 2026-12-04
reason = "decode-uri-component quadratic-time DoS on malformed percent-encoding. Fixed only in ESM-only 0.5.1, which the CommonJS importer query-string@7.1.3 cannot require. Mobile-only (react-navigation URL parsing on the device), not in apps/api; worst case a self-opened crafted link slows the user's own app."
