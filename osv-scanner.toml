# ── decode-uri-component (2026-11-04) ────────────────────────────────────────────────────────────────
# GHSA-qr28-fpjm-wq7f (CVSS 8.2, availability only): decodeUriComponent() takes quadratic time on
# malformed input with many distinct percent-encoded runs (~224 KB blocks the event loop ~20 s).
# Owner approved this time-boxed acceptance on 2026-11-04 (PR #1313).
#
# Accepted, time-boxed, because THE FIX CAN'T BE FORCED SAFELY: it ships only in 0.5.1, which is
# ESM-only ("type": "module"), while its sole importer query-string@7.1.3 is CommonJS and requires it.
# A pnpm override would break that require in the mobile bundle and in Jest.
#
# REACHABILITY — why this is acceptable rather than merely unavoidable:
#   • Not in apps/api. The only chain is query-string ← @react-navigation/core ← expo-router (mobile).
#   • On the device only, parsing the app's own navigation / deep-link URLs. The worst case is a crafted
#     ~224 KB link the biker or customer opens themselves freezing their own app; no server, no other user.
#
# Re-check on or before ignoreUntil: drop this entry the day @react-navigation/core moves to a
# query-string that accepts a fixed decode-uri-component (or a CommonJS backport ships).
[[IgnoredVulns]]
id = "GHSA-qr28-fpjm-wq7f"
ignoreUntil = 2026-12-04
reason = "decode-uri-component quadratic-time DoS on malformed percent-encoding. Fixed only in ESM-only 0.5.1, which the CommonJS importer query-string@7.1.3 cannot require. Mobile-only (react-navigation URL parsing on the device), not in apps/api; worst case a self-opened crafted link slows the user's own app."
