# Read-only production diagnosis for the post-2026-07-08 deploy crash-loop
# (docs/GCP-PENDING-REVIEW-2026-07-13.md; the 07-10 provisioning review is in git history) AND admin-console IAP sign-in failures
# (e.g. IAP "Error code 11" — incorrectly configured OAuth client). Dispatch-only;
# makes NO changes. Auths with the same keyless WIF deployer identity as release.yml.
# Every probe is best-effort: where the deployer SA lacks a role, the step records
# that instead of failing, so one run maps both the crash cause and our IAM reach.
name: GCP Diagnose (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Service + revision autopsy (run.admin — should succeed)
        run: |
          set -uo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          SERVICE="${{ vars.CLOUD_RUN_SERVICE }}"
          echo "=== service traffic / latest revisions"
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format 'yaml(status.traffic, status.latestCreatedRevisionName, status.latestReadyRevisionName, status.conditions)'
          LATEST="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format 'value(status.latestCreatedRevisionName)')"
          echo "=== conditions of latest created revision: $LATEST"
          gcloud run revisions describe "$LATEST" --project "$PROJECT" --region "$REGION" \
            --format 'yaml(status.conditions, spec.containers[0].env, spec.containers[0].image)' \
            | sed 's/value:.*/value: <redacted>/'
          echo "=== last 5 revisions"
          gcloud run revisions list --service "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --limit 5 --format 'table(name, status.conditions[0].status, metadata.creationTimestamp)'

      - name: Crash logs of latest failed revision (needs logging viewer — may be denied)
        run: |
          set -uo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          SERVICE="${{ vars.CLOUD_RUN_SERVICE }}"
          LATEST="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format 'value(status.latestCreatedRevisionName)')"
          echo "=== gcloud logging read for $LATEST (stderr/stdout of the crashing container)"
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" resource.labels.service_name=\"$SERVICE\" resource.labels.revision_name=\"$LATEST\"" \
            --project "$PROJECT" --limit 100 --order desc \
            --format 'value(timestamp, severity, textPayload, jsonPayload.message)' \
            || echo "RESULT: logging.read DENIED for the deployer SA (grant roles/logging.viewer to read crash logs from CI)"

      # MOB-MAP-02 / docs/MOB-MAP-02-RUNBOOK.md. Two questions this answers that previously needed
      # either the GCP console on a desktop or `gcloud` on a laptop:
      #
      #   1. WHAT ARE THE KEY IDS? Arming infra/terraform/apikeys.tf needs the final component of
      #      each key's resource `name` — and NOT the `uid` field, which the terraform import path
      #      rejects. Both are UUIDs, so they are indistinguishable by shape; printing them side by
      #      side and labelling which is which is the whole point of this step.
      #   2. WHAT DO THE KEYS CURRENTLY ALLOW? The runbook's last open cause is the Maps key's own
      #      API restriction omitting Maps SDK for Android — which the Maps Key Doctor structurally
      #      cannot see (Google evaluates API activation before the application restriction, and the
      #      SDK's channel is not reachable over HTTP). It is readable here.
      #
      # NO KEY STRING IS PRINTED. `api-keys list` returns metadata only; the string needs
      # `apikeys.keys.getKeyString`, which the read-only deployer SA does not hold and which this
      # step never calls. `roles/viewer` (iam.tf) covers the list itself.
      - name: API keys inventory — ids + restrictions (MOB-MAP-02; needs apikeys.keys.list)
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -uo pipefail
          echo "=== Maps Platform client keys on $PROJECT (metadata only — no key string is readable here)"
          if ! gcloud services api-keys list --project "$PROJECT" --format=json > keys.json 2>keys.err; then
            echo "RESULT: apikeys.keys.list DENIED for the deployer SA."
            echo "        Grant roles/serviceusage.apiKeysViewer (or roles/viewer) to read this from CI."
            sed -e 's/[A-Za-z0-9_-]\{30,\}/<redacted>/g' keys.err | head -n 5
            exit 0
          fi
          # Raw first: gcloud's field spellings have moved between releases, so the summary below is
          # a convenience and this dump is the source of truth.
          cat keys.json
          echo ""
          echo "=== summary — use KEY_ID (not uid) for TF_MAPS_KEY_ID / TF_PLACES_KEY_ID"
          jq -r '
            def r: .restrictions // {};
            def android: (r.androidKeyRestrictions // r.android_key_restrictions // {});
            def apis: [ (r.apiTargets // r.api_targets // [])[] | .service ];
            .[] |
            "- display name : " + (.displayName // .display_name // "(none)")   + "\n" +
            "  KEY_ID       : " + ((.name // "") | split("/") | last)           + "\n" +
            "  uid (NOT it) : " + (.uid // "(none)")                            + "\n" +
            "  application  : " + (
              if (android.allowedApplications // android.allowed_applications // []) | length > 0
              then ([ (android.allowedApplications // android.allowed_applications)[]
                      | (.packageName // .package_name) + " @ " + (.sha1Fingerprint // .sha1_fingerprint) ] | join(", "))
              elif (r.browserKeyRestrictions // r.browser_key_restrictions) then "WEBSITES — an Android app cannot use this key"
              elif (r.serverKeyRestrictions // r.server_key_restrictions) then "IP ADDRESSES — an Android app cannot use this key"
              elif (r.iosKeyRestrictions // r.ios_key_restrictions) then "iOS apps"
              else "None (no package/SHA-1 check at all)" end
            ) + "\n" +
            "  api targets  : " + (if (apis | length) > 0 then (apis | join(", ")) else "unrestricted (key may call any enabled API)" end)
          ' keys.json
          echo ""
          echo "Reading this (docs/SECURITY-OPS.md §B):"
          echo "  Maps SDK key   -> application: zw.co.lynia against BOTH SHA-1s (Play app-signing + EAS upload)"
          echo "                    api targets: must include maps-android-backend.googleapis.com, or tiles stay blank"
          echo "  Places key     -> application: None is CORRECT (an Android restriction returns REQUEST_DENIED"
          echo "                    for every web-service call, which the app flattens into an empty result list)"
          echo "                    api targets: places-backend.googleapis.com only"

      - name: Secret version freshness (needs secretmanager viewer — may be denied)
        run: |
          set -uo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          echo "Last green prod deploy finished 2026-07-08T14:23Z; first failure 2026-07-08T15:52Z."
          echo "Any version created in/after that window is the prime suspect."
          for s in DATABASE_URL REDIS_URL JWT_SIGNING_SECRET PII_ENCRYPTION_KEY DIDIT_API_KEY DIDIT_WEBHOOK_SECRET; do
            echo "=== $s"
            gcloud secrets versions list "$s" --project "$PROJECT" \
              --format 'table(name, state, createTime)' --limit 5 \
              || echo "RESULT: secretmanager list DENIED for the deployer SA on $s"
          done

      # Admin-console IAP edge autopsy — triage for sign-in "Error code 11" (incorrectly configured
      # OAuth client). Reads the OAuth CLIENT ID that IAP is configured with on the admin backend and
      # compares it, by eye, against the client under APIs & Services -> Credentials. Read paths are
      # covered by roles/viewer (compute.*.get); each is best-effort so an unarmed admin tier or a
      # missing role records a note rather than failing the run. NOTE: the client's authorized redirect
      # URI is NOT readable here — the IAP OAuth Admin API was shut down 2026-03-19 (admin.tf), so that
      # check stays console-only. Fixed Terraform resource names from infra/terraform/admin.tf + lb.tf.
      - name: Admin console IAP config (error-code-11 triage — needs compute viewer)
        run: |
          set -uo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          BACKEND="lynia-admin-backend"
          NEG="lynia-admin-neg"
          CERT="lynia-admin-cert"
          echo "How to read the oauth2ClientId below (vs the client on APIs & Services -> Credentials):"
          echo "  * IDs MATCH  -> client is correct; Error 11 is the client's authorized redirect URI"
          echo "                  (must include https://iap.googleapis.com/v1/oauth/clientIds/<ID>:handleRedirect)"
          echo "                  or a rotated client SECRET. Both are console-only fixes."
          echo "  * IDs DIFFER -> the backend points at the wrong/old client; re-apply Terraform with the"
          echo "                  right admin_iap_oauth_client_id / admin_iap_oauth_client_secret (admin.tf)."
          echo "=== IAP block + backends on the admin backend service ($BACKEND)"
          gcloud compute backend-services describe "$BACKEND" --global --project "$PROJECT" \
            --format 'yaml(iap.enabled, iap.oauth2ClientId, backends[].group, securityPolicy)' \
            || echo "RESULT: backend-services.get DENIED, or $BACKEND absent (admin tier not armed?)"
          echo "=== serverless NEG backing the admin backend ($NEG)"
          gcloud compute network-endpoint-groups describe "$NEG" --region "$REGION" --project "$PROJECT" \
            --format 'yaml(cloudRun.service, networkEndpointType)' \
            || echo "RESULT: NEG describe DENIED, or $NEG absent"
          echo "=== managed SSL cert for the admin domain ($CERT) — want status ACTIVE + domainStatus ACTIVE"
          gcloud compute ssl-certificates describe "$CERT" --global --project "$PROJECT" \
            --format 'yaml(managed.domains, managed.status, managed.domainStatus)' \
            || echo "RESULT: ssl-certificates.get DENIED, or $CERT absent"
