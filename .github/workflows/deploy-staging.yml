name: Deploy Staging (Cloud Run)

# The pre-prod tier (docs/LAUNCH-DEPLOYMENT-STRATEGY.md §2d): every merge to main auto-deploys
# the SAME image the prod canary will promote to a separate staging service — its own Cloud SQL,
# Redis, secrets, bucket, and runtime SA (infra/terraform/staging.tf), exposed on the shared ALB
# at the staging hostname. Runs prod-shaped (NODE_ENV=production, real secret-strength guards)
# but in the STAGING tier (APP_ENV=staging), which permits the vendor-free QA config the k6 load
# harness (apps/api/load/, LR11) and QA devices authenticate through.
#
# DORMANT UNTIL STAGING IS PROVISIONED — gated on the repo variable GCP_STAGING_ENABLED == 'true'.
# Arming (founder): set staging_enabled = true in terraform.tfvars, `terraform apply`, create the
# staging DNS A record, then set the repo variables/secret below from the Terraform outputs
# (docs/LAUNCH-EXECUTION-RUNBOOK.md §8e).
#
#   Variables: GCP_STAGING_ENABLED, STAGING_CLOUD_SQL_INSTANCE, STAGING_CLOUD_RUN_SERVICE_ACCOUNT
#              (optional: STAGING_CLOUD_RUN_SERVICE, STAGING_HEALTH_URL, STAGING_OTP_TEST_PHONES)
#   Secrets:   MIGRATE_DATABASE_URL_STAGING (from the terraform output of the same name)
#
# NOTE: the first armed run can fail the final smoke step while the staging DNS record + managed
# cert are still propagating (up to ~30 min) — re-run the workflow once they're live.
#
# PIPELINE POSITION (docs/DEPLOYMENT-AUTOHEAL.md): when armed, this workflow is the FIRST tier of
# every merged PR's rollout — release.yml's staging-gate holds the prod deploy until this run goes
# green, then promotes the SAME :sha image. A failure here is auto-retried once and, if still red,
# escalated as a `deploy-failure` issue by deploy-autoheal.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build · migrate · deploy (staging)
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_STAGING_ENABLED == 'true' }}
    environment: staging # auto-deploys: no reviewers on staging — fast feedback is the point
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/lynia-api
      SERVICE: ${{ vars.STAGING_CLOUD_RUN_SERVICE || 'lynia-api-staging' }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate required staging config
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
          VPC_CONNECTOR: ${{ vars.VPC_CONNECTOR }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          STAGING_CLOUD_SQL_INSTANCE: ${{ vars.STAGING_CLOUD_SQL_INSTANCE }}
          STAGING_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.STAGING_CLOUD_RUN_SERVICE_ACCOUNT }}
          MIGRATE_DATABASE_URL_STAGING: ${{ secrets.MIGRATE_DATABASE_URL_STAGING }}
        run: |
          set -euo pipefail
          missing=()
          for v in GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPO VPC_CONNECTOR \
                   GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT \
                   STAGING_CLOUD_SQL_INSTANCE STAGING_CLOUD_RUN_SERVICE_ACCOUNT \
                   MIGRATE_DATABASE_URL_STAGING; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::GCP_STAGING_ENABLED is true but these are unset: ${missing[*]}. See docs/LAUNCH-EXECUTION-RUNBOOK.md §8e." >&2
            exit 1
          fi
          echo "All required staging config present."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Staging now OWNS the :buildcache layer-cache write: release.yml's staging-gate serializes
      # prod strictly after this run (no more concurrent cache-to race), and when this build
      # succeeds prod PROMOTES this exact :sha image instead of rebuilding — so this is the only
      # armed-mode builder. Pushes only the :sha tag; :latest is added at prod promotion.
      - name: Build and push image
        run: |
          set -euo pipefail
          docker buildx build \
            -f apps/api/Dockerfile \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true" \
            -t "$IMAGE:${GITHUB_SHA}" \
            --push .

      - name: Apply database migrations (staging, via Cloud SQL Auth Proxy)
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL_STAGING }}
        run: |
          set -euo pipefail
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${{ vars.STAGING_CLOUD_SQL_INSTANCE }}" --port 5432 &
          PROXY_PID=$!
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break || sleep 1; done
          corepack enable
          pnpm install --frozen-lockfile=false
          pnpm --filter @lynia/api prisma:generate
          pnpm --filter @lynia/api migrate:deploy
          kill "$PROXY_PID" || true

      # Straight to 100% — staging IS the canary tier; the graduated rollout protects prod only.
      # APP_ENV=staging relaxes ONLY the launch-hygiene guards (env.ts): console OTP + test phones
      # + stub KYC boot here so the k6 harness and QA devices can authenticate vendor-free, while
      # secret-strength/Redis guards still apply. --max-instances caps the cost of a runaway.
      - name: Deploy to Cloud Run (staging)
        # Merchant kill switches come in as env (mapped from the STAGING_* Variables), never as
        # ${{ }} inside the script — see the validation loop below.
        env:
          RESTAURANTS_ENABLED: ${{ vars.STAGING_RESTAURANTS_ENABLED }}
          MERCHANT_DISPATCH_AUTO_ENABLED: ${{ vars.STAGING_MERCHANT_DISPATCH_AUTO_ENABLED }}
          MERCHANT_WALLET_ENABLED: ${{ vars.STAGING_MERCHANT_WALLET_ENABLED }}
          MICRO_CACHE_REDIS_L2: ${{ vars.STAGING_MICRO_CACHE_REDIS_L2 }}
          # Same lane, same reason: lands inside ENV_VARS, so never interpolated into the script.
          CORS_ALLOWED_ORIGINS: ${{ vars.STAGING_CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          # "^;^" sets ; as the env delimiter — values may contain commas (OTP_TEST_PHONES) and @
          # (SCHEDULER_SERVICE_ACCOUNT is an SA email; the old @ delimiter split it and broke the deploy).
          ENV_VARS="^;^NODE_ENV=production;APP_ENV=staging;CLOUD_PROVIDER=gcp;STORAGE_BUCKET=lynia-media-staging;GCP_STORAGE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }};OTP_CHANNEL=console;KYC_PROVIDER=stub;PUSH_PROVIDER=noop;OTP_TEST_PHONES=${{ vars.STAGING_OTP_TEST_PHONES }};MIN_SUPPORTED_APP_VERSION=${{ vars.STAGING_MIN_SUPPORTED_APP_VERSION }};SCHEDULER_SERVICE_ACCOUNT=${{ vars.STAGING_CLOUD_RUN_SERVICE_ACCOUNT }}"
          # Merchant-vertical kill switches, staging-scoped (plan §0b.3). Separate STAGING_* Variables
          # so the vertical can be exercised end-to-end here (QA, the P4 E2E gate) while prod stays
          # dark — the whole point of a staging tier. Unset yields "false" (the schema's fail-safe).
          # Values arrive via `env:` and are whitelist-validated: a `;` in a Variable value would
          # otherwise be read as the ENV_VARS delimiter and inject an extra key (here that could
          # override APP_ENV=staging), and raw expression interpolation in a run: block is a
          # shell-injection sink. Do NOT write the literal expression token in this block, not even
          # inside a `#` comment: Actions interpolates the whole script before bash ever sees it, so
          # an empty one is a syntax error that fails the ENTIRE workflow to parse (KB-CI-EXPR-EMPTY).
          # MICRO_CACHE_REDIS_L2 rides the same lane (STAGING_MICRO_CACHE_REDIS_L2 Variable): the
          # shared micro-cache Redis L2 (PR #809) over the staging REDIS_URL — no new infra.
          for _flag in RESTAURANTS_ENABLED MERCHANT_DISPATCH_AUTO_ENABLED MERCHANT_WALLET_ENABLED MICRO_CACHE_REDIS_L2; do
            _val="${!_flag:-false}"
            case "$_val" in
              true|false) ;;
              *) echo "::error::STAGING_${_flag} must be exactly 'true' or 'false' (got '${_val}')"; exit 1 ;;
            esac
            ENV_VARS="${ENV_VARS};${_flag}=${_val}"
          done

          # Browser origins allowed to call this API cross-origin (apps/api/src/common/cors.ts).
          # Empty by default — unlike prod, no browser client points at staging today (there is no
          # staging merchant dashboard tier), and default-deny is the correct resting state. The knob
          # exists so that standing one up is a Variable, not a scramble: the prod tier lost a day to
          # exactly this being unsettable without a code change (docs/KNOWN_BUGS.md OPS-CORS-01).
          # Same bare-origin validation as release.yml; the whole value must survive the ';' delimiter.
          if [ -n "${CORS_ALLOWED_ORIGINS:-}" ]; then
            _cors="$(printf '%s' "$CORS_ALLOWED_ORIGINS" | tr -d '[:space:]')"
            IFS=',' read -ra _origins <<< "$_cors" || true
            for _o in "${_origins[@]:-}"; do
              [ -z "$_o" ] && continue
              case "$_o" in
                *';'*) echo "::error::CORS origin '$_o' contains ';', the ENV_VARS delimiter"; exit 1 ;;
                https://*/*|http://*/*) echo "::error::CORS origin '$_o' has a path or trailing slash — use scheme://host[:port] only"; exit 1 ;;
                https://?*|http://?*) ;;
                *) echo "::error::CORS origin '$_o' must be an absolute origin starting with https:// (http:// only for a local origin)"; exit 1 ;;
              esac
            done
            ENV_VARS="${ENV_VARS};CORS_ALLOWED_ORIGINS=${_cors}"
          fi

          SECRETS="DATABASE_URL=DATABASE_URL_STAGING:latest,REDIS_URL=REDIS_URL_STAGING:latest,JWT_SIGNING_SECRET=JWT_SIGNING_SECRET_STAGING:latest,PII_ENCRYPTION_KEY=PII_ENCRYPTION_KEY_STAGING:latest"

          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${GITHUB_SHA}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --port 3000 \
            --timeout 3600 \
            --max-instances 2 \
            --service-account "${{ vars.STAGING_CLOUD_RUN_SERVICE_ACCOUNT }}" \
            --add-cloudsql-instances "${{ vars.STAGING_CLOUD_SQL_INSTANCE }}" \
            --vpc-connector "${{ vars.VPC_CONNECTOR }}" \
            --vpc-egress private-ranges-only \
            --ingress internal-and-cloud-load-balancing \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "$SECRETS" \
            --allow-unauthenticated

      - name: Smoke staging /health
        run: |
          set -euo pipefail
          URL="${{ vars.STAGING_HEALTH_URL || 'https://staging.lyniafinance.com/healthz' }}"
          for i in $(seq 1 12); do
            BODY="$(curl -fsS --max-time 10 "$URL" || true)"
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "Staging healthy: $BODY"
              exit 0
            fi
            echo "Attempt $i: not healthy yet (${BODY:-no response}); retrying in 10s…"
            sleep 10
          done
          echo "::error::Staging /health never went green. First armed run? DNS + managed cert can take ~30 min — re-run once propagated."
          exit 1

      - name: Summary
        run: |
          echo "Staging deployed ${IMAGE}:${GITHUB_SHA} to ${SERVICE} (${{ vars.GCP_REGION }})." >> "$GITHUB_STEP_SUMMARY"
