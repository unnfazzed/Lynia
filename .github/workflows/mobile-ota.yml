name: Mobile OTA Update (expo-updates)

# Channel A of the mobile update strategy (docs/LAUNCH-DEPLOYMENT-STRATEGY.md §1a): push a
# JS/asset-only fix to already-installed apps in minutes, with no Play review. The bundle is
# built HERE from the checked-out commit and published to an EAS Update branch; installed apps
# whose runtime fingerprint matches pick it up on next cold start.
#
# OTA governance: this bypasses store review, so it runs ONLY from this reviewed workflow
# (environment-gated, never from a laptop) and only ships what is already on a CI-green branch.
# JS-ONLY RULE: an update whose native fingerprint differs from the installed binary is ignored
# by devices (fingerprint runtimeVersion policy) — native/SDK changes need mobile-release.yml.
#
# DORMANT until EAS is provisioned — same arming as mobile-release.yml (EAS_RELEASE_ENABLED).
#
# Rollback: `eas update:republish` the previous group on the same branch (Expo console or CLI).

on:
  workflow_dispatch:
    inputs:
      message:
        description: "What this update ships (shows in the Expo console)"
        required: true
        type: string
      branch:
        description: "EAS Update branch (= build channel)"
        type: choice
        options: [production, preview]
        default: production
      allow_runtime_mismatch:
        description: "Publish even if no recent build on this channel shares the computed runtime version (advanced — the update will reach only binaries that DO match, possibly none)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-ota
  cancel-in-progress: false

jobs:
  publish:
    name: eas update → ${{ inputs.branch }}
    runs-on: ubuntu-latest
    if: ${{ vars.EAS_RELEASE_ENABLED == 'true' }}
    environment: production-mobile
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      # EXPO_PUBLIC_* vars are inlined into the JS bundle at export time — they must match what
      # the production binary was built with, or the OTA silently changes runtime config.
      EXPO_PUBLIC_GOOGLE_PLACES_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # STRICT frozen install (deliberate divergence from the repo's --frozen-lockfile=false
      # convention): `eas update` computes the expo-updates `fingerprint` runtimeVersion from this
      # runner's node_modules to decide which installed binaries receive the OTA bundle. A
      # non-reproducible install can compute a fingerprint no binary has (update silently reaches
      # nobody) — same failure class as the mobile-release.yml runtime-version mismatch
      # (build 5906d2f0, 2026-08-03).
      - name: Install
        run: pnpm install --frozen-lockfile

      # The JS bundle is exported locally, so workspace deps the app imports must be built.
      - name: Build shared package
        run: pnpm --filter @lynia/shared build

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # PREFLIGHT (added 2026-08-04, the day the app went live). An `eas update` that reaches nobody
      # SUCCEEDS — the CLI exits 0, the Expo console shows a published update, and not one phone
      # ever downloads it. That is the single worst property of this lane, and going live exposed
      # two live instances of it (docs/PLAY-STORE-SUBMISSION.md §8a, KNOWN_BUGS REL-01/REL-02):
      #   1. the `branch` input still defaulted to `production` while the only channel that existed
      #      — and the one the live internal-track binary was built on — was `preview`; and
      #   2. `@expo/fingerprint` hashes the resolved app config, `version` included, so every
      #      release-please bump rotates the runtimeVersion away from every installed binary.
      # Neither is detectable after the fact without asking a device. So check both BEFORE publishing
      # and fail loudly instead of quietly shipping into the void.
      - name: Preflight — the update must be able to reach a real binary
        working-directory: apps/mobile
        env:
          BRANCH: ${{ inputs.branch }}
          ALLOW_MISMATCH: ${{ inputs.allow_runtime_mismatch }}
        run: |
          set -euo pipefail

          # (1) A channel must exist for this branch. `eas update` happily creates a branch that no
          # channel points at; binaries only ever resolve updates through a CHANNEL.
          if ! eas channel:view "$BRANCH" --json --non-interactive > /tmp/eas-channel.json 2> /tmp/eas-channel.err; then
            echo "::error::No EAS channel named '$BRANCH' exists. Installed binaries resolve updates through a channel, so an update published to this branch would reach zero devices. Ship a binary built on this channel first (mobile-release.yml with the matching eas.json profile), or dispatch against a channel that exists."
            sed 's/^/  /' /tmp/eas-channel.err >&2 || true
            exit 1
          fi
          echo "Channel '$BRANCH' exists."

          # (2) The runtime version we are about to publish must match a binary someone can install.
          # `eas update` derives it from THIS runner's tree, exactly as computed here, so this is an
          # apples-to-apples comparison against the runtimeVersion EAS recorded for each build.
          COMPUTED="$(npx --no-install expo-updates fingerprint:generate --platform android \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).hash??"")}catch{process.stdout.write("")}})')"
          if [ -z "$COMPUTED" ]; then
            echo "::warning::Could not compute the fingerprint runtime version; skipping the runtime-match check."
            exit 0
          fi
          echo "Computed runtime version for this update: $COMPUTED"

          BUILT="$(eas build:list --json --non-interactive --platform android --channel "$BRANCH" --status finished --limit 20 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write([...new Set(JSON.parse(s).map(b=>b.runtimeVersion).filter(Boolean))].join("\n"))}catch{}})' || true)"
          {
            echo "### OTA preflight"
            echo ""
            echo "- Channel: \`$BRANCH\`"
            echo "- Runtime version to publish: \`$COMPUTED\`"
            echo "- Runtime versions of finished builds on this channel:"
            if [ -n "$BUILT" ]; then printf '  - `%s`\n' $BUILT; else echo "  - _(none found)_"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          if printf '%s\n' $BUILT | grep -qx "$COMPUTED"; then
            echo "Runtime version matches a finished build on '$BRANCH' — the update can land."
            exit 0
          fi
          if [ "$ALLOW_MISMATCH" = "true" ]; then
            echo "::warning::No finished build on '$BRANCH' has runtime version $COMPUTED. Publishing anyway because allow_runtime_mismatch=true — this update may reach zero devices."
            exit 0
          fi
          echo "::error::No finished build on channel '$BRANCH' has runtime version $COMPUTED, so this update would be ignored by every installed binary. The usual cause is a version bump since the installed build was made (\`version\` is hashed into the fingerprint runtimeVersion) or a native/dependency change — both require a new store build via mobile-release.yml. Re-dispatch with allow_runtime_mismatch=true only if you know which binaries you are targeting."
          exit 1

      - name: Publish OTA update
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          eas update --branch "${{ inputs.branch }}" --message "${{ inputs.message }}" --non-interactive
          echo "OTA update published to branch '${{ inputs.branch }}': ${{ inputs.message }}" >> "$GITHUB_STEP_SUMMARY"
