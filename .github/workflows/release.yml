name: Release (Cloud Run)

# Ship-stage release job (status: docs/PILOT-READINESS.md). Builds the API container, pushes it to
# Artifact Registry, applies DB migrations, and deploys to Cloud Run as a NO-TRAFFIC canary
# revision, then health-gates promotion to 100% with automatic rollback on degradation
# (docs/LAUNCH-DEPLOYMENT-STRATEGY.md §2; manual rollback: rollback.yml).
#
# ORDERING (docs/DEPLOYMENT-AUTOHEAL.md): when the staging tier is armed, the `staging-gate` job
# below holds this release until deploy-staging.yml has gone GREEN for the same commit — merged
# PRs flow main → staging (build + migrate + deploy + smoke) → production (same image, canary).
# Failures at either tier are auto-retried once and then escalated by deploy-autoheal.yml.
#
# DORMANT UNTIL GCP IS PROVISIONED. The deploy job is gated on the repo variable
# `GCP_DEPLOY_ENABLED == 'true'`, so until a maintainer arms it this workflow is a clean no-op —
# it never fails a push. Arming it is the literal `/ship` step once provisioning hands back the
# project/region/bucket/service-account (see infra/terraform/README.md arming guide).
#
# Required to arm (set in repo Settings → Secrets and variables → Actions):
#   Variables:
#     GCP_DEPLOY_ENABLED   "true" to arm this workflow
#     GCP_PROJECT_ID       the provisioned project id
#     GCP_REGION           africa-south1
#     GCP_ARTIFACT_REPO    Artifact Registry repo name (e.g. lynia)
#     CLOUD_RUN_SERVICE    Cloud Run service name (e.g. lynia-api)
#     CLOUD_SQL_INSTANCE   Cloud SQL connection name (project:region:instance) — for migrations
#     VPC_CONNECTOR        Serverless VPC Access connector (so Cloud Run reaches Redis)
#     CLOUD_RUN_SERVICE_ACCOUNT  runtime SA email (run as lynia-run, not the default compute SA)
#     GCP_WORKLOAD_IDENTITY_PROVIDER  WIF provider resource name (keyless CI auth)
#     GCP_SERVICE_ACCOUNT  deployer SA email the workflow impersonates via WIF
#   Secrets:
#     MIGRATE_DATABASE_URL postgres URL through 127.0.0.1:5432 (the Cloud SQL Auth Proxy), used
#                          only by `prisma migrate deploy`.
#   CI auth is keyless via Workload Identity Federation — no service-account JSON key
#   (the org disables key creation). The deployer SA holds Cloud Run Admin, Artifact
#   Registry Writer, Cloud SQL Client, and actAs on the runtime SA.
#   App runtime secrets (DATABASE_URL, REDIS_URL, JWT_SIGNING_SECRET, vendor keys) live in
#   Secret Manager and are injected at deploy via --set-secrets below.

on:
  push:
    branches: [main]
    # Docs-only changes don't ship a new image — skip the build/migrate/deploy.
    # (A commit that touches code AND docs still deploys; paths-ignore only skips
    # when every changed file matches.)
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: release-cloud-run
  cancel-in-progress: false

jobs:
  # Progressive-delivery ordering (docs/LAUNCH-DEPLOYMENT-STRATEGY.md §3c: "promotion from a green
  # staging deploy"): production only ships a commit that staging has already deployed AND
  # smoke-tested. This gate polls the deploy-staging.yml run for THIS sha and blocks the deploy
  # job until that run concludes green.
  #
  # Failure choreography (docs/DEPLOYMENT-AUTOHEAL.md): a staging failure on attempt 1 is retried
  # automatically by deploy-autoheal.yml, so the gate keeps WAITING through a first failure and
  # only gives up once staging is conclusively red (failed on attempt >= 2, i.e. the auto-retry
  # also lost) or the timeout lapses. A gate failure fails this run WITHOUT deploying — prod keeps
  # serving the previous revision untouched.
  #
  # Escape hatches:
  #   - Staging unarmed (GCP_STAGING_ENABLED != 'true') → gate passes straight through; the
  #     pre-staging direct-to-prod behavior is preserved.
  #   - workflow_dispatch → gate is skipped (manual dispatch = human judgment; use it to release
  #     when staging is red for a reason known to be unrelated).
  #   - STAGING_GATE_TIMEOUT_MINUTES repo Variable tunes the wait (default 60).
  staging-gate:
    name: wait for green staging deploy
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for deploy-staging success on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ENABLED: ${{ vars.GCP_STAGING_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          GATE_TIMEOUT_MINUTES: ${{ vars.STAGING_GATE_TIMEOUT_MINUTES || '60' }}
        run: |
          set -euo pipefail
          if [ "$STAGING_ENABLED" != "true" ]; then
            echo "GCP_STAGING_ENABLED != 'true' — no staging tier to gate on; proceeding straight to prod."
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch — skipping the staging wait (human judgment overrides the gate)."
            exit 0
          fi
          DEADLINE=$((SECONDS + GATE_TIMEOUT_MINUTES * 60))
          APPEAR_DEADLINE=$((SECONDS + 600))
          while :; do
            RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-staging.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] // empty')"
            if [ -z "$RUN" ]; then
              # Both workflows share the same push trigger + paths-ignore, so a missing staging run
              # is unexpected — but give the Actions API a grace window before declaring it absent.
              if [ "$SECONDS" -ge "$APPEAR_DEADLINE" ]; then
                echo "::error::No deploy-staging run appeared for ${GITHUB_SHA} within 10 min. If staging was intentionally not run for this commit, release manually via workflow_dispatch (which bypasses this gate)." >&2
                exit 1
              fi
              echo "No staging run for this sha yet — waiting…"
            else
              STATUS="$(echo "$RUN" | jq -r '.status')"
              CONCLUSION="$(echo "$RUN" | jq -r '.conclusion // empty')"
              ATTEMPT="$(echo "$RUN" | jq -r '.run_attempt // 1')"
              URL="$(echo "$RUN" | jq -r '.html_url')"
              if [ "$STATUS" != "completed" ]; then
                echo "Staging run in progress (attempt ${ATTEMPT}): ${URL} — waiting…"
              elif [ "$CONCLUSION" = "success" ]; then
                echo "Staging is green for ${GITHUB_SHA} (attempt ${ATTEMPT}): ${URL} — promoting to production."
                exit 0
              elif [ "$ATTEMPT" -ge 2 ]; then
                echo "::error::Staging is red for ${GITHUB_SHA} even after the automatic retry (conclusion: ${CONCLUSION}, attempt ${ATTEMPT}): ${URL}. deploy-autoheal.yml has escalated it as a deploy-failure issue — fix staging (or land the fix on main) and the next merge promotes normally. Production was NOT deployed and keeps serving the previous revision." >&2
                exit 1
              else
                # First failure: deploy-autoheal.yml re-runs the failed jobs shortly. Keep waiting —
                # the run's conclusion flips back to in-progress once the retry starts.
                echo "Staging attempt 1 concluded ${CONCLUSION}: ${URL} — waiting for the automatic retry (deploy-autoheal.yml)…"
              fi
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Staging still not green after ${GATE_TIMEOUT_MINUTES} min — giving up without deploying to production. Inspect the staging run, then either land a fix on main or release manually via workflow_dispatch." >&2
              exit 1
            fi
            sleep 30
          done

  deploy:
    name: build · migrate · deploy
    runs-on: ubuntu-latest
    needs: staging-gate
    # The arming switch: no-op until a maintainer sets the variable post-provisioning.
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    # GitHub Environment gate (docs/LAUNCH-DEPLOYMENT-STRATEGY.md §3b). With no protection rules
    # configured this is a no-op; once a required reviewer is added in repo Settings → Environments,
    # every prod deploy pauses for a human approval. Prod-scoped secrets/vars can move here too.
    environment: production
    permissions:
      contents: read
      id-token: write # mints the OIDC token the Authenticate step federates via Workload Identity
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/lynia-api
    steps:
      - uses: actions/checkout@v7

      # Fail fast with a clear message if armed but mis-configured, rather than an opaque
      # mid-run error after a build has already started.
      - name: Validate required deploy config
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
          VPC_CONNECTOR: ${{ vars.VPC_CONNECTOR }}
          CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          required="GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPO CLOUD_RUN_SERVICE CLOUD_SQL_INSTANCE VPC_CONNECTOR CLOUD_RUN_SERVICE_ACCOUNT GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT"
          # MIGRATE_DATABASE_URL (the Auth-Proxy URL) is only needed for the public-IP migration path.
          # In DB_PRIVATE_ONLY mode migrations run as an in-VPC Cloud Run job over the DATABASE_URL secret.
          if [ "${{ vars.DB_PRIVATE_ONLY }}" != "true" ]; then
            required="$required MIGRATE_DATABASE_URL"
          fi
          for v in $required; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::GCP_DEPLOY_ENABLED is true but these are unset: ${missing[*]}. See infra/terraform/README.md → arming guide." >&2
            exit 1
          fi
          echo "All required deploy config present."

      # Pre-flight the PRODUCTION launch-hygiene boot-guards (apps/api/src/config/env.ts) BEFORE the
      # build. release.yml hardcodes APP_ENV=production, so these three guards reject the container at
      # boot if a QA repo Variable leaks into prod — but that failure otherwise surfaces only after a
      # ~3-min build + migrate as an opaque Cloud Run "container failed to start on :3000". Mirror the
      # guards here so the misconfig fails in seconds with an actionable message. Effective values are
      # computed exactly as the deploy step below; KYC_MODE is never injected, so it is the app default
      # "auto" (hence KYC_PROVIDER=stub ⇒ rejected).
      - name: Validate production launch-hygiene config
        env:
          OTP_CHANNEL: ${{ vars.OTP_CHANNEL || 'whatsapp' }}
          OTP_TEST_PHONES: ${{ vars.OTP_TEST_PHONES }}
          KYC_PROVIDER: ${{ vars.KYC_PROVIDER || 'didit' }}
          WHATSAPP_ENABLED: ${{ vars.WHATSAPP_ENABLED }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME }}
          OTP_WHATSAPP_UNARMED_ACK: ${{ vars.OTP_WHATSAPP_UNARMED_ACK }}
          OTP_WHATSAPP_UNARMED_ACK_EXPIRES: ${{ vars.OTP_WHATSAPP_UNARMED_ACK_EXPIRES }}
          BIRD_ENABLED: ${{ vars.BIRD_ENABLED }}
          BIRD_WORKSPACE_ID: ${{ vars.BIRD_WORKSPACE_ID }}
          BIRD_SMS_CHANNEL_ID: ${{ vars.BIRD_SMS_CHANNEL_ID }}
          LOCAL_SMS_ENABLED: ${{ vars.LOCAL_SMS_ENABLED }}
          LOCAL_SMS_API_URL: ${{ vars.LOCAL_SMS_API_URL }}
        run: |
          set -euo pipefail
          errors=()
          if [ "$OTP_CHANNEL" = "console" ]; then
            errors+=("OTP_CHANNEL=console is a dev-only channel and must not be used in production — clear the OTP_CHANNEL repo Variable (defaults to whatsapp) or set it to whatsapp/sms.")
          fi
          if [ -n "$(printf '%s' "$OTP_TEST_PHONES" | tr -d '[:space:]')" ]; then
            errors+=("OTP_TEST_PHONES must be empty in production — it exposes live OTP codes in the response. Clear the OTP_TEST_PHONES repo Variable.")
          fi
          if [ "$KYC_PROVIDER" = "stub" ]; then
            errors+=("KYC_PROVIDER=stub auto-passes verification and must not ship to production — stub KYC must never gate real riders. Clear the KYC_PROVIDER repo Variable (defaults to didit) or switch to manual review.")
          fi
          # OTP must actually be able to SEND, not just boot. These two misconfigs pass the env-schema
          # boot-guards and the canary /healthz gate, then 503 every requestOtp at runtime — production
          # shipped exactly this way twice (2026-07-08 un-armed, 2026-07-13 half-armed with empty vars;
          # docs/GCP-PENDING-REVIEW-2026-07-13.md §3). WhatsAppOtpSender.send() requires phone-number-id,
          # token, and template (apps/api/src/auth/otp-sender.ts), so guard all of them here.
          #
          # Pre-launch exception: OTP_WHATSAPP_UNARMED_ACK=true plus a not-yet-passed
          # OTP_WHATSAPP_UNARMED_ACK_EXPIRES (YYYY-MM-DD) downgrades an unarmed-WhatsApp finding from a
          # hard failure to a loud warning, so unrelated bug/UX fixes can keep shipping during the known,
          # time-boxed pre-launch window where WhatsApp isn't armed yet. It never goes silent: the warning
          # prints on every single deploy, and once the expiry date passes this reverts to a hard failure
          # automatically — the ack can't be set once and forgotten.
          whatsapp_errors=()
          if [ "$OTP_CHANNEL" = "whatsapp" ]; then
            if [ "$WHATSAPP_ENABLED" != "true" ]; then
              whatsapp_errors+=("OTP_CHANNEL=whatsapp (the default) but WHATSAPP_ENABLED != true — no WhatsApp credentials are injected, so every production sign-in OTP would 503. Arm WhatsApp (WHATSAPP_ENABLED=true + WHATSAPP_PHONE_NUMBER_ID / WHATSAPP_TEMPLATE_NAME repo Variables + WHATSAPP_ACCESS_TOKEN secret) or set OTP_CHANNEL=sms.")
            elif [ -z "$(printf '%s' "$WHATSAPP_PHONE_NUMBER_ID" | tr -d '[:space:]')" ] || [ -z "$(printf '%s' "$WHATSAPP_TEMPLATE_NAME" | tr -d '[:space:]')" ]; then
              whatsapp_errors+=("WHATSAPP_ENABLED=true but WHATSAPP_PHONE_NUMBER_ID and/or WHATSAPP_TEMPLATE_NAME repo Variables are empty — the service boots green yet every requestOtp 503s. Set both (Meta Business → WhatsApp → API setup; template must be an approved authentication-category template).")
            fi
          fi
          # Same "must actually SEND" guard for the Bird SMS channel. BirdOtpSender.send() requires the
          # access key, workspace id, and SMS channel id (apps/api/src/auth/otp-sender.ts); a missing one
          # boots green and 503s every requestOtp. No pre-launch ack window (unlike WhatsApp) — bird is
          # the fast path chosen precisely to be armed now, so an unarmed bird deploy is always an error.
          if [ "$OTP_CHANNEL" = "bird" ]; then
            if [ "$BIRD_ENABLED" != "true" ]; then
              errors+=("OTP_CHANNEL=bird but BIRD_ENABLED != true — no Bird credentials are injected, so every production sign-in OTP would 503. Arm Bird (BIRD_ENABLED=true + BIRD_WORKSPACE_ID / BIRD_SMS_CHANNEL_ID repo Variables + BIRD_ACCESS_KEY secret) or set OTP_CHANNEL=whatsapp.")
            elif [ -z "$(printf '%s' "$BIRD_WORKSPACE_ID" | tr -d '[:space:]')" ] || [ -z "$(printf '%s' "$BIRD_SMS_CHANNEL_ID" | tr -d '[:space:]')" ]; then
              errors+=("BIRD_ENABLED=true but BIRD_WORKSPACE_ID and/or BIRD_SMS_CHANNEL_ID repo Variables are empty — the service boots green yet every requestOtp 503s. Set both (Bird dashboard → Channels → your SMS channel).")
            fi
          fi
          # Same "must actually SEND" guard for the local A2P SMS channel. LocalSmsOtpSender.send()
          # requires the gateway URL + API key (apps/api/src/auth/otp-sender.ts); a missing one boots
          # green and 503s every requestOtp. Like bird, no pre-launch ack window.
          if [ "$OTP_CHANNEL" = "local-sms" ]; then
            if [ "$LOCAL_SMS_ENABLED" != "true" ]; then
              errors+=("OTP_CHANNEL=local-sms but LOCAL_SMS_ENABLED != true — no gateway credentials are injected, so every production sign-in OTP would 503. Arm it (LOCAL_SMS_ENABLED=true + LOCAL_SMS_API_URL repo Variable + LOCAL_SMS_API_KEY secret) or set OTP_CHANNEL=whatsapp.")
            elif [ -z "$(printf '%s' "$LOCAL_SMS_API_URL" | tr -d '[:space:]')" ]; then
              errors+=("LOCAL_SMS_ENABLED=true but LOCAL_SMS_API_URL repo Variable is empty — the service boots green yet every requestOtp 503s. Set it to your A2P gateway's send endpoint.")
            fi
          fi
          ack_active=false
          if [ ${#whatsapp_errors[@]} -gt 0 ]; then
            if [ "$OTP_WHATSAPP_UNARMED_ACK" = "true" ] && [ -n "$OTP_WHATSAPP_UNARMED_ACK_EXPIRES" ]; then
              expires_epoch="$(date -d "$OTP_WHATSAPP_UNARMED_ACK_EXPIRES" +%s 2>/dev/null || true)"
              now_epoch="$(date +%s)"
              if [ -n "$expires_epoch" ] && [ "$now_epoch" -lt "$expires_epoch" ]; then
                ack_active=true
              fi
            fi
            if [ "$ack_active" = "true" ]; then
              for e in "${whatsapp_errors[@]}"; do echo "::warning::$e"; done
              echo "::warning::OTP_WHATSAPP_UNARMED_ACK is active until $OTP_WHATSAPP_UNARMED_ACK_EXPIRES — deploying anyway with WhatsApp OTP known broken. Production sign-in will 503 until WhatsApp is armed."
            else
              errors+=("${whatsapp_errors[@]}")
              if [ "$OTP_WHATSAPP_UNARMED_ACK" = "true" ]; then
                errors+=("OTP_WHATSAPP_UNARMED_ACK is true but OTP_WHATSAPP_UNARMED_ACK_EXPIRES is missing, unparseable, or in the past — the pre-launch exception has expired or is misconfigured. Arm WhatsApp, or set a fresh future OTP_WHATSAPP_UNARMED_ACK_EXPIRES (YYYY-MM-DD) to extend the window.")
              fi
            fi
          fi
          if [ ${#errors[@]} -gt 0 ]; then
            for e in "${errors[@]}"; do echo "::error::$e"; done
            echo "::error::Production launch-hygiene guards (apps/api/src/config/env.ts) would reject this deploy at container boot. Fix the repo Variables above, then re-run. See docs/PILOT-READINESS.md." >&2
            exit 1
          fi
          whatsapp_note=""
          if [ "$OTP_CHANNEL" = "whatsapp" ]; then
            if [ "$ack_active" = "true" ]; then
              whatsapp_note=", WhatsApp UNARMED (ack active until $OTP_WHATSAPP_UNARMED_ACK_EXPIRES)"
            else
              whatsapp_note=", WhatsApp armed"
            fi
          fi
          echo "Launch-hygiene config OK (OTP_CHANNEL=$OTP_CHANNEL, KYC_PROVIDER=$KYC_PROVIDER, OTP_TEST_PHONES empty${whatsapp_note})."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          # Keyless Workload Identity Federation — no long-lived SA key.
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # A prior OTel activation (`gcloud run services replace infra/otel-collector/service.yaml`) leaves
      # an otel-collector sidecar on the service. The `gcloud run deploy --image` step below PRESERVES
      # existing sidecars, so a broken/misconfigured collector then fails EVERY release at container
      # start with an opaque "container failed to start on :3000" — the app never even runs, because a
      # sidecar that can't go healthy fails the whole instance. This wedged prod deploys 2026-07-08→07-10
      # (see docs/OBSERVABILITY.md → Production activation). A release is single-container by contract:
      # fail fast with the exact remediation unless the sidecar is intentionally armed.
      - name: Guard against an orphaned collector sidecar
        if: ${{ vars.OTEL_SIDECAR_ENABLED != 'true' }}
        run: |
          set -euo pipefail
          names="$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format 'value(spec.template.spec.containers[].name)' 2>/dev/null || true)"
          # First-ever deploy: the service doesn't exist yet — nothing to guard.
          if [ -z "$names" ]; then
            echo "Service not found yet (first deploy) — single-container by default."
            exit 0
          fi
          count="$(printf '%s' "$names" | tr ';,' '\n\n' | grep -c '[^[:space:]]' || true)"
          if [ "${count:-0}" -gt 1 ]; then
            echo "::error::${{ vars.CLOUD_RUN_SERVICE }} currently has ${count} containers (${names}). A normal release is single-container and gcloud inherits the extra sidecar, wedging the deploy. Remove it first — gcloud run services update ${{ vars.CLOUD_RUN_SERVICE }} --region ${{ vars.GCP_REGION }} --remove-containers otel-collector — or set the OTEL_SIDECAR_ENABLED=true repo Variable if the sidecar is intentional. See docs/OBSERVABILITY.md → Production activation." >&2
            exit 1
          fi
          echo "Single-container service confirmed (${names})."

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # Buildx (docker-container driver) is required to import/export a registry layer cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same-image promotion (docs/LAUNCH-DEPLOYMENT-STRATEGY.md §3c: "what you tested is what
      # ships"): with the staging-gate ordering prod AFTER a green staging run, the :<sha> tag
      # normally already exists — built, deployed, and smoke-tested by deploy-staging.yml. Promote
      # that exact digest (just add :latest) instead of rebuilding. Fall back to a full build only
      # when the tag is absent (staging unarmed, or a manual dispatch of a sha staging never built).
      - name: Promote staging image (or build if absent)
        run: |
          set -euo pipefail
          if gcloud artifacts docker images describe "$IMAGE:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Reusing $IMAGE:${GITHUB_SHA} built and smoke-tested by deploy-staging — no rebuild; adding :latest."
            gcloud artifacts docker tags add "$IMAGE:${GITHUB_SHA}" "$IMAGE:latest" --quiet
            exit 0
          fi
          echo "No prebuilt image for ${GITHUB_SHA} — building from scratch."
          # Registry layer cache (mode=max caches ALL stages, incl. the heavy `deps` pnpm install and
          # the Prisma engine download — not just the final stage like inline cache). Stored as a
          # separate :buildcache tag in Artifact Registry. First run is a cold miss that seeds it;
          # later deploys with an unchanged lockfile/schema skip the slow network steps. The cache
          # ref is missing-tolerant, so a fresh repo just builds cold. When staging is armed it owns
          # the cache write instead (deploy-staging.yml builds first; the gate serializes the two).
          docker buildx build \
            -f apps/api/Dockerfile \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true" \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" \
            --push .

      # PUBLIC-IP migration path (default): the GitHub runner reaches Cloud SQL over the Auth Proxy.
      # Requires the instance to have a public IP (var.db_public_ip_enabled = true).
      - name: Apply database migrations (via Cloud SQL Auth Proxy)
        if: ${{ vars.DB_PRIVATE_ONLY != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          set -euo pipefail
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${{ vars.CLOUD_SQL_INSTANCE }}" --port 5432 &
          PROXY_PID=$!
          # Wait for the proxy to accept connections, then migrate.
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break || sleep 1; done
          corepack enable
          pnpm install --frozen-lockfile=false
          pnpm --filter @lynia/api prisma:generate
          pnpm --filter @lynia/api migrate:deploy
          kill "$PROXY_PID" || true

      # PRIVATE-ONLY migration path: no public IP on Cloud SQL. Migrations run as a Cloud Run JOB inside
      # the VPC, reaching the instance over the SAME `/cloudsql/<conn>` unix socket the runtime service
      # uses (the DATABASE_URL secret), so nothing has to traverse the public internet. The job reuses
      # the freshly-pushed image (which contains the prisma CLI + migrations + engines) and runs as the
      # runtime SA (already has cloudsql.client + secretAccessor on DATABASE_URL). Deploy is idempotent
      # create-or-update; execute --wait fails the release if a migration fails. Enable by setting the
      # DB_PRIVATE_ONLY=true repo variable together with db_public_ip_enabled=false in Terraform.
      - name: Apply database migrations (in-VPC Cloud Run job)
        if: ${{ vars.DB_PRIVATE_ONLY == 'true' }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy lynia-migrate \
            --image "$IMAGE:${GITHUB_SHA}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --vpc-connector "${{ vars.VPC_CONNECTOR }}" \
            --vpc-egress private-ranges-only \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --max-retries 1 \
            --task-timeout 600 \
            --command sh \
            --args '-c,cd /repo/apps/api && PATH="/repo/apps/api/node_modules/.bin:/repo/node_modules/.bin:$PATH" prisma migrate deploy'
          gcloud run jobs execute lynia-migrate \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait

      # Canary rollout (docs/LAUNCH-DEPLOYMENT-STRATEGY.md §2): remember which revision serves
      # traffic NOW so a failed canary can route back to it in seconds. Empty on the first-ever
      # deploy of the service (then the canary is skipped and the new revision takes 100%).
      - name: Capture current serving revision (rollback target)
        id: prev
        run: |
          set -euo pipefail
          PREV="$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format json 2>/dev/null \
            | jq -r '([.status.traffic[]? | select((.percent // 0) > 0)] | max_by(.percent) | .revisionName) // empty' \
            || true)"
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"
          echo "Current serving revision: ${PREV:-<none — first deploy>}"

      # --ingress internal-and-cloud-load-balancing: the service is fronted by the
      # external HTTPS ALB (infra/terraform/lb.tf) and the org disables the default
      # *.run.app edge URL, so only LB + internal traffic should reach Cloud Run.
      # This also satisfies a constraints/run.allowedIngress org policy if enforced.
      # NOTE: if the org enforces domain-restricted sharing (allowedPolicyMemberDomains),
      # the allUsers bind below is rejected — drop --allow-unauthenticated and grant
      # invoker to an org-allowed principal. Check: gcloud resource-manager org-policies list.
      #
      # The revision is created with NO traffic (--no-traffic, tagged `canary`): gcloud still
      # waits for it to become Ready, so a crash-on-boot / bad-config revision (the env boot-guard
      # fails fast) fails THIS step while prod keeps serving the old revision untouched. Traffic
      # moves only in the canary step below. First-ever deploy skips --no-traffic (a new service
      # must route 100% somewhere).
      - name: Deploy to Cloud Run (new revision, no traffic)
        run: |
          set -euo pipefail
          TRAFFIC_FLAGS="--no-traffic --tag canary"
          if [ -z "${{ steps.prev.outputs.revision }}" ]; then
            TRAFFIC_FLAGS=""
          fi
          # OTP_CHANNEL / KYC_PROVIDER / PUSH_PROVIDER default to LAUNCH-SAFE values
          # (whatsapp / didit / fcm). QA/test mode is OPT-IN by setting the matching repo
          # Variables (OTP_CHANNEL=console, KYC_PROVIDER=stub, PUSH_PROVIDER=noop, plus
          # OTP_TEST_PHONES) — so "do nothing" can never ship a vendor-free, auto-KYC build
          # to the public URL, and flip-to-launch is just clearing those vars. The "^;^"
          # prefix sets ; as the env delimiter so values may contain commas (OTP_TEST_PHONES)
          # and @ (SCHEDULER_SERVICE_ACCOUNT is an SA email — the old @ delimiter split it
          # mid-value and broke the deploy; no value legitimately contains a semicolon).
          # APP_ENV=production is HARDCODED (not a repo Variable) so nothing can relax the
          # launch-hygiene boot-guards on the live service; only deploy-staging.yml sets staging.
          # MIN_SUPPORTED_APP_VERSION drives the server-side force-update gate (GET /app/version-gate);
          # unset injects "" which the env schema coerces to the inert default (gate off).
          # SCHEDULER_SERVICE_ACCOUNT lets the daily Cloud Scheduler jobs (retention purge — runbook §2)
          # authenticate with a Google OIDC token minted as the runtime SA (AdminOrSchedulerGuard).
          ENV_VARS="^;^NODE_ENV=production;APP_ENV=production;CLOUD_PROVIDER=gcp;STORAGE_BUCKET=lynia-media;GCP_STORAGE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }};OTP_CHANNEL=${{ vars.OTP_CHANNEL || 'whatsapp' }};OTP_TEST_PHONES=${{ vars.OTP_TEST_PHONES }};KYC_PROVIDER=${{ vars.KYC_PROVIDER || 'didit' }};PUSH_PROVIDER=${{ vars.PUSH_PROVIDER || 'fcm' }};MIN_SUPPORTED_APP_VERSION=${{ vars.MIN_SUPPORTED_APP_VERSION }};SCHEDULER_SERVICE_ACCOUNT=${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}"
          SECRETS="DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_SIGNING_SECRET=JWT_SIGNING_SECRET:latest,PII_ENCRYPTION_KEY=PII_ENCRYPTION_KEY:latest"

          # Didit KYC vendor wiring is OPT-IN via DIDIT_ENABLED=true. Gating it keeps launch-safe /
          # QA deploys from referencing Didit secrets before the founder has created them — a missing
          # --set-secrets target fails the whole deploy. Once DIDIT_API_KEY / DIDIT_WEBHOOK_SECRET exist
          # in Secret Manager and DIDIT_WORKFLOW_ID / DIDIT_CALLBACK_URL are set as repo Variables, flip
          # DIDIT_ENABLED=true to activate real KYC (riders.module selects DiditKycVendor only when
          # KYC_PROVIDER=didit AND DIDIT_API_KEY is present, so until then it safely falls back to stub).
          if [ "${{ vars.DIDIT_ENABLED }}" = "true" ]; then
            ENV_VARS="${ENV_VARS};DIDIT_WORKFLOW_ID=${{ vars.DIDIT_WORKFLOW_ID }}"
            # DIDIT_CALLBACK_URL is the optional post-verification redirect. Inject it ONLY when set —
            # an empty value (`DIDIT_CALLBACK_URL=`) fails the URL schema and crashes boot.
            if [ -n "${{ vars.DIDIT_CALLBACK_URL }}" ]; then
              ENV_VARS="${ENV_VARS};DIDIT_CALLBACK_URL=${{ vars.DIDIT_CALLBACK_URL }}"
            fi
            SECRETS="${SECRETS},DIDIT_API_KEY=DIDIT_API_KEY:latest,DIDIT_WEBHOOK_SECRET=DIDIT_WEBHOOK_SECRET:latest"
          fi

          # WhatsApp Cloud API (OTP) wiring is OPT-IN via WHATSAPP_ENABLED=true — same reason as Didit:
          # don't reference WHATSAPP_ACCESS_TOKEN before it exists. Set OTP_CHANNEL=whatsapp + the
          # WHATSAPP_PHONE_NUMBER_ID / WHATSAPP_TEMPLATE_NAME repo Variables and the token secret, then
          # flip WHATSAPP_ENABLED=true. (Until then OTP runs on the console/QA channel.)
          if [ "${{ vars.WHATSAPP_ENABLED }}" = "true" ]; then
            ENV_VARS="${ENV_VARS};WHATSAPP_PHONE_NUMBER_ID=${{ vars.WHATSAPP_PHONE_NUMBER_ID }};WHATSAPP_TEMPLATE_NAME=${{ vars.WHATSAPP_TEMPLATE_NAME }}"
            if [ -n "${{ vars.WHATSAPP_TEMPLATE_LANG }}" ]; then
              ENV_VARS="${ENV_VARS};WHATSAPP_TEMPLATE_LANG=${{ vars.WHATSAPP_TEMPLATE_LANG }}"
            fi
            SECRETS="${SECRETS},WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest"
          fi

          # Bird (bird.com) SMS OTP wiring is OPT-IN via BIRD_ENABLED=true — same reason as WhatsApp/Didit:
          # don't reference BIRD_ACCESS_KEY before it exists in Secret Manager. Set OTP_CHANNEL=bird + the
          # BIRD_WORKSPACE_ID / BIRD_SMS_CHANNEL_ID repo Variables and the access-key secret, then flip
          # BIRD_ENABLED=true. BIRD_BASE_URL / BIRD_BRAND_NAME / BIRD_ANDROID_SMS_HASH are optional
          # overrides (the app defaults to api.bird.com / "LyniaGo" / no Android hash).
          if [ "${{ vars.BIRD_ENABLED }}" = "true" ]; then
            ENV_VARS="${ENV_VARS};BIRD_WORKSPACE_ID=${{ vars.BIRD_WORKSPACE_ID }};BIRD_SMS_CHANNEL_ID=${{ vars.BIRD_SMS_CHANNEL_ID }}"
            if [ -n "${{ vars.BIRD_BASE_URL }}" ]; then
              ENV_VARS="${ENV_VARS};BIRD_BASE_URL=${{ vars.BIRD_BASE_URL }}"
            fi
            if [ -n "${{ vars.BIRD_BRAND_NAME }}" ]; then
              ENV_VARS="${ENV_VARS};BIRD_BRAND_NAME=${{ vars.BIRD_BRAND_NAME }}"
            fi
            if [ -n "${{ vars.BIRD_ANDROID_SMS_HASH }}" ]; then
              ENV_VARS="${ENV_VARS};BIRD_ANDROID_SMS_HASH=${{ vars.BIRD_ANDROID_SMS_HASH }}"
            fi
            SECRETS="${SECRETS},BIRD_ACCESS_KEY=BIRD_ACCESS_KEY:latest"
          fi

          # Local A2P SMS OTP wiring (Zimbabwe fallback) is OPT-IN via LOCAL_SMS_ENABLED=true — same
          # reason as the others: don't reference LOCAL_SMS_API_KEY before it exists in Secret Manager.
          # Set OTP_CHANNEL=local-sms + the LOCAL_SMS_API_URL repo Variable and the key secret, then flip
          # LOCAL_SMS_ENABLED=true. LOCAL_SMS_SENDER_ID / LOCAL_SMS_ANDROID_HASH are optional overrides
          # (the app defaults the sender to "LyniaGo" and adds no Android hash).
          if [ "${{ vars.LOCAL_SMS_ENABLED }}" = "true" ]; then
            ENV_VARS="${ENV_VARS};LOCAL_SMS_API_URL=${{ vars.LOCAL_SMS_API_URL }}"
            if [ -n "${{ vars.LOCAL_SMS_SENDER_ID }}" ]; then
              ENV_VARS="${ENV_VARS};LOCAL_SMS_SENDER_ID=${{ vars.LOCAL_SMS_SENDER_ID }}"
            fi
            if [ -n "${{ vars.LOCAL_SMS_ANDROID_HASH }}" ]; then
              ENV_VARS="${ENV_VARS};LOCAL_SMS_ANDROID_HASH=${{ vars.LOCAL_SMS_ANDROID_HASH }}"
            fi
            SECRETS="${SECRETS},LOCAL_SMS_API_KEY=LOCAL_SMS_API_KEY:latest"
          fi

          # Sentry crash reporting (roadmap 1.1 / LR20) is OPT-IN via SENTRY_ENABLED=true — same reason
          # as the vendor keys above: don't reference the SENTRY_DSN secret before it exists in Secret
          # Manager (a missing --set-secrets target fails the whole deploy). Create the SENTRY_DSN secret
          # + grant the runtime SA secretAccessor first, THEN set SENTRY_ENABLED=true. The API's
          # initSentry() is inert when SENTRY_DSN is unset, so leaving this off changes nothing.
          # SENTRY_TRACES_SAMPLE_RATE is an optional repo Variable override (the app defaults to 0.1).
          if [ "${{ vars.SENTRY_ENABLED }}" = "true" ]; then
            ENV_VARS="${ENV_VARS};SENTRY_ENVIRONMENT=production"
            if [ -n "${{ vars.SENTRY_TRACES_SAMPLE_RATE }}" ]; then
              ENV_VARS="${ENV_VARS};SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE }}"
            fi
            SECRETS="${SECRETS},SENTRY_DSN=SENTRY_DSN:latest"
          fi

          # OTel collector sidecar (docs/OBSERVABILITY.md → Production activation): when the
          # OTEL_SIDECAR_ENABLED repo Variable is true, the release deploys BOTH containers
          # explicitly — the revision spec is fully code-driven, so a hand-edited or broken sidecar
          # is REPLACED (not inherited) on every deploy, which is what makes the sidecar safe after
          # the 2026-07-08→07-10 inherited-sidecar incident. The API's OTLP exporters wake up via
          # OTEL_EXPORTER_OTLP_ENDPOINT, coupled HERE to the sidecar's presence — endpoint set ⇔
          # collector present. The collector mounts its pipeline from the Terraform-managed
          # otel-collector-config secret (infra/terraform/otel.tf) and pulls through the project's
          # Docker Hub mirror (a direct docker.io pull hits anonymous rate limits — override the
          # image via the OTEL_COLLECTOR_IMAGE repo Variable, e.g. to pin a digest).
          # When the flag is unset this branch is byte-identical to the pre-sidecar deploy, and the
          # orphaned-sidecar guard above has already refused to run if a sidecar is present anyway.
          if [ "${{ vars.OTEL_SIDECAR_ENABLED }}" = "true" ]; then
            ENV_VARS="${ENV_VARS};OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318;OTEL_SERVICE_NAME=lynia-api"
            OTEL_IMAGE="${{ vars.OTEL_COLLECTOR_IMAGE }}"
            if [ -z "$OTEL_IMAGE" ]; then
              OTEL_IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dockerhub-remote/otel/opentelemetry-collector-contrib:0.116.0"
            fi
            gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}" \
              --platform managed \
              --timeout 3600 \
              --service-account "${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}" \
              --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
              --vpc-connector "${{ vars.VPC_CONNECTOR }}" \
              --vpc-egress private-ranges-only \
              --ingress internal-and-cloud-load-balancing \
              --allow-unauthenticated \
              --container api \
              --image "$IMAGE:${GITHUB_SHA}" \
              --port 3000 \
              --set-env-vars "$ENV_VARS" \
              --set-secrets "$SECRETS" \
              --depends-on otel-collector \
              --container otel-collector \
              --image "$OTEL_IMAGE" \
              --args "--config=/etc/otelcol/config.yaml" \
              --cpu 1 \
              --memory 256Mi \
              --set-secrets "/etc/otelcol/config.yaml=otel-collector-config:latest" \
              $TRAFFIC_FLAGS
          else
            gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
              --image "$IMAGE:${GITHUB_SHA}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}" \
              --platform managed \
              --port 3000 \
              --timeout 3600 \
              --service-account "${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}" \
              --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
              --vpc-connector "${{ vars.VPC_CONNECTOR }}" \
              --vpc-egress private-ranges-only \
              --ingress internal-and-cloud-load-balancing \
              --set-env-vars "$ENV_VARS" \
              --set-secrets "$SECRETS" \
              --allow-unauthenticated \
              $TRAFFIC_FLAGS
          fi

      # Progressive promotion (docs/LAUNCH-DEPLOYMENT-STRATEGY.md §2b). The candidate's tagged
      # run.app URL is unreachable from here (default URLs disabled + LB-only ingress), so each
      # step is: shift a traffic share → observe for a window → gate on THREE signals → next step.
      # The three per-step gates:
      #   1. /healthz polled THROUGH the public LB stays ok for the whole window;
      #   2. the candidate revision is still Ready (a crash-looping canary shows here even though
      #      the LB poll mostly samples the old revision at low percentages);
      #   3. the candidate's own 5xx RATE from Cloud Run's BUILT-IN request metrics (Cloud
      #      Monitoring — no OTEL collector needed) stays under CANARY_MAX_5XX_PCT once at least
      #      CANARY_MIN_SAMPLE requests have hit it. Metric ingestion lags ~1-3 min, so the query
      #      window is cumulative since the first shift and "no data yet" is inconclusive-pass
      #      (gates 1+2 still hard-gate); a failed Monitoring API call warns and passes — arming
      #      note: the deployer SA needs roles/monitoring.viewer (infra/terraform/iam.tf).
      # Any gate failure fails this step and the rollback step re-points 100% to the pre-deploy
      # revision. Tunables (repo Variables, all optional):
      #   CANARY_STEPS            space-separated traffic shares before 100% (default "10 50")
      #   CANARY_OBSERVE_SECONDS  observation window PER STEP (default 120)
      #   CANARY_MIN_SAMPLE       min candidate requests before the 5xx gate judges (default 20)
      #   CANARY_MAX_5XX_PCT      max candidate 5xx percentage (default 5)
      #   PUBLIC_HEALTH_URL       health endpoint via the LB (default the live domain /healthz)
      #   CANARY_DISABLED         "true" → old behavior: promote to 100% immediately
      # Note on migrations: they ran above, BEFORE any traffic moved — safe because the repo
      # enforces expand-only/online-safe migrations (src/prisma/migration-safety.spec.ts), so the
      # still-serving old revision keeps working against the migrated schema.
      - name: Canary — graduated shift, observe, promote
        id: canary
        run: |
          set -euo pipefail
          SERVICE="${{ vars.CLOUD_RUN_SERVICE }}"
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          PREV="${{ steps.prev.outputs.revision }}"
          CANDIDATE="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format 'value(status.latestCreatedRevisionName)')"
          echo "Candidate revision: $CANDIDATE (previous: ${PREV:-<none>})"

          if [ -z "$PREV" ] || [ "${{ vars.CANARY_DISABLED }}" = "true" ]; then
            echo "Canary skipped ($([ -z "$PREV" ] && echo 'first deploy' || echo 'CANARY_DISABLED=true')) — routing 100% to the new revision."
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --to-latest
            exit 0
          fi

          STEPS="${{ vars.CANARY_STEPS || '10 50' }}"
          OBSERVE="${{ vars.CANARY_OBSERVE_SECONDS || '120' }}"
          HEALTH_URL="${{ vars.PUBLIC_HEALTH_URL || 'https://lyniago.lyniafinance.com/healthz' }}"
          MIN_SAMPLE="${{ vars.CANARY_MIN_SAMPLE || '20' }}"
          MAX_5XX_PCT="${{ vars.CANARY_MAX_5XX_PCT || '5' }}"
          START_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Gate 1: the LB-facing health endpoint stays ok for the whole observation window.
          observe_health() {
            echo "Observing $HEALTH_URL for ${OBSERVE}s…"
            local end=$((SECONDS + OBSERVE)) body
            while [ "$SECONDS" -lt "$end" ]; do
              body="$(curl -fsS --max-time 10 "$HEALTH_URL")" \
                || { echo "::error::Health check request failed during canary window."; return 1; }
              echo "$body" | grep -q '"status":"ok"' \
                || { echo "::error::Health degraded during canary window: $body"; return 1; }
              sleep 5
            done
          }

          # Gate 2: the candidate revision itself is still Ready.
          assert_ready() {
            local ready
            ready="$(gcloud run revisions describe "$CANDIDATE" --project "$PROJECT" --region "$REGION" \
              --format json | jq -r '.status.conditions[]? | select(.type=="Ready") | .status')"
            [ "$ready" = "True" ] \
              || { echo "::error::Candidate revision $CANDIDATE is not Ready after the observation window."; return 1; }
          }

          # Gate 3: candidate 5xx rate from Cloud Run's built-in request_count metric, cumulative
          # since the first shift. No data / API failure = inconclusive-pass (gates 1+2 hard-gate).
          check_error_rate() {
            local token resp total err5xx
            token="$(gcloud auth print-access-token)"
            resp="$(curl -fsS -G "https://monitoring.googleapis.com/v3/projects/${PROJECT}/timeSeries" \
              -H "Authorization: Bearer $token" \
              --data-urlencode "filter=metric.type=\"run.googleapis.com/request_count\" AND resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE}\" AND resource.labels.revision_name=\"${CANDIDATE}\"" \
              --data-urlencode "interval.startTime=${START_TS}" \
              --data-urlencode "interval.endTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --data-urlencode "aggregation.alignmentPeriod=60s" \
              --data-urlencode "aggregation.perSeriesAligner=ALIGN_SUM" \
              --data-urlencode "aggregation.crossSeriesReducer=REDUCE_SUM" \
              --data-urlencode "aggregation.groupByFields=metric.labels.response_code_class")" \
              || { echo "::warning::Monitoring query failed (deployer SA missing roles/monitoring.viewer?) — relying on health/readiness gates for this step."; return 0; }
            total="$(echo "$resp" | jq '[.timeSeries[]?.points[]?.value.int64Value // "0" | tonumber] | add // 0')"
            err5xx="$(echo "$resp" | jq '[.timeSeries[]? | select(.metric.labels.response_code_class == "5xx") | .points[]?.value.int64Value // "0" | tonumber] | add // 0')"
            echo "Candidate requests since ${START_TS}: total=${total}, 5xx=${err5xx}"
            if [ "$total" -lt "$MIN_SAMPLE" ]; then
              echo "Fewer than ${MIN_SAMPLE} candidate requests observed — 5xx gate inconclusive (metric ingestion lags ~1-3 min)."
              return 0
            fi
            if [ $((err5xx * 100)) -gt $((total * MAX_5XX_PCT)) ]; then
              echo "::error::Candidate 5xx rate $((err5xx * 100 / total))% over ${total} requests exceeds ${MAX_5XX_PCT}% — failing the canary."
              return 1
            fi
          }

          for PERCENT in $STEPS; do
            echo "Shifting ${PERCENT}% of traffic to $CANDIDATE (tag: canary)…"
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" \
              --to-tags "canary=${PERCENT}"
            observe_health
            assert_ready
            check_error_rate
          done

          echo "All canary steps healthy — promoting $CANDIDATE to 100%."
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" --to-latest

      # Automatic rollback: only when the canary step itself failed (a failed build/migrate never
      # moved traffic, so there is nothing to undo). Re-points 100% to the pre-deploy revision —
      # a traffic change, not a rebuild, so it lands in seconds. Manual path: rollback.yml.
      - name: Roll back traffic on failed canary
        if: ${{ failure() && steps.canary.outcome == 'failure' && steps.prev.outputs.revision != '' }}
        run: |
          set -euo pipefail
          echo "::warning::Canary failed — routing 100% of traffic back to ${{ steps.prev.outputs.revision }}."
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --to-revisions "${{ steps.prev.outputs.revision }}=100"

      # Best-effort post-mortem so a failed deploy self-diagnoses IN the Actions log instead of needing
      # a console dig into Cloud Logging. Dumps the failed candidate's container spec (surfaces an
      # inherited sidecar immediately) plus its recent Cloud Run logs. Needs roles/logging.viewer on the
      # deployer SA (infra/terraform/iam.tf); if absent it prints nothing and never fails the job —
      # diagnostic-only, and the job is already failing here.
      - name: Dump failed revision diagnostics
        if: ${{ failure() }}
        run: |
          set +e
          SVC="${{ vars.CLOUD_RUN_SERVICE }}"; P="${{ vars.GCP_PROJECT_ID }}"; R="${{ vars.GCP_REGION }}"
          REV="$(gcloud run services describe "$SVC" --project "$P" --region "$R" \
            --format 'value(status.latestCreatedRevisionName)' 2>/dev/null)"
          if [ -z "$REV" ]; then echo "No revision to inspect."; exit 0; fi
          echo "::group::Candidate revision $REV — containers (name / image)"
          gcloud run revisions describe "$REV" --project "$P" --region "$R" \
            --format 'value(spec.containers[].name, spec.containers[].image)' 2>/dev/null
          echo "::endgroup::"
          echo "::group::Cloud Run logs for $REV (last 60, severity>=WARNING, freshness 20m)"
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=$SVC AND resource.labels.revision_name=$REV AND severity>=WARNING" \
            --project "$P" --limit 60 --freshness 20m \
            --format 'value(timestamp,severity,textPayload,jsonPayload.message)' 2>/dev/null
          echo "::endgroup::"
          echo "Console: https://console.cloud.google.com/run/detail/$R/$SVC/revisions?project=$P"

      - name: Summary
        run: |
          echo "Deployed ${IMAGE}:${GITHUB_SHA} to Cloud Run service ${{ vars.CLOUD_RUN_SERVICE }} (${{ vars.GCP_REGION }}) via canary (previous revision ${{ steps.prev.outputs.revision || 'none' }})." >> "$GITHUB_STEP_SUMMARY"
