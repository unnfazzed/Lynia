name: Workflow Startup Watchdog

# Catches the one deploy failure mode NOTHING else in this repo can see (KB-CI-EXPR-EMPTY).
#
# When a workflow file is structurally valid YAML but contains an invalid Actions EXPRESSION, the
# run does not fail a job — it fails to COMPILE. GitHub records a run that completed in the same
# second with ZERO jobs, titled by file path because the `name:` was never parsed. That shape is
# invisible to every existing guard:
#
#   * CI is a different workflow, so it stays green and the merge looks clean.
#   * deploy-autoheal.yml cannot fire: `workflow_run.workflows` matches on the `name:` GitHub
#     failed to read, so no event is ever routed to it — no retry, no escalation issue.
#   * the PR-health watchdog looks at PRs, not at main's deploy tier.
#
# That combination silently no-op'd release.yml (prod) and deploy-staging.yml on every push to main
# for two days: five red runs, zero notifications, and a `main` that looked green.
#
# ci.yml's `actionlint · workflow syntax` job is the PREVENTION (it blocks the bad file at PR time).
# This is the DETECTION backstop for whatever gets past it — a direct push to main, a merge that
# bypassed the check, or a startup failure with a cause actionlint cannot model (e.g. a reusable
# workflow whose target ref was deleted after merge).
#
# Two independent checks, because each covers the other's blind spot:
#   A. Compile main's workflows directly. Deterministic, and it fires even during a quiet period —
#      a broken workflow that nobody pushes to produces no runs and therefore no run-based signal.
#   B. Scan main's recent runs for zero-job failures, then confirm the workflow is STILL broken by
#      its newest run. Catches causes that live in GitHub's evaluation of the file rather than in
#      the file's own syntax. The "still broken" re-check is what keeps a historical failure inside
#      the lookback window from being re-filed every hour after its fix has already landed.
#
# Escalates onto the same `deploy-failure` label the autoheal uses, so all deploy breakage lands in
# one queue. Titles are keyed to this watchdog and never contain a deploy workflow's `name:`, so the
# autoheal's title-substring matching cannot mistake these for its own issues (or auto-close them
# on an unrelated green deploy) — this workflow opens and closes its own.
#
# Check C covers the OTHER silent deploy stall (2026-07-29 incident): a run held at the
# `production` environment approval gate. A run waiting for a required reviewer is not red — no
# failure event, no autoheal, no notification beyond the one review-request email — and because
# release.yml and rollback.yml serialize on the `release-cloud-run` concurrency group, the waiting
# run blocks every release behind it (each newer merge cancels the previously queued run, so the
# queue never accumulates evidence either). Release run #298 sat like that for 54 hours while ten
# merges to main shipped nothing. The watchdog cannot approve the gate — only a reviewer can — so
# this check's whole job is to make the stall loud until a human clicks.

on:
  schedule:
    - cron: "20 * * * *" # hourly, off the top of the hour and clear of the routine-boundary hours
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-startup-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: compile main · scan for startup failures · approval stalls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # list workflow runs
      issues: write # escalation issue
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # always audit main, never the scheduled run's own stale ref

      # --- Check A: do main's workflows actually compile? -------------------------------------
      - name: Compile every workflow on main (actionlint)
        id: compile
        run: |
          set -euo pipefail
          VER=1.7.7
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VER}"
          curl -sSfL -o "actionlint_${VER}_linux_amd64.tar.gz" "${BASE}/actionlint_${VER}_linux_amd64.tar.gz"
          curl -sSfL -o actionlint_checksums.txt "${BASE}/actionlint_${VER}_checksums.txt"
          grep " actionlint_${VER}_linux_amd64.tar.gz\$" actionlint_checksums.txt | sha256sum -c -
          tar -xzf "actionlint_${VER}_linux_amd64.tar.gz" actionlint
          chmod +x actionlint
          # Only the [expression] rule can cause a startup failure; other findings are style and must
          # not page anyone at 03:20. `|| true` keeps a non-zero lint exit from aborting the step
          # before we can classify it.
          ./actionlint -no-color -oneline -shellcheck= -pyflakes= > lint.txt 2>&1 || true
          grep -F '[expression]' lint.txt > fatal.txt || true
          if [ -s fatal.txt ]; then
            echo "::error::main has workflow files that will not compile — deploys are silently no-op'ing."
            cat fatal.txt
            { echo "broken=true"; echo "detail<<EOF"; cat fatal.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "All workflows on main compile."
            echo "broken=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Check B: is any workflow on main CURRENTLY failing to start? ------------------------
      - name: Scan main's recent runs for startup failures
        id: scan
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '24 hours ago' +%s)"
          # Do NOT filter on conclusion == `startup_failure`. The incident this workflow exists for
          # was reported by the API as a plain `failure` on all ten runs; the only reliable signal was
          # that the run produced ZERO jobs (and completed in the same second it was created). So take
          # every red run in the window and classify it by job count, which is exact.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "startup_failure" or .conclusion == "failure") | "\(.created_at)\t\(.id)\t\(.workflow_id)\t\(.conclusion)\t\(.name)\t\(.html_url)"' \
            > raw.txt || true
          : > recent.txt
          CHECKED=0
          while IFS=$'\t' read -r created id wfid conclusion name url; do
            [ -n "${created:-}" ] || continue
            TS="$(date -u -d "$created" +%s)"
            [ "$TS" -ge "$CUTOFF" ] || continue
            # Bound the per-run job lookups so a burst of ordinary red runs cannot turn one watchdog
            # tick into a hundred API calls.
            CHECKED=$((CHECKED + 1))
            if [ "$CHECKED" -gt 20 ]; then
              echo "Reached the 20-run classification cap; stopping the scan here."
              break
            fi
            if [ "$conclusion" != "startup_failure" ]; then
              JOBS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo "unknown")"
              # A normal red run has >=1 job and is the autoheal's business, not ours. Only zero jobs
              # means the workflow never started. `unknown` (API hiccup) is skipped rather than
              # escalated — a false page every hour would train everyone to ignore this issue.
              [ "$JOBS" = "0" ] || continue
            fi
            # Is this workflow STILL broken, or has the fix already landed? A historical startup
            # failure inside the lookback window is not actionable once a later run of the same
            # workflow has started normally — escalating on it would re-file the same issue every
            # hour until the window rolls off, which is precisely the alert-fatigue failure this
            # watchdog is supposed to prevent. (Caught in practice: the first live run filed an
            # issue for the very incident whose fix had just merged.) So judge the workflow by its
            # NEWEST run on main, not by the historical one.
            [ -n "${wfid:-}" ] || continue
            case " ${SEEN_WF:-} " in *" $wfid "*) continue ;; esac
            SEEN_WF="${SEEN_WF:-} $wfid"
            LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wfid}/runs?branch=main&per_page=1" \
              --jq '.workflow_runs[0] | "\(.id)\t\(.status)\t\(.conclusion)"' 2>/dev/null || echo "")"
            [ -n "$LATEST" ] || continue
            L_ID="$(printf '%s' "$LATEST" | cut -f1)"
            L_STATUS="$(printf '%s' "$LATEST" | cut -f2)"
            L_CONCL="$(printf '%s' "$LATEST" | cut -f3)"
            # Anything not yet finished (queued/in_progress/pending, e.g. a run held at an
            # environment approval gate) means the workflow compiles and is running — not broken.
            [ "$L_STATUS" = "completed" ] || { echo "$name: latest run is $L_STATUS — compiling fine, skipping."; continue; }
            case "$L_CONCL" in
              startup_failure) ;;
              failure)
                L_JOBS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${L_ID}/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo "unknown")"
                [ "$L_JOBS" = "0" ] || { echo "$name: latest run failed but ran jobs — a normal red run, not a startup failure. Skipping."; continue; }
                ;;
              *) echo "$name: latest run on main concluded '$L_CONCL' — already recovered, skipping."; continue ;;
            esac
            printf '%s\t%s\t%s\n' "$created" "$name" "$url" >> recent.txt
          done < raw.txt
          if [ -s recent.txt ]; then
            echo "Startup failures on main in the last 24h:"
            cat recent.txt
            { echo "found=true"; echo "detail<<EOF"; sed 's/^/- /' recent.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "No startup failures on main in the last 24h."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Check C: is a deploy run stalled at an environment approval gate? -------------------
      # `status=waiting` is exactly "a job is held by a deployment protection rule" (required
      # reviewer on the `production` environment). Age is measured from the run's creation because
      # that is the moment the release stopped moving for the operator — the staging-gate minutes
      # before the approval was requested are part of the stall from their point of view. Threshold
      # is generous enough (default 4h) that a same-work-session approval never pages.
      - name: Scan for deploy runs stalled at an approval gate
        id: stall
        env:
          STALL_THRESHOLD_HOURS: ${{ vars.APPROVAL_STALL_THRESHOLD_HOURS || '4' }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%s)"
          : > stalled.txt
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=waiting&per_page=50" \
            --jq '.workflow_runs[] | "\(.created_at)\t\(.name)\t\(.html_url)"' > waiting.txt || true
          while IFS=$'\t' read -r created name url; do
            [ -n "${created:-}" ] || continue
            AGE_H="$(( (NOW - $(date -u -d "$created" +%s)) / 3600 ))"
            if [ "$AGE_H" -ge "$STALL_THRESHOLD_HOURS" ]; then
              printf -- '- **%s** — waiting ~%sh for a deployment approval (triggered %s): %s\n' \
                "$name" "$AGE_H" "$created" "$url" >> stalled.txt
            else
              echo "$name: waiting ${AGE_H}h (< ${STALL_THRESHOLD_HOURS}h threshold) — normal approval latency, skipping."
            fi
          done < waiting.txt
          if [ -s stalled.txt ]; then
            echo "Runs stalled at an approval gate past the ${STALL_THRESHOLD_HOURS}h threshold:"
            cat stalled.txt
            { echo "found=true"; echo "detail<<EOF"; cat stalled.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "No runs stalled at an approval gate."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Escalate — open or refresh a deploy-failure issue
        if: ${{ steps.compile.outputs.broken == 'true' || steps.scan.outputs.found == 'true' }}
        env:
          COMPILE_BROKEN: ${{ steps.compile.outputs.broken }}
          COMPILE_DETAIL: ${{ steps.compile.outputs.detail }}
          SCAN_FOUND: ${{ steps.scan.outputs.found }}
          SCAN_DETAIL: ${{ steps.scan.outputs.detail }}
        run: |
          set -euo pipefail
          gh label create deploy-failure -R "$GITHUB_REPOSITORY" \
            --color B60205 --description "Deploy tier is red and needs a fix commit" 2>/dev/null || true

          TITLE="Workflow startup failure on main — deploys are silently no-op'ing"
          {
            echo "A workflow on \`main\` is failing to **compile**, so it never runs any jobs."
            echo
            echo "This shape does not trigger \`deploy-autoheal.yml\` (it matches on the \`name:\` GitHub could not parse), so nothing else will report it."
            echo
            if [ "$COMPILE_BROKEN" = "true" ]; then
              echo "### actionlint on \`main\` (fatal expression errors)"
              echo '```'
              printf '%s\n' "$COMPILE_DETAIL"
              echo '```'
              echo
            fi
            if [ "$SCAN_FOUND" = "true" ]; then
              echo "### Workflows on \`main\` whose latest run produced zero jobs (first seen, last 24h)"
              printf '%s\n' "$SCAN_DETAIL"
              echo
            fi
            echo "Most common cause: a literal Actions expression token written inside a \`run:\` block — including inside a \`#\` shell comment, which Actions still interpolates. An empty one fails the whole file to parse."
            echo
            echo "@claude please diagnose and land the fix on \`main\`."
            echo
            echo "_Filed by [Workflow Startup Watchdog](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > body.md

          EXISTING="$(gh issue list -R "$GITHUB_REPOSITORY" --label deploy-failure --state open --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | first | .number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Refreshing existing issue #${EXISTING}."
            gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --label deploy-failure \
              --body-file body.md
          fi

      - name: Close the watchdog's own issue once main compiles again
        if: ${{ steps.compile.outputs.broken == 'false' && steps.scan.outputs.found == 'false' }}
        run: |
          set -euo pipefail
          TITLE="Workflow startup failure on main — deploys are silently no-op'ing"
          NUMS="$(gh issue list -R "$GITHUB_REPOSITORY" --label deploy-failure --state open --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number')"
          if [ -z "$NUMS" ]; then
            echo "Nothing to close — main is healthy and no watchdog issue is open."
            exit 0
          fi
          for n in $NUMS; do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" \
              --comment "main's workflows compile again and no startup failures were seen in the last 24h — closing automatically."
          done

      # Approval-stall escalation is a SEPARATE issue under its own fixed title, kept independent of
      # the startup-failure issue above so the "main compiles again" close cannot silence a stall
      # that is still blocking the deploy queue (and vice versa).
      - name: Escalate — open or refresh an approval-stall issue
        if: ${{ steps.stall.outputs.found == 'true' }}
        env:
          STALL_DETAIL: ${{ steps.stall.outputs.detail }}
          STALL_THRESHOLD_HOURS: ${{ vars.APPROVAL_STALL_THRESHOLD_HOURS || '4' }}
        run: |
          set -euo pipefail
          gh label create deploy-failure -R "$GITHUB_REPOSITORY" \
            --color B60205 --description "Deploy tier is red and needs a fix commit" 2>/dev/null || true

          TITLE="Deploy stalled at approval gate — a release is waiting on a human click"
          {
            echo "A deploy run has been **waiting for a required reviewer** on the \`production\` environment for over ${STALL_THRESHOLD_HOURS}h."
            echo
            echo "This is not a red run — it emits no failure event, so \`deploy-autoheal.yml\` never sees it. And because \`release.yml\` and \`rollback.yml\` serialize on the \`release-cloud-run\` concurrency group, a run parked at the gate blocks every release queued behind it. Merges to \`main\` keep landing while nothing actually ships."
            echo
            echo "### Runs waiting on approval"
            printf '%s\n' "$STALL_DETAIL"
            echo
            echo "**To unblock:** open the run above and click **Review deployments → Approve and deploy** (or, if the gate is no longer wanted, remove the required reviewer under Settings → Environments → production). The staging gate, no-traffic canary, health-gated promotion, and auto-rollback all still run regardless."
            echo
            echo "_Filed by [Workflow Startup Watchdog](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > stall_body.md

          EXISTING="$(gh issue list -R "$GITHUB_REPOSITORY" --label deploy-failure --state open --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | first | .number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Refreshing existing approval-stall issue #${EXISTING}."
            gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" --body-file stall_body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --label deploy-failure \
              --body-file stall_body.md
          fi

      - name: Close the approval-stall issue once nothing is waiting
        if: ${{ steps.stall.outputs.found == 'false' }}
        run: |
          set -euo pipefail
          TITLE="Deploy stalled at approval gate — a release is waiting on a human click"
          NUMS="$(gh issue list -R "$GITHUB_REPOSITORY" --label deploy-failure --state open --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number')"
          [ -n "$NUMS" ] || { echo "No open approval-stall issue to close."; exit 0; }
          for n in $NUMS; do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" \
              --comment "No deploy run is waiting at an approval gate anymore — the release queue is moving again. Closing automatically."
          done
