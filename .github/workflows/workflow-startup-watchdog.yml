name: Workflow Startup Watchdog

# Catches the one deploy failure mode NOTHING else in this repo can see (KB-CI-EXPR-EMPTY).
#
# When a workflow file is structurally valid YAML but contains an invalid Actions EXPRESSION, the
# run does not fail a job — it fails to COMPILE. GitHub records a run that completed in the same
# second with ZERO jobs, titled by file path because the `name:` was never parsed. That shape is
# invisible to every existing guard:
#
#   * CI is a different workflow, so it stays green and the merge looks clean.
#   * deploy-autoheal.yml cannot fire: `workflow_run.workflows` matches on the `name:` GitHub
#     failed to read, so no event is ever routed to it — no retry, no escalation issue.
#   * the PR-health watchdog looks at PRs, not at main's deploy tier.
#
# That combination silently no-op'd release.yml (prod) and deploy-staging.yml on every push to main
# for two days: five red runs, zero notifications, and a `main` that looked green.
#
# ci.yml's `actionlint · workflow syntax` job is the PREVENTION (it blocks the bad file at PR time).
# This is the DETECTION backstop for whatever gets past it — a direct push to main, a merge that
# bypassed the check, or a startup failure with a cause actionlint cannot model (e.g. a reusable
# workflow whose target ref was deleted after merge).
#
# Two independent checks, because each covers the other's blind spot:
#   A. Compile main's workflows directly. Deterministic, and it fires even during a quiet period —
#      a broken workflow that nobody pushes to produces no runs and therefore no run-based signal.
#   B. Scan main's recent runs for `startup_failure`. Catches causes that live in GitHub's
#      evaluation of the file rather than in the file's own syntax.
#
# Escalates onto the same `deploy-failure` label the autoheal uses, so all deploy breakage lands in
# one queue. Titles are keyed to this watchdog and never contain a deploy workflow's `name:`, so the
# autoheal's title-substring matching cannot mistake these for its own issues (or auto-close them
# on an unrelated green deploy) — this workflow opens and closes its own.

on:
  schedule:
    - cron: "20 * * * *" # hourly, off the top of the hour and clear of the routine-boundary hours
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-startup-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: compile main · scan for startup failures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # list workflow runs
      issues: write # escalation issue
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # always audit main, never the scheduled run's own stale ref

      # --- Check A: do main's workflows actually compile? -------------------------------------
      - name: Compile every workflow on main (actionlint)
        id: compile
        run: |
          set -euo pipefail
          VER=1.7.7
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VER}"
          curl -sSfL -o "actionlint_${VER}_linux_amd64.tar.gz" "${BASE}/actionlint_${VER}_linux_amd64.tar.gz"
          curl -sSfL -o actionlint_checksums.txt "${BASE}/actionlint_${VER}_checksums.txt"
          grep " actionlint_${VER}_linux_amd64.tar.gz\$" actionlint_checksums.txt | sha256sum -c -
          tar -xzf "actionlint_${VER}_linux_amd64.tar.gz" actionlint
          chmod +x actionlint
          # Only the [expression] rule can cause a startup failure; other findings are style and must
          # not page anyone at 03:20. `|| true` keeps a non-zero lint exit from aborting the step
          # before we can classify it.
          ./actionlint -no-color -oneline -shellcheck= -pyflakes= > lint.txt 2>&1 || true
          grep -F '[expression]' lint.txt > fatal.txt || true
          if [ -s fatal.txt ]; then
            echo "::error::main has workflow files that will not compile — deploys are silently no-op'ing."
            cat fatal.txt
            { echo "broken=true"; echo "detail<<EOF"; cat fatal.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "All workflows on main compile."
            echo "broken=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Check B: did anything on main actually fail to start in the last 24h? ----------------
      - name: Scan main's recent runs for startup failures
        id: scan
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '24 hours ago' +%s)"
          # Do NOT filter on conclusion == `startup_failure`. The incident this workflow exists for
          # was reported by the API as a plain `failure` on all ten runs; the only reliable signal was
          # that the run produced ZERO jobs (and completed in the same second it was created). So take
          # every red run in the window and classify it by job count, which is exact.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "startup_failure" or .conclusion == "failure") | "\(.created_at)\t\(.id)\t\(.conclusion)\t\(.name)\t\(.html_url)"' \
            > raw.txt || true
          : > recent.txt
          CHECKED=0
          while IFS=$'\t' read -r created id conclusion name url; do
            [ -n "${created:-}" ] || continue
            TS="$(date -u -d "$created" +%s)"
            [ "$TS" -ge "$CUTOFF" ] || continue
            # Bound the per-run job lookups so a burst of ordinary red runs cannot turn one watchdog
            # tick into a hundred API calls.
            CHECKED=$((CHECKED + 1))
            if [ "$CHECKED" -gt 20 ]; then
              echo "Reached the 20-run classification cap; stopping the scan here."
              break
            fi
            if [ "$conclusion" != "startup_failure" ]; then
              JOBS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=1" --jq '.total_count' 2>/dev/null || echo "unknown")"
              # A normal red run has >=1 job and is the autoheal's business, not ours. Only zero jobs
              # means the workflow never started. `unknown` (API hiccup) is skipped rather than
              # escalated — a false page every hour would train everyone to ignore this issue.
              [ "$JOBS" = "0" ] || continue
            fi
            printf '%s\t%s\t%s\n' "$created" "$name" "$url" >> recent.txt
          done < raw.txt
          if [ -s recent.txt ]; then
            echo "Startup failures on main in the last 24h:"
            cat recent.txt
            { echo "found=true"; echo "detail<<EOF"; sed 's/^/- /' recent.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "No startup failures on main in the last 24h."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Escalate — open or refresh a deploy-failure issue
        if: ${{ steps.compile.outputs.broken == 'true' || steps.scan.outputs.found == 'true' }}
        env:
          COMPILE_BROKEN: ${{ steps.compile.outputs.broken }}
          COMPILE_DETAIL: ${{ steps.compile.outputs.detail }}
          SCAN_FOUND: ${{ steps.scan.outputs.found }}
          SCAN_DETAIL: ${{ steps.scan.outputs.detail }}
        run: |
          set -euo pipefail
          gh label create deploy-failure -R "$GITHUB_REPOSITORY" \
            --color B60205 --description "Deploy tier is red and needs a fix commit" 2>/dev/null || true

          TITLE="Workflow startup failure on main — deploys are silently no-op'ing"
          {
            echo "A workflow on \`main\` is failing to **compile**, so it never runs any jobs."
            echo
            echo "This shape does not trigger \`deploy-autoheal.yml\` (it matches on the \`name:\` GitHub could not parse), so nothing else will report it."
            echo
            if [ "$COMPILE_BROKEN" = "true" ]; then
              echo "### actionlint on \`main\` (fatal expression errors)"
              echo '```'
              printf '%s\n' "$COMPILE_DETAIL"
              echo '```'
              echo
            fi
            if [ "$SCAN_FOUND" = "true" ]; then
              echo "### Runs on \`main\` with conclusion \`startup_failure\` (last 24h)"
              printf '%s\n' "$SCAN_DETAIL"
              echo
            fi
            echo "Most common cause: a literal Actions expression token written inside a \`run:\` block — including inside a \`#\` shell comment, which Actions still interpolates. An empty one fails the whole file to parse."
            echo
            echo "@claude please diagnose and land the fix on \`main\`."
            echo
            echo "_Filed by [Workflow Startup Watchdog](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > body.md

          EXISTING="$(gh issue list -R "$GITHUB_REPOSITORY" --label deploy-failure --state open --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | first | .number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Refreshing existing issue #${EXISTING}."
            gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --label deploy-failure \
              --body-file body.md
          fi

      - name: Close the watchdog's own issue once main compiles again
        if: ${{ steps.compile.outputs.broken == 'false' && steps.scan.outputs.found == 'false' }}
        run: |
          set -euo pipefail
          TITLE="Workflow startup failure on main — deploys are silently no-op'ing"
          NUMS="$(gh issue list -R "$GITHUB_REPOSITORY" --label deploy-failure --state open --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number')"
          if [ -z "$NUMS" ]; then
            echo "Nothing to close — main is healthy and no watchdog issue is open."
            exit 0
          fi
          for n in $NUMS; do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" \
              --comment "main's workflows compile again and no startup failures were seen in the last 24h — closing automatically."
          done
