name: Deploy website (Cloudflare)

# Publishes lyniago.com, the marketing site in apps/website (docs/WEBSITE.md), to Cloudflare Workers:
# an ASSETS-ONLY Worker on the lyniago.com Custom Domain, then a one-line redirect Worker on
# www.lyniago.com. Cloudflare creates both DNS records and edge certificates itself, so there is no
# DNS or certificate step. The site is the design handoff shipped as-is: the job re-runs
# scripts/check-website.mjs before deploying and apps/website/smoke.sh after it.
#
# TRIGGERS: a push to main that touches the site, and workflow_dispatch (re-deploy / first deploy).
#
# DORMANT UNTIL ARMED: skipped until the Variable CLOUDFLARE_ACCOUNT_ID is set. The token is the
# secret CLOUDFLARE_WORKERS_API_TOKEN (Cloudflare "Edit Cloudflare Workers" template, scoped to the
# account and the lyniago.com zone). It is deliberately NOT CLOUDFLARE_API_TOKEN, the DNS-only token
# dns-bind-azure.yml uses. Runs in the `production` environment, whose branch policy is main-only.
# The repo's Actions logs are public: nothing here prints the token (wrangler never does).
# Never write `${{ }}` inside a run: block in this file.

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "scripts/check-website.mjs"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: check · deploy · smoke (lyniago.com)
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      WRANGLER: wrangler@4.143.0
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Guard — main only, token present
        env:
          REF: ${{ github.ref }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::The website deploys from main only (got ${REF})."; exit 1; }
          [ -n "$CF_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_WORKERS_API_TOKEN is not set (docs/WEBSITE.md § One-time setup)."; exit 1; }

      - name: Site matches the design handoff
        run: node scripts/check-website.mjs

      - name: Deploy lyniago.com (static assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: npx --yes "$WRANGLER" deploy --config apps/website/wrangler.jsonc

      - name: Deploy www.lyniago.com → lyniago.com redirect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: npx --yes "$WRANGLER" deploy --config apps/website/www-redirect/wrangler.jsonc

      - name: Smoke — what a visitor gets
        run: bash apps/website/smoke.sh https://lyniago.com

      - name: Summary
        if: ${{ success() }}
        run: echo "lyniago.com deployed from ${GITHUB_SHA::7} and passed the smoke checks." >> "$GITHUB_STEP_SUMMARY"
