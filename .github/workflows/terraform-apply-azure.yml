name: Terraform Apply (Azure, gated)

# Runs infra/azure `terraform plan` / `apply` from CI behind the `infra` environment's human approval
# (docs/plans/2026-09-24-gcp-to-azure-migration.md §6, E14, S5; replaces terraform-apply.yml). It keeps
# the controls terraform-apply.yml earned in its adversarial review:
#
#  1. NO `${{ }}` INSIDE ANY run: BLOCK. Inputs arrive via env: and are whitelist-validated.
#  2. THE PLAN IS NEVER PERSISTED. A binary plan embeds the prior state unredacted, so it is never
#     uploaded; the apply job re-plans inside the gate and applies in the same workspace. The
#     approval binds INTENT; the destroy guard therefore re-runs inside the gated job.
#  3. main-ONLY. The binding controls are the `infra` environment's deployment-branch policy (main)
#     and its required reviewers; the ref checks below are defence in depth.
#  4. DESTROY GUARD. A plan that deletes or forgets anything fails unless action=apply-allow-destroy.
#
# IDENTITY — `environment: infra` ONLY. Both jobs run in the `infra` environment and authenticate as
# AZURE_CLIENT_ID_INFRA, whose federated credential is `repo:unnfazzed/Lynia:environment:infra` and
# nothing else (E14). So the reviewer approves twice: once to let the read-only plan run (its summary
# is the review), and again for the apply job after reading it. With action=plan only the first.
# Configure the `infra` environment BEFORE setting AZURE_CLIENT_ID_INFRA: required reviewers = the
# owner (approvable from the GitHub mobile app) and deployment branches = main only. GitHub auto-creates
# a referenced-but-missing environment with NO protection, and no in-workflow check can detect that.
#
# Inputs (X6): `environment` (which state: staging | production, default staging) + `action`.
# State: <AZURE_TFSTATE_ACCOUNT>/<container>/lynia-<env>.tfstate (scripts/azure-tf-init.sh).
# DORMANT UNTIL ARMED: both jobs are no-ops until AZURE_CLIENT_ID_INFRA and AZURE_TFSTATE_ACCOUNT exist.
# S1: secret material is generated outside Terraform; outputs are printed without -raw/-json, so a
# sensitive output shows as <sensitive>.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment's Terraform state to plan/apply"
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: "plan = review only; apply = plan then apply (second approval); apply-allow-destroy = also permit deletions"
        type: choice
        options: [plan, apply, apply-allow-destroy]
        default: plan

concurrency:
  group: terraform-apply-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: plan (${{ inputs.environment }}, read-only)
    if: ${{ vars.AZURE_CLIENT_ID_INFRA != '' && vars.AZURE_TFSTATE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    environment: infra
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    env:
      TIER: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_INFRA }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TFSTATE_RG: ${{ vars.AZURE_TFSTATE_RG }}
      AZURE_TFSTATE_ACCOUNT: ${{ vars.AZURE_TFSTATE_ACCOUNT }}
      AZURE_TFSTATE_CONTAINER: ${{ vars.AZURE_TFSTATE_CONTAINER }}
    steps:
      - uses: actions/checkout@v7

      - name: Guard — main only, validated inputs
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::terraform-apply-azure may only run from main (got ${REF})."; exit 1; }
          case "$TIER" in staging|production) ;; *) echo "::error::invalid environment"; exit 1 ;; esac
          case "$ACTION" in plan|apply|apply-allow-destroy) ;; *) echo "::error::invalid action"; exit 1 ;; esac

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform plan
        id: plan
        run: |
          set -euo pipefail
          bash scripts/azure-tf-init.sh "$TIER"
          cd infra/azure
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan failed"; cat plan.txt; exit 1
          fi
          terraform show -json tfplan > plan.json
          destroys=$(jq '[.resource_changes[]? | select(.change.actions[]? | IN("delete","forget"))] | length' plan.json)
          if [ "$destroys" -gt 0 ] && [ "$ACTION" != "apply-allow-destroy" ]; then
            echo "::warning title=PLAN DELETES RESOURCES::${destroys} resource(s) would be deleted/forgotten — an apply needs action=apply-allow-destroy."
          fi
          {
            echo "### Terraform plan — ${TIER} (${destroys} deletion(s)/forget(s)), action=${ACTION}"
            if [ "$destroys" -gt 0 ]; then
              echo '**Resources being REMOVED:**'
              echo '```'
              jq -r '.resource_changes[]? | select(.change.actions[]? | IN("delete","forget")) | "  REMOVE " + .address' plan.json
              echo '```'
            fi
            echo '```'
            # head, not tail: the change list comes first; on an oversized plan lose the tail.
            terraform show -no-color tfplan | head -c 60000
            echo ''
            echo '[output truncated at 60000 bytes if the plan was larger]'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f tfplan plan.json # the binary plan embeds unredacted state — it dies with this runner

  apply:
    name: apply (${{ inputs.environment }}, requires approval)
    needs: plan
    # exitcode 2 = changes pending; 0 = nothing to apply, so don't wake a human for nothing.
    if: ${{ startsWith(inputs.action, 'apply') && needs.plan.outputs.exitcode == '2' }}
    runs-on: ubuntu-latest
    environment: infra
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      TIER: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_INFRA }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TFSTATE_RG: ${{ vars.AZURE_TFSTATE_RG }}
      AZURE_TFSTATE_ACCOUNT: ${{ vars.AZURE_TFSTATE_ACCOUNT }}
      AZURE_TFSTATE_CONTAINER: ${{ vars.AZURE_TFSTATE_CONTAINER }}
    steps:
      - uses: actions/checkout@v7

      - name: Guard — main only
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::apply may only run from main (got ${REF})."; exit 1; }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform plan + apply (inside the gate)
        run: |
          set -euo pipefail
          bash scripts/azure-tf-init.sh "$TIER"
          cd infra/azure
          terraform plan -input=false -no-color -out=tfplan
          terraform show -json tfplan > plan.json
          destroys=$(jq '[.resource_changes[]? | select(.change.actions[]? | IN("delete","forget"))] | length' plan.json)
          if [ "$destroys" -gt 0 ] && [ "$ACTION" != "apply-allow-destroy" ]; then
            echo "::error::plan deletes/forgets ${destroys} resource(s) (state may have moved since review); re-run with action=apply-allow-destroy if intended."
            jq -r '.resource_changes[]? | select(.change.actions[]? | IN("delete","forget")) | "  REMOVE " + .address' plan.json
            exit 1
          fi
          rm -f plan.json
          terraform apply -input=false -no-color tfplan

      - name: Summarise post-apply outputs (non-sensitive only)
        run: |
          set -euo pipefail
          cd infra/azure
          {
            echo "### Applied (${TIER}). Non-sensitive outputs"
            echo '```'
            terraform output -no-color || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
