name: Mobile Release (Play)

# Production Android release via EAS Build + Submit (docs/LAUNCH-DEPLOYMENT-STRATEGY.md §1b).
# Builds a signed .aab on EAS servers and (by default) auto-submits it to Google Play as a
# STAGED rollout (production track, releaseStatus=inProgress, starts at the rollout fraction in
# apps/mobile/eas.json — advance/halt in Play Console as crash-free metrics hold).
#
# DORMANT UNTIL EAS IS PROVISIONED — gated on the repo variable EAS_RELEASE_ENABLED == 'true'.
# Arming (founder, one-time; see docs/LAUNCH-EXECUTION-RUNBOOK.md §8):
#   1. Create the EAS project (`eas init` in apps/mobile) and commit the project id.
#   2. Upload the Play service-account key to EAS (`eas credentials`) and let EAS manage the
#      upload keystore; enrol the app in Play App Signing. No key files in this repo or CI.
#   3. Set repo secret EXPO_TOKEN, repo variables EAS_PROJECT_ID + EAS_RELEASE_ENABLED=true.
#   4. Add build-time secrets as EAS secrets (GOOGLE_MAPS_API_KEY, GOOGLE_SERVICES_JSON file).
#
# versionCode is EAS-managed (autoIncrement + appVersionSource=remote in eas.json) — monotonic,
# no human bookkeeping. `version` (versionName) in app.config.ts is bumped per release; tag the
# release commit v<version> to trigger this workflow.
#
# TAG TRIGGER IS SEPARATELY GATED (EAS_TAG_RELEASES_ENABLED, added 2026-08-03). A tag push runs
# with NO inputs, so it defaults to profile `production` + auto-submit — and release-please mints
# a `v*` tag roughly daily. Today those bot tags don't fire workflows (GITHUB_TOKEN events never
# trigger other workflows), but that protection is accidental: hand-pushed tags DO fire, and the
# standard fix for release-please's CI-trigger gap (a PAT) would make every release tag burn an
# EAS build on a production submit. Until the production release train is deliberately armed
# (docs/PLAY-STORE-SUBMISSION.md §8 step 3), tag pushes skip unless
# EAS_TAG_RELEASES_ENABLED == 'true'. Manual dispatch is unaffected — it only needs
# EAS_RELEASE_ENABLED.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options: [production, preview]
        default: production
      submit:
        description: "Auto-submit to Play after the build"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  build:
    name: eas build (+ staged submit)
    runs-on: ubuntu-latest
    if: ${{ vars.EAS_RELEASE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || vars.EAS_TAG_RELEASES_ENABLED == 'true') }}
    environment: production-mobile
    env:
      # app.config.ts reads this to attach updates.url + extra.eas.projectId (attached only when
      # present, so unprovisioned/test builds still succeed with updates disabled).
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # eas-cli evaluates app.config.ts locally before uploading, so workspace deps must exist.
      # The build itself (install → prebuild → gradle) runs on EAS servers; the
      # eas-build-post-install hook in apps/mobile/package.json builds @lynia/shared there.
      #
      # STRICT frozen install — deliberately diverging from the repo's --frozen-lockfile=false
      # convention. The CLI computes the expo-updates `fingerprint` runtimeVersion from THIS
      # runner's node_modules, and the EAS builder recomputes it from its own frozen install; any
      # resolution drift between the two (e.g. a dep patch release between lockfile commit and
      # dispatch) fails the build with "Runtime version mismatch" in CONFIGURE_EXPO_UPDATES —
      # exactly how build 5906d2f0 died (2026-08-03, @babel 7.29.7 vs 7.29.8). Frozen on both
      # sides = identical trees = identical fingerprints.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (and submit) via EAS
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          PROFILE="${{ inputs.profile || 'production' }}"
          SUBMIT_FLAG="--auto-submit"
          if [ "${{ inputs.submit }}" = "false" ]; then
            SUBMIT_FLAG=""
          fi
          # --no-wait: the build/submit continues on EAS servers; progress + the staged-rollout
          # controls live in the Expo/Play consoles, not this runner.
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait $SUBMIT_FLAG
          echo "EAS build queued (profile: $PROFILE, auto-submit: ${SUBMIT_FLAG:-off})." >> "$GITHUB_STEP_SUMMARY"

      # Best-effort release-candidate size visibility (DoorDash app-size discipline, docs/APP-SIZE.md).
      # The build above runs with --no-wait, so the .aab is usually STILL building on EAS servers here;
      # when a recently-finished Android build IS available, this records its raw .aab byte size to the
      # run summary. NEVER breaks a release — continue-on-error plus internal guards degrade every
      # failure mode to a note.
      #
      # We deliberately DO NOT download bundletool to compute Play's exact per-device delivery size:
      # that would mean pulling an unpinned third-party jar into a release job. We report the raw .aab
      # size and note that Play's actual per-device DOWNLOAD is smaller — an App Bundle is split per
      # device ABI / screen density / language at install time (the precise number is in Play Console).
      - name: Measure AAB size (best-effort)
        continue-on-error: true
        working-directory: apps/mobile
        run: |
          set -uo pipefail
          echo "## 📦 Release artifact size (.aab)" >> "$GITHUB_STEP_SUMMARY"
          # Newest Android build for this project (auth comes from the EAS CLI set up above). --json
          # requires --non-interactive. With --no-wait the current build may have no artifact yet.
          BUILDS_JSON="$(eas build:list --json --non-interactive --platform android --limit 1 2>/dev/null || true)"
          URL="$(printf '%s' "$BUILDS_JSON" | jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' 2>/dev/null || true)"
          if [ -z "${URL:-}" ]; then
            echo "_Latest Android build has no downloadable artifact yet (the build was queued with \`--no-wait\` and is likely still running). The .aab size will be visible on the EAS build page and in the Play Console._" >> "$GITHUB_STEP_SUMMARY"
            echo "AAB size: artifact not available yet (build still in progress) — non-fatal."
            exit 0
          fi
          AAB="$RUNNER_TEMP/release.aab"
          if ! curl -fsSL "$URL" -o "$AAB"; then
            echo "_Could not download the build artifact to measure it (non-fatal)._" >> "$GITHUB_STEP_SUMMARY"
            echo "AAB size: download failed — non-fatal."
            exit 0
          fi
          BYTES=$(stat -c %s "$AAB")
          human() { awk -v b="$1" 'BEGIN { split("B KiB MiB GiB", u); i = 1; while (b >= 1024 && i < 4) { b /= 1024; i++ } printf (i == 1 ? "%d %s" : "%.2f %s"), b, u[i] }'; }
          echo "Release AAB (pre-split) size: $(human "$BYTES") ($BYTES bytes)"
          {
            echo ""
            echo "| Artifact | Raw .aab size |"
            echo "|---|---:|"
            echo "| Release AAB (before Play split) | $(human "$BYTES") ($BYTES bytes) |"
            echo ""
            echo "> Play delivers a **smaller** per-device download than the raw .aab: the App Bundle is split by device ABI, screen density and language at install time. The precise per-device download size is in the Play Console (\"App bundle explorer\")."
          } >> "$GITHUB_STEP_SUMMARY"
