name: Maps Key Doctor

# Read-only diagnosis for MOB-MAP-02 — "why is the Android map blank on the installed build?"
#
# WHY A WORKFLOW AND NOT A DOC. Every verification step written for MOB-MAP-02 so far ends in
# `adb logcat | grep "Google Maps Android API"` — a USB cable and a terminal. The owner of this repo
# codes from a phone, so the one person holding the broken handset has never been able to run the check,
# which is why the cause has stayed a ranked list of candidates since 2026-08-16 rather than a fact.
# `workflow_dispatch` is triggerable from the GitHub mobile app, and the job log is readable there.
#
# WHICH KEY IT PROBES — this matters, and the first version of this workflow got it wrong.
# There are TWO independent stores holding a variable called GOOGLE_MAPS_API_KEY:
#   * the EAS environment variable — what `mobile-release.yml` builds the Play binary with. THIS is the
#     key MOB-MAP-02 is about, and it is the default here (`key_source: eas`).
#   * the GitHub Actions secret — used only by `android-test-apk.yml` for sideloaded QA APKs.
# They can hold different values, and on this workflow's first run they demonstrably did: the GitHub
# secret came back INVALID_KEY while the Play-installed app had rendered tiles as recently as
# 2026-08-05. Probing the GitHub secret answers a real question (is the QA-APK lane armed?) but not the
# one the blank map poses. `key_source: github` keeps that check available on purpose.
#
# Deliberately NOT environment-gated (same reasoning as eas-build-status.yml): a read-only check must
# not cost an approval click per look. It mutates nothing — no GCP write, no EAS write, no build.
#
# It also probes the Places key (EXPO_PUBLIC_GOOGLE_PLACES_KEY — address search) with the app's own
# Places API (New) request for "westgate", so a new key can be proven from a phone before an OTA or a
# build carries it. Same two stores, same `key_source` switch: `eas` is what builds inline, `github` is
# the secret mobile-ota.yml exports OTA bundles with.
#
# No key ever leaves the runner: EAS values are held only in the probe process's memory (see the
# Diagnose step), and the probe script never prints a key or any value derived from one.

on:
  workflow_dispatch:
    inputs:
      sha1:
        # Leave it empty: the doctor then tests every certificate Play signs zw.co.lynia with
        # (scripts/play-signing-certs.mjs). There are three, because the app uses Play's hybrid signing,
        # and allowlisting only one of them blanked the map on every phone on Android 16 or older until
        # 2026-10-06 (MOB-MAP-04). Fill it in only to test something else, e.g. the upload certificate.
        description: "Leave empty to test all three Play signing certificates. Or list SHA-1s to test instead, comma-separated, colons optional."
        type: string
        default: ""
      key_source:
        description: "Which key store to probe: 'eas' (what builds inline — the default) or 'github' (the Actions secrets: the QA-APK lane's Maps key, the OTA lane's Places key)"
        type: choice
        options:
          - eas
          - github
        default: eas
      eas_environment:
        description: "EAS environment to read the key from (only when key_source is 'eas')"
        type: choice
        options:
          - preview
          - production
          - development
        default: preview
      package:
        description: "Android application id to test the fingerprint against"
        type: string
        default: "zw.co.lynia"

permissions:
  contents: read

jobs:
  doctor:
    name: probe the Maps key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # ONE step, on purpose. An earlier version resolved the EAS key in a separate step and handed it
      # on through `$GITHUB_ENV`. CodeQL flagged that (js/http-to-file-access) and was right to:
      # `$GITHUB_ENV` is parsed as `KEY=VALUE` lines, so a value carrying a newline injects arbitrary
      # environment variables into every later step. The key now stays in the probe process's memory and
      # never touches the disk, which removes the whole class rather than sanitising around it.
      #
      # No install step either: both scripts use only Node's built-in fetch, so this stays a ~20s check
      # that cannot be broken by a lockfile or a workspace build.
      - name: Diagnose
        env:
          KEY_SOURCE: ${{ inputs.key_source }}
          # Read only when key_source is 'eas'.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_APP_ID: ${{ vars.EAS_PROJECT_ID }}
          EAS_ENVIRONMENT: ${{ inputs.eas_environment }}
          # Read only when key_source is 'github' — android-test-apk.yml's key, not the build's.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Read only when key_source is 'github' — mobile-ota.yml's copy of the Places key.
          EXPO_PUBLIC_GOOGLE_PLACES_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_KEY }}
          ANDROID_CERT_SHA1: ${{ inputs.sha1 }}
          ANDROID_PACKAGE: ${{ inputs.package }}
        run: node scripts/maps-key-doctor.mjs
