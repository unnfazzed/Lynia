name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimize the default GITHUB_TOKEN scope for every job (was the broad repo default).
permissions:
  contents: read

jobs:
  security:
    name: dependency audit · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history for committed secrets
      # SCA gate: scans pnpm-lock.yaml directly against the OSV.dev vulnerability database.
      # Replaces `pnpm audit`, whose upstream endpoints npmjs.org retired (KB-CI-AUDIT-410 — both
      # the quick and bulk audit endpoints return HTTP 410 as of 2026-07-15); osv-scanner queries
      # osv.dev directly and has no dependency on that retired endpoint. The binary is checked
      # against its published SHA256SUMS before being executed.
      #
      # osv-scanner v2 restructured the CLI: the source scan is `scan source --lockfile=…`, and
      # `--min-severity` moved off `scan` onto the `fix` command (so the old `scan … --min-severity`
      # invocation aborted with "flag provided but not defined"). To keep the old
      # `pnpm audit --audit-level high` gate (CVSS 7.0+ = the High/Critical band) we emit the JSON
      # report and gate on each advisory group's `max_severity` ourselves. Fails CLOSED: a malformed
      # report (scan didn't run) is treated as a failure, never a silent pass.
      - name: Dependency vulnerability scan (osv-scanner, high+)
        run: |
          set -euo pipefail
          VER=2.4.0
          BASE="https://github.com/google/osv-scanner/releases/download/v${VER}"
          curl -sSfL -o osv-scanner_linux_amd64 "${BASE}/osv-scanner_linux_amd64"
          curl -sSfL -o osv-scanner_SHA256SUMS "${BASE}/osv-scanner_SHA256SUMS"
          grep " osv-scanner_linux_amd64\$" osv-scanner_SHA256SUMS | sha256sum -c -
          mv osv-scanner_linux_amd64 osv-scanner
          chmod +x osv-scanner
          # osv-scanner exits non-zero when it finds ANY vulnerability, so `|| true` lets us inspect
          # severities instead of aborting on a low-severity hit we intend to ignore.
          ./osv-scanner scan source --lockfile=pnpm-lock.yaml --format=json --output=osv-results.json || true
          # A well-formed report always carries a `.results` array; its absence means the scan itself
          # failed — fail closed rather than treat a broken run as "no vulnerabilities".
          jq -e 'has("results")' osv-results.json >/dev/null || { echo "::error::osv-scanner produced no valid JSON report"; cat osv-results.json || true; exit 1; }
          HIGH=$(jq '[.results[]?.packages[]?.groups[]?.max_severity | select(. != null and . != "") | tonumber | select(. >= 7)] | length' osv-results.json)
          if [ "${HIGH:-0}" -gt 0 ]; then
            echo "::error::osv-scanner found ${HIGH} High/Critical (CVSS>=7) advisory group(s) in pnpm-lock.yaml"
            ./osv-scanner scan source --lockfile=pnpm-lock.yaml || true
            exit 1
          fi
          echo "osv-scanner: no High/Critical (CVSS>=7) vulnerabilities in pnpm-lock.yaml."
      # Secret scanning: catch a credential committed to source or history. Uses the free gitleaks
      # binary directly (no Action-license requirement on private repos).
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  build:
    name: typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @lynia/shared build
      - run: pnpm --filter @lynia/api prisma:generate
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Import-boundary + cycle enforcement (roadmap 3.2). Baselined: fails only on a NEW circular
      # import or a NEW mobile ui→api coupling, never on the pre-existing knots being worked down.
      - run: pnpm run depcruise
      - run: pnpm run build
      - run: pnpm --filter @lynia/api test
      - run: pnpm --filter @lynia/mobile test
      # Admin typecheck/lint/build already run above via `turbo run …`; its tests do not (turbo run
      # test has no admin task wired and the two lines above are per-filter). Gate the console-auth /
      # IAP-JWT fail-closed specs explicitly — they are the security boundary for the deployed console.
      - run: pnpm --filter @lynia/admin test

  schema:
    name: prisma migrate · constraint proof (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: lynia
          POSTGRES_PASSWORD: lynia
          POSTGRES_DB: lynia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lynia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lynia:lynia@localhost:5432/lynia?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @lynia/shared build # int specs import shared runtime values (e.g. ACTIVE_RIDE_STATUSES)
      - run: pnpm --filter @lynia/api prisma:generate
      - run: pnpm --filter @lynia/api migrate:deploy
      - name: Assert offer-loop constraints applied (ET2/ET6)
        run: |
          set -euo pipefail
          q() { PGPASSWORD=lynia psql -h localhost -U lynia -d lynia -tAc "$1"; }
          q "SELECT indexname FROM pg_indexes WHERE tablename='orders' AND indexname='one_active_ride';" | grep -qx one_active_ride
          q "SELECT 1 FROM pg_indexes WHERE tablename='riders' AND indexdef ILIKE '%gist%';" | grep -qx 1
          q "SELECT 1 FROM information_schema.columns WHERE table_name='orders' AND column_name='otp_hash';" | grep -qx 1
          echo "✓ one_active_ride, GiST geog index, and otp_hash all present"
      - name: Offer-loop concurrency tests (ET1/ET2/ET3)
        run: pnpm --filter @lynia/api test:int

  # Per-PR JS bundle-size guardrail (docs/APP-SIZE.md). The "prevention" half of the app-size program:
  # the DoorDash discipline that bundle growth must be INTENTIONAL, not accidental — every extra byte is
  # metered mobile data for our users in Zimbabwe (Play download + expo-updates OTA both pay it). It
  # exports the app's JS with Metro/Hermes (no Android SDK — pure JS, like mobile-ota.yml) and fails when
  # the export exceeds apps/mobile/size-budget.json. Report-only until that budget is calibrated (0 = no
  # gate), so turning this on can never redden CI by itself.
  mobile-bundle-size:
    name: mobile js bundle · size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the changed-files guard below can diff against the PR base / previous push.
          # A shallow checkout wouldn't contain that base commit to compare against (the `security` job
          # above already fetches full history for the same class of reason).
          fetch-depth: 0

      # ci.yml runs on every PR and has no per-job path filter (its other jobs must run everywhere), so
      # we gate THIS job in-job: only spend a pnpm install + Metro export when the change can actually
      # move the JS bundle. On unrelated PRs this exits early and the job stays green and fast — no
      # install, no export. Fails SAFE (runs the check) if a base commit can't be resolved.
      - name: Detect mobile-relevant changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "::notice::No base commit to diff against — running the bundle-size check to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          # Paths that can change what Metro bundles: the app itself, the two workspace packages it
          # imports at bundle time, the lockfile (a dep bump can balloon the bundle), and this workflow.
          if printf '%s\n' "$CHANGED" \
             | grep -Eq '^(apps/mobile/|packages/shared/|packages/design/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "::notice::Mobile-relevant paths changed — running the JS bundle-size check."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No mobile-relevant paths changed — skipping the JS bundle-size check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile=false

      # The app imports @lynia/shared at bundle time, so build it before exporting (as mobile-ota.yml does).
      - name: Build shared package
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @lynia/shared build

      # Pure Metro/JS export: compiles the Hermes bytecode bundle with the host `hermesc`, no Android
      # SDK/NDK needed. Output goes to a temp dir outside the working tree.
      - name: Export Android JS bundle (expo export)
        if: steps.changes.outputs.run == 'true'
        working-directory: apps/mobile
        run: pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/expo-export-android"

      # Measure vs apps/mobile/size-budget.json and fail when over budget (report-only while the budget
      # is 0/uncalibrated). Writes a size table to the run summary.
      - name: Check bundle size against budget
        if: steps.changes.outputs.run == 'true'
        working-directory: apps/mobile
        run: node scripts/check-bundle-size.mjs "$RUNNER_TEMP/expo-export-android"
