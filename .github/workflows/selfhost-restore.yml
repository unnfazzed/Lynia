name: Restore Azure export onto the self-hosted server

# Switch-over step 2 of docs/AZURE-EXIT.md: puts the newest "Azure Data Export" (a draft release made by
# azure-db-export.yml) onto the self-hosted server. Everything happens here, in GitHub: the passphrase never
# leaves the repo secrets and the decrypted dump only exists on this runner and the server.
#
#   1. find the newest draft release data-export-*, download it by asset id, decrypt, check the sha256
#      against the manifest;
#   2. on the server: stop api + admin, drop and recreate the database, pg_restore the dump;
#   3. compare the row count of EVERY table on the server with the row count in the dump: any difference
#      fails the run;
#   4. copy the photos into the R2 media bucket (through the cron container, which holds the R2 keys) and
#      count them;
#   5. migrate (a no-op when Azure ran the same main), start everything, wait for a healthy API.
#
# This repo's Actions logs are PUBLIC: nothing here prints row data, values or pg_restore's DETAIL lines,
# only table names, counts and the first line of each restore error.
#
# DESTRUCTIVE for the server's database (that is the point): it replaces whatever is there. It never
# touches Azure. Dispatch-only, and the input must be typed exactly.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPLACE to replace the server database with the newest Azure export'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-selfhost
  cancel-in-progress: false

jobs:
  restore:
    name: restore the export onto the server
    if: ${{ vars.SELFHOST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: write # read draft releases (only people/tokens with push access can see drafts)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOST: ${{ vars.SELFHOST_HOST }}
      USER_: ${{ vars.SELFHOST_USER || 'ubuntu' }}
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "REPLACE" ] || { echo "::error::Type REPLACE in the confirm box to run the restore."; exit 1; }

      - name: Download the newest export
        id: dl
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/x" && cd "$RUNNER_TEMP/x"
          rel="$(gh api "repos/${GH_REPO}/releases?per_page=50" \
            --jq '[.[] | select(.draft and (.tag_name | startswith("data-export-")))] | sort_by(.created_at) | last | "\(.id) \(.tag_name) \(.created_at)"')"
          [ -n "$rel" ] && [ "$rel" != "null null null" ] || { echo "::error::No draft data-export-* release. Run 'Azure Data Export (leaving Azure)' first."; exit 1; }
          read -r rid tag created <<<"$rel"
          echo "Using draft release ${tag} (made ${created})."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GH_REPO}/releases/${rid}/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"' \
            | while read -r aid name; do
                gh api -H "Accept: application/octet-stream" "repos/${GH_REPO}/releases/assets/${aid}" > "$name"
              done
          ls -l
          cat ./*.manifest.txt

      - name: Decrypt and check
        env:
          PASS: ${{ secrets.DB_EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/x"
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:PASS -in lynia-db-*.dump.enc -out db.dump
          want="$(sed -n 's/^  plain sha256 *//p' ./*.manifest.txt)"
          got="$(sha256sum db.dump | cut -d' ' -f1)"
          [ "$want" = "$got" ] || { echo "::error::Decrypted dump checksum $got does not match the manifest ($want)."; exit 1; }
          echo "Database dump decrypted, checksum matches the manifest."
          if ls lynia-media-*.tar.enc.part* >/dev/null 2>&1; then
            cat lynia-media-*.tar.enc.part* | openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:PASS > media.tar
            echo "Media archive decrypted: $(tar -tf media.tar | grep -vc '/$') files."
          else
            echo "::warning::This export has no media archive (see its manifest); photos are not copied."
          fi
          rm -f ./*.enc ./*.enc.part*

          # Row count per table in the dump, from its COPY blocks: the reference the server is checked against.
          docker run --rm -v "$PWD:/d" postgres:16-alpine pg_restore --data-only -f - /d/db.dump \
            | awk '/^COPY /{t=$2; n=0; inb=1; next} inb && /^\\\.$/{print t, n; inb=0; next} inb{n++}' \
            | sed 's/"//g' | sort > expected-counts.txt
          echo "The dump holds data for $(wc -l < expected-counts.txt) tables."

      - name: SSH setup (pinned host key)
        env:
          KEY: ${{ secrets.SELFHOST_SSH_KEY }}
          KNOWN: ${{ vars.SELFHOST_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$HOST" ] || { echo "::error::Set the repo Variable SELFHOST_HOST."; exit 1; }
          [ -n "$KEY" ] || { echo "::error::Set the repo secret SELFHOST_SSH_KEY."; exit 1; }
          [ -n "$KNOWN" ] || { echo "::error::Set the repo Variable SELFHOST_KNOWN_HOSTS (run the deploy first)."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host lynia\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' "$HOST" "$USER_" > ~/.ssh/config
          ssh lynia 'cd ~/lynia && test -f .env && docker compose ps --format "{{.Service}}: {{.Status}}"'

      - name: Replace the database
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/x"
          ssh lynia 'cd ~/lynia && docker compose stop api admin'
          ssh lynia 'cd ~/lynia && docker compose exec -T postgres sh -c '\''dropdb -U "$POSTGRES_USER" --force --if-exists "$POSTGRES_DB" && createdb -U "$POSTGRES_USER" "$POSTGRES_DB"'\'''
          # pg_restore reads the custom-format dump from stdin. It carries on past errors; the row counts
          # below are the real check. Print only the first line of each error (DETAIL lines can hold data).
          set +e
          ssh lynia 'cd ~/lynia && docker compose exec -T postgres sh -c '\''pg_restore --no-owner --no-privileges -U "$POSTGRES_USER" -d "$POSTGRES_DB"'\''' \
            < db.dump > restore.log 2>&1
          rc=$?
          set -e
          errs="$(grep -c '^pg_restore: error:' restore.log || true)"
          echo "pg_restore exit ${rc}, ${errs} error(s)."
          grep '^pg_restore: error:' restore.log | cut -c1-220 | sort | uniq -c | head -30 || true
          rm -f restore.log

      - name: Check every table's row count against the dump
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/x"
          ssh lynia 'cd ~/lynia && docker compose exec -T postgres sh -c '\''psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atq'\''' <<'SQL' | sort > actual-counts.txt
          DO $$ DECLARE r record; n bigint; BEGIN
            CREATE TEMP TABLE _c(t text, n bigint);
            FOR r IN SELECT schemaname, tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') LOOP
              EXECUTE format('SELECT count(*) FROM %I.%I', r.schemaname, r.tablename) INTO n;
              INSERT INTO _c VALUES (r.schemaname || '.' || r.tablename, n);
            END LOOP; END $$;
          SELECT t || ' ' || n FROM _c;
          SQL
          bad=0
          while read -r t n; do
            # PostGIS's spatial_ref_sys is filled by CREATE EXTENSION itself; the dump only carries user rows.
            case "$t" in *.spatial_ref_sys) continue ;; esac
            got="$(awk -v t="$t" '$1==t{print $2}' actual-counts.txt)"
            if [ "${got:-missing}" != "$n" ]; then echo "MISMATCH ${t}: dump ${n}, server ${got:-missing}"; bad=$((bad+1)); fi
          done < expected-counts.txt
          rows="$(awk '{s+=$2} END{print s+0}' expected-counts.txt)"
          {
            echo "### Restore check"
            echo
            echo "$(wc -l < expected-counts.txt) tables, ${rows} rows in the dump; mismatches on the server: ${bad}."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$bad" -eq 0 ] || { echo "::error::${bad} table(s) differ from the dump. Do NOT switch traffic; the server is not ready."; exit 1; }

      - name: Copy the photos into R2
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/x"
          [ -f media.tar ] || { echo "No media archive: skipped."; exit 0; }
          want="$(tar -tf media.tar | grep -vc '/$')"
          # The cron container holds the R2 keys; the bucket name is the server .env's STORAGE_BUCKET.
          bucket="$(ssh lynia "cd ~/lynia && sed -n \"s/^STORAGE_BUCKET=//p\" .env | tr -d \"'\\\"\"")"
          bucket="${bucket:-lynia-media}"
          ssh lynia "cd ~/lynia && docker compose exec -T -e BUCKET='${bucket}' cron sh -c '
            set -eu
            export RCLONE_CONFIG_R2_TYPE=s3 RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
              RCLONE_CONFIG_R2_ACCESS_KEY_ID=\"\$R2_ACCESS_KEY_ID\" RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=\"\$R2_SECRET_ACCESS_KEY\" \
              RCLONE_CONFIG_R2_ENDPOINT=\"https://\${R2_ACCOUNT_ID}.r2.cloudflarestorage.com\" RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
            rm -rf /tmp/media && mkdir -p /tmp/media && tar -xf - -C /tmp/media
            rclone copy /tmp/media \"r2:\${BUCKET}\" --transfers 8 --checkers 16 --stats-log-level NOTICE
            echo \"in R2 now: \$(rclone size \"r2:\${BUCKET}\" --json)\"
            rm -rf /tmp/media
          '" < media.tar
          echo "Photos in the export: ${want}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Migrate and start
        env:
          TAG: ${{ steps.dl.outputs.tag }}
        run: |
          set -euo pipefail
          ssh lynia 'cd ~/lynia && docker compose run --rm migrate && docker compose up -d --remove-orphans'
          for _ in $(seq 1 40); do
            state="$(ssh lynia "docker inspect -f '{{.State.Health.Status}}' \$(cd ~/lynia && docker compose ps -q api)" 2>/dev/null || echo unknown)"
            echo "api: $state"
            if [ "$state" = "healthy" ]; then
              ssh lynia 'cd ~/lynia && docker compose ps --format "table {{.Service}}\t{{.Status}}"' | tee -a "$GITHUB_STEP_SUMMARY"
              echo "Restored ${TAG}. Next: add the tunnel routes (docs/AZURE-EXIT.md step 3)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::error::The API did not become healthy after the restore. Read its log on the server: cd ~/lynia && docker compose logs --tail 40 api"
          exit 1

      - name: Remove the decrypted files
        if: always()
        run: rm -rf "$RUNNER_TEMP/x"
