name: CodeQL

# Static application security testing (SAST) for the TypeScript/JavaScript codebase. Runs on PRs, on
# push to main, and weekly so newly-disclosed query packs catch old code. Results surface in the repo's
# Security → Code scanning tab. See docs/SECURITY.md P1-1.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # Mondays 03:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required to upload CodeQL results
      contents: read
      # Read-only: the analyze step reads its own workflow run (GitHub's documented requirement for private
      # repos). Without it a run can fail after a finished scan with "Resource not accessible by integration".
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-extended
          # Excludes only the vendored design mirror — see the file for why it is unscannable.
          config-file: .github/codeql/config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
