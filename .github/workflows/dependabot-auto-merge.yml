# Auto-merge Dependabot PRs once CI is green, so routine bumps land without
# manual approval (docs/SECURITY.md P1-1). Majors are excluded here too, on
# top of the ignore rules in dependabot.yml, as a defense-in-depth backstop.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # No self-approve step: the default GITHUB_TOKEN / github-actions[bot] is
      # not permitted to approve pull requests ("GitHub Actions is not permitted
      # to approve pull requests"), so `gh pr review --approve` always errors and
      # blocks the merge step. This matches GitHub's documented Dependabot
      # auto-merge pattern, which enables auto-merge without an approval. If
      # branch protection on the base requires an approving review, exempt
      # Dependabot PRs or supply a review from a separate token — Actions cannot
      # satisfy it itself.
      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: "${{ github.event.pull_request.html_url }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
