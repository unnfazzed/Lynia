# Automated dependency-update PRs so security patches land promptly (docs/SECURITY.md P1-1).
version: 2
updates:
  # lyniago.com deploy tooling (wrangler), pinned by its own lockfile outside the pnpm workspace
  # (docs/WEBSITE.md). A bump here changes only the tool that uploads the static site.
  - package-ecosystem: npm
    directory: "/apps/website/deploy"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  # npm / pnpm workspace — grouped to keep PR volume manageable; security updates always come through.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Groups take minor/patch only. One major inside a group marks the WHOLE group semver-major, so the
    # auto-merge workflow skips it and every safe patch in it waits too (#1090: vitest 5 held back 12
    # routine bumps). Majors now arrive one PR each. PostHog is also kept out of the group: its
    # 4.70 -> 4.79 minor alone added ~48 KB to the Android bundle (#1079), and the size budget
    # (docs/APP-SIZE.md) must fail that PR, not the 20 other bumps it was batched with.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
        exclude-patterns: ["posthog-react-native"]
    # Majors on these stacks are coupled migrations, not routine bumps — a grouped major here has
    # broken CI before (prisma CLI 7 against @prisma/client 5; jest-expo 57 against Expo SDK 52).
    # Each is upgraded deliberately in its own PR: Prisma with prisma.config.ts/adapters, Nest with
    # the Express major it drags in, the jest/react-test-renderer stack only with the Expo SDK,
    # TypeScript majors with the deprecations they hard-error on.
    ignore:
      # @sentry/react-native 6 -> 8 landed as a grouped production bump (02ef04c) and added ~720 KB
      # to the Android Hermes bundle — over the size budget, and invisible at review time because the
      # same batch broke the Metro export (lucide's dropped `history` icon), so the size job failed
      # before it could measure. A crash-reporter major is a coupled migration like the rest of this
      # list: upgrade it deliberately, in its own PR, measuring the bundle (docs/APP-SIZE.md) and
      # re-checking the Sentry init/API surface — never as one line in an 18-package batch.
      # Expo SDK 54 also pins it (`bundledNativeModules.json`: ~7.2.0), so a minor is off-SDK too.
      # #1079's 7.2 -> 7.13 was one of three SDK-pinned packages in that batch.
      - dependency-name: "@sentry/react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # react / react-dom are exact pins: 19.1.0 is what Expo SDK 54 and react-native 0.81.5's bundled
      # renderer require, and React throws "Incompatible React versions" on any skew, a patch included.
      # The web apps sit on 18.3.1, the last React 18. react-test-renderer must equal react exactly
      # (#1090 tried 19.3.0 against react 19.1.0). All of them move only with an Expo SDK upgrade.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react-test-renderer"
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Metro-resolution shim for posthog-react-native's UNDECLARED dep (apps/mobile pins it so
      # Metro can resolve `@babel/runtime/*` from posthog's compiled dist — see that package.json).
      # @babel/runtime 8 removed the `./regenerator` subpath posthog's dist requires, so the 7→8
      # grouped bump (#356) broke `expo export` (caught by the mobile-bundle-size CI guard). The
      # major can only move when posthog's dist stops requiring the removed subpath.
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      # babel-preset-expo moves in lockstep with the Expo SDK: 54.x pairs with this app's expo ~54.0 /
      # react-native 0.81.5 (before SDK 54 its numbers didn't even match the SDK's — SDK 52 paired
      # with 12.x). A grouped dev-deps bump (#892, then again #897 right after the first fix) jumped
      # it from 12.x straight to 57.x, which stops down-leveling ES private class fields for Hermes
      # and breaks every Android JS bundle export ("private properties are not supported") plus
      # mobile jest (can't resolve 'expo/virtual/env' under the same broken preset) — both silently,
      # since #897's auto-merge went through despite those exact checks failing (see the Dependabot
      # auto-merge workflow comment; branch protection may not mark them required). Move this only
      # in a deliberate PR paired with an actual Expo SDK upgrade, the same discipline as
      # expo/expo-*/react-native above.
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]
      # Expo-SDK-managed native layer — these packages' versions are pinned by the Expo SDK, not
      # chosen independently, and must move in lockstep during a deliberate `expo install` / SDK
      # upgrade. They are 0.x, so Dependabot classifies a breaking bump (e.g. react-native
      # 0.76 -> 0.86, expo-notifications 0.29 -> 0.32) as a *minor*, which a major-only ignore
      # misses — that skew broke mobile typecheck against Expo SDK 52 (AbortSignal/global.AbortSignal
      # and the NotificationBehavior shouldShowBanner/shouldShowList split). Hold them at patch-only;
      # minor/major come in as part of the SDK bump, never on their own.
      # react-native gets no updates at all, patches included: the SDK pins it exactly (0.81.5), and a
      # patch can move its bundled react-native-renderer. #1079's 0.81.6 shipped renderer 19.1.4
      # against react 19.1.0, and 226 mobile tests failed with "Incompatible React versions".
      - dependency-name: "react-native"
      # @expo/* (metro-runtime, config-plugins, ...) carries the SDK's own version numbers, so a
      # "major" is a jump to another SDK. #1079 moved @expo/metro-runtime 6 -> 57 and #1090 moved
      # @expo/config-plugins 54 -> 58, both against expo ~54.0.
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Keep GitHub Actions pinned versions current (also surfaces action security advisories).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
